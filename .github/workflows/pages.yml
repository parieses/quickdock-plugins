# 插件主页部署（GitHub Pages）
# push 到 main 时重新部署 docs/ 作为 Pages 站点。
# 前置：仓库 Settings → Pages → Source 选 "GitHub Actions"（一次性配置）。

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate plugin home page
        run: python3 gen_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
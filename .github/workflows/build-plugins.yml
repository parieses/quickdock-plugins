# 插件自动打包 Workflow（仅 Windows）
name: Build Plugins

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - '**/plugin.json'
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '**/icon.svg'
      - '**/frontend/**'
      - '.github/workflows/build-plugins.yml'
  workflow_dispatch: {}

jobs:
  build:
    name: Package changed plugins (windows)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Detect changed plugin dirs
        id: changed
        shell: bash
        run: |
          base="${{ github.event.before }}"
          echo "base: $base, head: ${{ github.sha }}"
          plugins=""
          if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
            echo "首次推送或手动触发，执行全量打包"
            plugins=$(find . -mindepth 2 -maxdepth 2 -name plugin.json | sed 's|^\./||; s|/plugin.json$||' | sort -u | tr '\n' ' ')
          else
            echo "检测变更文件..."
            all_changed=$(git diff --name-only "$base" HEAD)
            echo "所有变更文件:"
            echo "$all_changed"
            echo "变更文件数: $(echo "$all_changed" | wc -l)"
            
            # 方法1: 检测 plugin.json 变化
            plugins=$(echo "$all_changed" | grep '/plugin.json' | sed 's|/plugin.json$||' | sort -u | tr '\n' ' ' || true)
            
            # 方法2: 检测 .go/.mod/.sum 变化
            go_changed=$(echo "$all_changed" | grep -E '\.(go|mod|sum)$' | sed 's|/[^/]*$||' | sort -u)
            for dir in $go_changed; do
              if [ -d "$dir" ] && [ -f "$dir/plugin.json" ]; then
                plugins="$plugins $dir"
              fi
            done
            
            # 方法3: 检测 frontend/ 变化
            frontend_changed=$(echo "$all_changed" | grep '/frontend/' | sed 's|/frontend/.*||' | sort -u)
            for dir in $frontend_changed; do
              if [ -d "$dir" ] && [ -f "$dir/plugin.json" ]; then
                plugins="$plugins $dir"
              fi
            done
            
            plugins=$(echo "$plugins" | tr ' ' '\n' | grep -v '^
            echo "检测到的插件: [$plugins]"
          fi
          echo "changed_plugins=$plugins" >> "$GITHUB_OUTPUT"

      - name: Build pdfcpu for pdf-toolkit
        if: contains(steps.changed.outputs.changed_plugins, 'pdf-toolkit')
        shell: bash
        run: |
          git clone --depth 1 --branch v0.15.0 https://github.com/pdfcpu/pdfcpu.git /tmp/pdfcpu-src
          cd /tmp/pdfcpu-src
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/pdf-toolkit/pdfcpu.exe" ./cmd/pdfcpu
          ls -lh "$GITHUB_WORKSPACE/pdf-toolkit/pdfcpu.exe"

      - name: Package plugins (windows)
        shell: bash
        run: |
          changed="${{ steps.changed.outputs.changed_plugins }}"
          echo "要打包的插件: [$changed]"
          if [ -z "$changed" ]; then
            echo "无插件变更，跳过打包"
            exit 0
          fi
          for dir in $changed; do
            if [ -f "$dir/plugin.json" ]; then
              echo "==> 打包插件: $dir（windows）"
              python3 build.py "$dir" --platform windows
            else
              echo "==> 跳过 $dir（plugin.json 不存在）"
            fi
          done

      - name: Show produced zips
        id: zips
        shell: bash
        run: |
          ls -lh dist/ 2>/dev/null || true
          if ls dist/*.zip >/dev/null 2>&1; then
            echo "has_zip=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish zips to 'latest' release
        if: steps.zips.outputs.has_zip == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Plugin Builds
          body: |
            Auto-built Windows install packages for QuickDock plugins.
          files: dist/*.zip
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: steps.zips.outputs.has_zip == 'true'
        with:
          name: plugin-zips
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 30
 | sort -u | tr '\n' ' ' || true)
            echo "检测到的插件: [$plugins]"
          fi
          echo "changed_plugins=$plugins" >> "$GITHUB_OUTPUT"

      

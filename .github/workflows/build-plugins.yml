# 插件自动打包 Workflow（按各插件 plugin.json platforms 字段多平台打包）
name: Build Plugins

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - '**/plugin.json'
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '**/icon.svg'
      - '**/frontend/**'
      - '.github/workflows/build-plugins.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: '强制打包全部插件（忽略变更检测，用于补打之前因工作流故障漏打的版本）'
        type: boolean
        default: false

jobs:
  build:
    name: Package changed plugins (per platforms)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Detect changed plugin dirs
        id: changed
        shell: bash
        run: |
          plugins=""
          force="${{ github.event.inputs.force_all }}"
          if [ "$force" = "true" ]; then
            echo "手动触发：强制全量打包所有插件"
            plugins=$(find . -mindepth 2 -maxdepth 2 -name plugin.json | sed 's|^\./||; s|/plugin.json$||' | sort -u | tr '\n' ' ')
          else
            base="${{ github.event.before }}"
            echo "base: $base, head: ${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
              echo "首次推送或手动触发，执行全量打包"
              plugins=$(find . -mindepth 2 -maxdepth 2 -name plugin.json | sed 's|^\./||; s|/plugin.json$||' | sort -u | tr '\n' ' ')
            else
              echo "检测变更文件..."
              all_changed=$(git diff --name-only "$base" "${{ github.sha }}" || git diff --name-only "$base" HEAD || true)
              echo "所有变更文件:"
              echo "$all_changed"
              echo "变更文件数: $(echo "$all_changed" | grep -c . || true)"
              
              # 方法1: 检测 plugin.json 变化
              plugins=$(echo "$all_changed" | grep '/plugin.json' | sed 's|/plugin.json$||' | sort -u | tr '\n' ' ' || true)
              
              # 方法2: 检测 .go/.mod/.sum 变化
              go_changed=$(echo "$all_changed" | grep -E '\.(go|mod|sum)$' | sed 's|/[^/]*$||' | sort -u || true)
              for dir in $go_changed; do
                if [ -d "$dir" ] && [ -f "$dir/plugin.json" ]; then
                  plugins="$plugins $dir"
                fi
              done
              
              # 方法3: 检测 frontend/ 变化
              frontend_changed=$(echo "$all_changed" | grep '/frontend/' | sed 's|/frontend/.*||' | sort -u || true)
              for dir in $frontend_changed; do
                if [ -d "$dir" ] && [ -f "$dir/plugin.json" ]; then
                  plugins="$plugins $dir"
                fi
              done
              
              plugins=$(echo "$plugins" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' || true)
            fi
          fi
          echo "检测到的插件: [$plugins]"
          echo "changed_plugins=$plugins" >> "$GITHUB_OUTPUT"

      - name: Static checks (frontend links / styles / manifest)
        shell: bash
        run: |
          # 断链、未定义样式类、未定义 CSS 变量、plugin.json 不合法 —— 这些都不会让编译失败，
          # 但会让用户装上一个排版塌掉/按钮没颜色的插件。全量检查（77 个插件约 1 秒），
          # 避免「改了 A 顺手弄坏 B」这种情况落到发布包里。
          python3 tools/check_plugins.py

      - name: Frontend script syntax
        shell: bash
        run: |
          # 每个 frontend/index.html 里的 <script> 块逐个 node --check。HTML 里的内联脚本
          # 不过编译期，语法错只在用户打开插件时才炸，而那时是「白屏+控制台报错」，
          # 极难定位到是哪个插件。106 个块约 1 秒跑完。
          node tools/check_frontend_js.mjs

      - name: Shared code single-source check
        shell: bash
        run: |
          # qd-theme.css / components.css / qdlog.go 是跨插件复用的共享代码，单一来源在
          # templates/。改一处要手动同步几十份极易漏改，导致主题/日志不一致。本检查断言每个
          # 副本与 templates/ 权威一致（photo-library 的 qd-theme.css 为登记 fork，仅核对
          # :root 主题令牌）。漂移即失败，需要先跑 tools/sync_shared.py。
          python3 tools/check_shared.py --stats

      - name: Build pdfcpu for pdf-toolkit
        if: contains(steps.changed.outputs.changed_plugins, 'pdf-toolkit')
        shell: bash
        run: |
          git clone --depth 1 --branch v0.15.0 https://github.com/pdfcpu/pdfcpu.git /tmp/pdfcpu-src
          cd /tmp/pdfcpu-src
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/pdf-toolkit/pdfcpu.exe" ./cmd/pdfcpu
          ls -lh "$GITHUB_WORKSPACE/pdf-toolkit/pdfcpu.exe"

      - name: Package plugins (per platforms)
        shell: bash
        run: |
          changed="${{ steps.changed.outputs.changed_plugins }}"
          echo "要打包的插件: [$changed]"
          if [ -z "$changed" ]; then
            echo "无插件变更，跳过打包"
            exit 0
          fi
          for dir in $changed; do
            if [ -f "$dir/plugin.json" ]; then
              echo "==> 打包插件: $dir（按 plugin.json platforms 字段逐一打包）"
              python3 build.py "$dir"
            else
              echo "==> 跳过 $dir（plugin.json 不存在）"
            fi
          done

      - name: Show produced zips
        id: zips
        shell: bash
        run: |
          ls -lh dist/ 2>/dev/null || true
          if ls dist/*.zip >/dev/null 2>&1; then
            echo "has_zip=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish zips to 'latest' release
        if: steps.zips.outputs.has_zip == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Plugin Builds
          body: |
            Auto-built install packages for QuickDock plugins (platforms per each plugin.json).
          files: dist/*.zip
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: steps.zips.outputs.has_zip == 'true'
        with:
          name: plugin-zips
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 30

      

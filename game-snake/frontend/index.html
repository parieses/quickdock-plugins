<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<link rel="stylesheet" href="qd-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="s-app">
  <div class="s-head">
    <div class="s-title">🐍 贪吃蛇</div>
    <div class="s-scores">
      <div class="s-score"><span>分数</span><b id="score">0</b></div>
      <div class="s-score"><span>最佳</span><b id="best">0</b></div>
      <div class="s-score"><span>最长</span><b id="bestLen">0</b></div>
    </div>
  </div>
  <div class="s-bar">
    <span class="s-tip" id="tip">方向键 / WASD 移动 · 空格暂停</span>
    <div class="s-actions">
      <button class="p-btn" id="wrap" type="button">穿墙: 关</button>
      <button class="p-btn" id="pause" type="button">暂停</button>
      <button class="p-btn p-btn-primary" id="restart" type="button">重开</button>
    </div>
  </div>
  <canvas id="cv" class="s-canvas" width="440" height="440"></canvas>
  <div class="s-over" id="over" hidden>
    <div class="s-over-text" id="overText">游戏结束</div>
    <button class="p-btn p-btn-primary" id="retry" type="button">再来一局</button>
  </div>
</div>
<script src="app.js"></script>

<!-- 跟随宿主浅色/深色主题 -->
  <script>
  /* qd-theme-follow：把宿主的浅色/深色同步到 <html data-theme>
     （qd-theme.css 里浅色是 html[data-theme="light"] 的变量覆盖）。
     三级取值，任意一级拿到就生效，互为兜底：
       1) 宿主消息 plugin:theme / plugin:init（宿主若补上独立窗口的广播即走这条）
       2) 同源 opener / parent 窗口的 <html data-theme>，并监听其变化、窗口 focus 时重读
       3) 系统偏好 prefers-color-scheme（宿主主题=「跟随系统」时有效）
     独立注册，不改动页面原有逻辑。 */
  (function () {
    var el = document.documentElement;
    function set(t) { if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); }
    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || !d.type) return;
      if (d.type === 'plugin:theme' || d.type === 'plugin:init') { if (d.data && d.data.theme) set(d.data.theme); }
    });
    /* 2) 同源窗口 */
    var w = null;
    try {
      if (window.opener && window.opener !== window) w = window.opener;
      else if (window.parent && window.parent !== window) w = window.parent;
    } catch (err) { w = null; }
    function fromWin() {
      try { var t = w.document.documentElement.getAttribute('data-theme'); if (t) { set(t); return true; } return false; }
      catch (err) { return false; }
    }
    if (w && fromWin()) {
      try {
        new MutationObserver(fromWin).observe(w.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      } catch (err) {}
      window.addEventListener('focus', fromWin);
    }
    /* 3) 系统偏好兜底：仅在还没拿到明确主题时生效 */
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var sys = function () { if (!el.getAttribute('data-theme')) set(mq.matches ? 'light' : 'dark'); };
      sys();
      if (mq.addEventListener) mq.addEventListener('change', sys);
    }
  })();
  </script>
</body>
</html>

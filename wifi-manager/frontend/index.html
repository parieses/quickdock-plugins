<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WiFi 管理器</title>
<link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">
<style>
.w-status{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg-tertiary);border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px}
.w-status-name{color:var(--accent);font-weight:500}
.w-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);min-height:32px;font-size:13px}
.w-item:hover{background:var(--bg-hover)}
.w-signal{font-size:10px;color:var(--text-muted);min-width:40px;flex-shrink:0}
.w-ssid{flex:1;color:var(--text-primary)}
.w-auth{font-size:10px;color:var(--text-muted);flex-shrink:0}
.w-pwd{font-size:11px;color:var(--accent);font-family:var(--font-mono);background:var(--bg-tertiary);padding:2px 8px;border-radius:4px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-pwd-btn{height:24px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-tertiary);color:var(--text-muted);font-size:10px;cursor:pointer;font-family:inherit}
.w-pwd-btn:hover{color:var(--text-primary)}
.w-empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-muted)}
.w-err{background:var(--bg-tertiary);color:var(--text-secondary);font-family:var(--font-mono);font-size:11px;padding:6px 10px;border-bottom:1px solid var(--border);user-select:text;white-space:pre-wrap;word-break:break-all}
</style>
<script>
/* QuickDock sandbox 剪贴板桥接：iframe 内 navigator.clipboard 被 Permissions-Policy 禁用 */
window.__cpSeq=0;
window.execCopyFallback=function(t){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';a.style.top='0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');document.body.removeChild(a);return ok}catch(e){return false}};
window.copyViaHost=function(t,cb){var id='cp_'+(++window.__cpSeq),done=false;function onMsg(e){var d=e&&e.data;if(d&&d.type==='plugin:copy-result'&&d.id===id){done=true;window.removeEventListener('message',onMsg);cb&&cb(!!d.ok)}}window.addEventListener('message',onMsg);parent.postMessage({type:'plugin:copy',id:id,text:t},'*');setTimeout(function(){if(!done){window.removeEventListener('message',onMsg);cb&&cb(window.execCopyFallback(t))}},300)};
</script>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></symbol><symbol id="icon-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></symbol><symbol id="icon-git-branch" viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></symbol><symbol id="icon-trash-2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></symbol><symbol id="icon-shield-alert" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></symbol><symbol id="icon-hard-drive" viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12"></line><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></symbol><symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></symbol><symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></symbol><symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></symbol><symbol id="icon-gauge" viewBox="0 0 24 24"><path d="M12 15l-2-2"></path><path d="M19.07 4.93a10 10 0 1 1-14.14 0"></path><path d="M12 2v4"></path></symbol><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>
</head>
<body>
<div class="p-app">
  <div class="p-toolbar">
    <button class="btn p-btn-primary" id="btnScan">↻ 扫描网络</button>
    <span class="p-spacer"></span>
    <span class="p-muted" id="countLabel"></span>
  </div>
  <div class="w-status" id="statusBar">
    <span class="p-label">当前连接：</span>
    <span id="currentSSID" class="p-muted">检测中…</span>
  </div>
  <div class="w-err" id="errMsg" style="display:none"></div>
  <div class="p-list" id="wifiList"><div class="w-empty">点击扫描查看附近 WiFi</div></div>
</div>
<script>
function $(id){return document.getElementById(id)}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function pluginExec(cmd,data){return new Promise(function(resolve,reject){var id=Date.now()+'_'+Math.random().toString(36).slice(2,6),timer=setTimeout(function(){window.removeEventListener('message',handler);reject(new Error('响应超时，请检查插件状态'))},20000);window.parent.postMessage({type:'plugin:execute',id:id,command:cmd,input:{text:JSON.stringify(data||{})}},'*');var handler=function(e){if(e.data&&e.data.type==='plugin:result'){clearTimeout(timer);window.removeEventListener('message',handler);if(e.data.error)reject(new Error(e.data.error));else resolve(e.data.data)}};window.addEventListener('message',handler)})}
function showPwd(ssid,btn){pluginExec('wifi-pwd',{ssid:ssid}).then(function(data){try{var d=typeof data==='string'?JSON.parse(data):data;var pwd=d.password||d.key||'';if(pwd){var div=document.createElement('span');div.className='w-pwd';div.textContent=pwd;btn.parentNode.replaceChild(div,btn);window.copyViaHost(pwd,function(){})}else{showErr(d.message||'无法获取密码')}}catch(e){showErr('解析失败: '+e.message)}}).catch(function(e){showErr('获取密码失败: '+e.message)})}
function showErr(m){var e=$('errMsg');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none'},15000)}
function scan(){var list=$('wifiList'),count=$('countLabel');list.innerHTML='<div class="w-empty">扫描中…</div>';pluginExec('wifi-scan',{}).then(function(data){try{var obj=typeof data==='string'?JSON.parse(data):data;var networks=obj.networks||obj||[];if(!networks||!networks.length){list.innerHTML='<div class="w-empty">未发现 WiFi 网络</div>';count.textContent='';return}
count.textContent=networks.length+' 个网络';list.innerHTML='';networks.forEach(function(n){var bars=n.signal>80?'▂▄▆█':n.signal>60?'▂▄▆':n.signal>40?'▂▄':'▂';var item=document.createElement('div');item.className='w-item';var sig=document.createElement('span');sig.className='w-signal';sig.textContent=bars;var ssid=document.createElement('span');ssid.className='w-ssid';ssid.textContent=n.ssid||'';var auth=document.createElement('span');auth.className='w-auth';auth.textContent=n.auth||'';var btn=document.createElement('button');btn.className='w-pwd-btn';btn.textContent='密码';btn.addEventListener('click',function(){showPwd(n.ssid,btn)});item.appendChild(sig);item.appendChild(ssid);item.appendChild(auth);item.appendChild(btn);list.appendChild(item)})}catch(e){list.innerHTML='<div class="w-empty">解析失败: '+escapeHtml(e.message)+'</div>'}}).catch(function(e){list.innerHTML='<div class="w-empty">扫描失败: '+escapeHtml(e.message)+'</div>'})}
$('btnScan').addEventListener('click',scan)
// 自动扫描（不依赖 plugin:init postMessage，Blob iframe 下 postMessage 可能被拦截）
setTimeout(scan, 500)
// 监听 plugin:init 消息获取当前连接状态
window.addEventListener('message',function loadOnInit(e){if(e.data&&e.data.type==='plugin:init'){window.removeEventListener('message',loadOnInit);pluginExec('wifi-current',{}).then(function(data){try{var d=typeof data==='string'?JSON.parse(data):data;if(d.ssid)$('currentSSID').textContent=d.ssid;if(d.band)$('currentSSID').textContent+=' ('+d.band+')'}catch(e){}}).catch(function(){})}})
</script>
</body>
</html>

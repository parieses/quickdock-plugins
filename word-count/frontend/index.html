<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>字数统计</title>
<link rel="stylesheet" href="qd-theme.css">
<link rel="stylesheet" href="components.css">
<style>
body{margin:0}
.app{display:flex;flex-direction:column;height:100vh;padding:12px;gap:10px;box-sizing:border-box}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0}
.stat{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.stat .n{font-size:20px;font-weight:600;color:var(--text-primary)}
.stat .l{font-size:11px;color:var(--text-muted);margin-top:2px}
#ta{flex:1;width:100%;resize:none;padding:12px;font-size:14px;line-height:1.6;font-family:var(--font-mono);background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius);box-sizing:border-box}
.bar{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{height:32px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{color:var(--text-primary)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#cnt{font-size:12px;color:var(--text-muted)}
</style>
</head>
<body>
<div class="app">
  <div class="stats" id="stats"></div>
  <textarea id="ta" placeholder="粘贴或输入文本，实时统计…" spellcheck="false"></textarea>
  <div class="bar">
    <span id="cnt">0 字符</span>
    <span style="flex:1"></span>
    <button class="btn" id="clear">清空</button>
    <button class="btn primary" id="copy">复制统计</button>
  </div>
</div>
<script>
window.__cpSeq=0;
window.copyViaHost=function(t,cb){var id='cp_'+(++window.__cpSeq),done=false;function onMsg(e){var d=e&&e.data;if(d&&d.type==='plugin:copy-result'&&d.id===id){done=true;window.removeEventListener('message',onMsg);cb&&cb(!!d.ok)}}window.addEventListener('message',onMsg);parent.postMessage({type:'plugin:copy',id:id,text:t},'*');setTimeout(function(){if(!done)window.removeEventListener('message',onMsg)},300)};
var ta=document.getElementById('ta'),statsEl=document.getElementById('stats'),cnt=document.getElementById('cnt');
function count(){
  var s=ta.value;
  var chars=s.length;
  var charsNoSpace=s.replace(/\s/g,'').length;
  var cjk=(s.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g)||[]).length;
  var enWords=(s.replace(/[\u4e00-\u9fff\u3400-\u4dbf]/g,' ').match(/[A-Za-z0-9']+/g)||[]).length;
  var words=cjk+enWords;
  var lines=s===''?0:s.split('\n').length;
  var paras=s.trim()===''?0:s.trim().split(/\n\s*\n/).filter(function(p){return p.trim()}).length;
  var bytes=new TextEncoder().encode(s).length;
  var min=Math.max(1,Math.round(words/300));
  var data=[['字符数',chars],['不含空格',charsNoSpace],['词数',words],['中文字',cjk],['行数',lines],['段落数',paras],['字节(UTF-8)',bytes],['阅读(分)',min],['空行',lines-(s.split(/\n/).filter(function(x){return x.trim()===''}).length)]];
  statsEl.innerHTML=data.map(function(d){return '<div class="stat"><div class="n">'+d[1]+'</div><div class="l">'+d[0]+'</div></div>'}).join('');
  cnt.textContent=chars+' 字符 · '+words+' 词';
}
function copyStats(){var txt=Array.from(statsEl.children).map(function(c){return c.querySelector('.l').textContent+': '+c.querySelector('.n').textContent}).join('\n');window.copyViaHost(txt)}
ta.addEventListener('input',count);
document.getElementById('copy').addEventListener('click',copyStats);
document.getElementById('clear').addEventListener('click',function(){ta.value='';count();ta.focus()});
window.addEventListener('message',function(e){if(e.data&&e.data.type==='plugin:init'&&e.data.data&&e.data.data.text){ta.value=e.data.data.text;count()}});
count();
</script>

<!-- 跟随宿主浅色/深色主题 -->
  <script>
  /* qd-theme-follow：把宿主的浅色/深色同步到 <html data-theme>
     （qd-theme.css 里浅色是 html[data-theme="light"] 的变量覆盖）。
     三级取值，任意一级拿到就生效，互为兜底：
       1) 宿主消息 plugin:theme / plugin:init（宿主若补上独立窗口的广播即走这条）
       2) 同源 opener / parent 窗口的 <html data-theme>，并监听其变化、窗口 focus 时重读
       3) 系统偏好 prefers-color-scheme（宿主主题=「跟随系统」时有效）
     独立注册，不改动页面原有逻辑。 */
  (function () {
    var el = document.documentElement;
    function set(t) { if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); }
    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || !d.type) return;
      if (d.type === 'plugin:theme' || d.type === 'plugin:init') { if (d.data && d.data.theme) set(d.data.theme); }
    });
    /* 2) 同源窗口 */
    var w = null;
    try {
      if (window.opener && window.opener !== window) w = window.opener;
      else if (window.parent && window.parent !== window) w = window.parent;
    } catch (err) { w = null; }
    function fromWin() {
      try { var t = w.document.documentElement.getAttribute('data-theme'); if (t) { set(t); return true; } return false; }
      catch (err) { return false; }
    }
    if (w && fromWin()) {
      try {
        new MutationObserver(fromWin).observe(w.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      } catch (err) {}
      window.addEventListener('focus', fromWin);
    }
    /* 3) 系统偏好兜底：仅在还没拿到明确主题时生效 */
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var sys = function () { if (!el.getAttribute('data-theme')) set(mq.matches ? 'light' : 'dark'); };
      sys();
      if (mq.addEventListener) mq.addEventListener('change', sys);
    }
  })();
  </script>
<!-- 运行期异常上报：未捕获异常 / Promise 拒绝 -> 宿主 plugin-YYYYMMDD.log（E 级） -->
<script>
(function () {
  if (window.__qdErrHook) return
  window.__qdErrHook = true
  var sent = 0, last = {}
  function report(kind, msg, stack) {
    try {
      if (sent >= 20) return // 单页最多 20 条，防止循环报错刷屏
      var key = kind + '|' + msg
      var now = Date.now()
      if (last[key] && now - last[key] < 10000) return // 同一错误 10s 内只报一次
      last[key] = now
      sent++
      if (typeof window.qdHostCall !== 'function') return
      window.qdHostCall('log.error', {
        message: '前端' + kind + ': ' + msg + (stack ? ' | ' + String(stack).slice(0, 600) : '')
      }).catch(function () {})
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    report('未捕获异常', (e && e.message) || 'unknown', e && e.error && e.error.stack)
  })
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason
    report('Promise 拒绝', (r && r.message) || String(r), r && r.stack)
  })
})()
</script>
</body>
</html>

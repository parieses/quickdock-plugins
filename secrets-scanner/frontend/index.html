<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>敏感信息扫描</title>
<link rel="stylesheet" href="qd-theme.css">
<link rel="stylesheet" href="components.css">
<style>
.app{display:flex;flex-direction:column;height:100%;box-sizing:border-box;gap:var(--sp-2);padding:var(--sp-3);overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2)}
.bar .grow{flex:1;min-width:80px}
.lbl{font-size:var(--fs-sm);color:var(--text-secondary);white-space:nowrap}
.rules{flex:0 0 auto;max-height:168px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-secondary);padding:var(--sp-2)}
.rgroup{margin-bottom:6px}
.rgroup:last-child{margin-bottom:0}
.rhead{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--text-muted);margin-bottom:4px}
.rhead .lnk{margin-left:auto;color:var(--accent);cursor:pointer;font-size:var(--fs-xs)}
.rchks{display:flex;flex-wrap:wrap;gap:4px 10px}
.rchk{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--text-primary);cursor:pointer;user-select:none}
.rchk input{margin:0}
.sev{font-size:var(--fs-xs);padding:1px 6px;border-radius:var(--radius-pill);font-weight:var(--fw-medium);line-height:1.4}
.sev-high{background:var(--danger-soft);color:var(--danger)}
.sev-medium{background:rgba(250,159,39,.16);color:#c47f12}
.sev-low{background:var(--bg-tertiary);color:var(--text-secondary)}
.cat{font-size:var(--fs-xs);color:var(--text-muted);border:1px solid var(--border);padding:1px 6px;border-radius:var(--radius-pill)}
.progress{height:4px;background:var(--bg-tertiary);border-radius:var(--radius-pill);overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--accent);border-radius:var(--radius-pill);transition:width .2s linear}
.statusline{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);font-size:var(--fs-sm);color:var(--text-secondary)}
.statusline b{color:var(--text-primary);font-weight:var(--fw-medium)}
.cur{font-family:var(--font-mono);font-size:var(--fs-xs);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-secondary)}
table.res{width:100%;border-collapse:collapse;font-size:var(--fs-xs)}
table.res th{position:sticky;top:0;background:var(--bg-tertiary);color:var(--text-secondary);text-align:left;padding:6px 8px;font-weight:var(--fw-medium);white-space:nowrap;z-index:1}
table.res td{padding:5px 8px;border-top:1px solid var(--border);color:var(--text-primary);vertical-align:top}
table.res tr:hover td{background:var(--bg-tertiary)}
td.pth{font-family:var(--font-mono);word-break:break-all;max-width:360px}
td.sevcell{white-space:nowrap}
td.val{font-family:var(--font-mono);word-break:break-all;max-width:300px}
td.val .rv{color:var(--danger);cursor:pointer}
.mono{font-family:var(--font-mono);font-size:var(--fs-xs)}
.dim{color:var(--text-muted)}
.note{font-size:var(--fs-xs);color:var(--text-muted);line-height:1.6}
.hint{font-size:var(--fs-sm);color:var(--text-muted)}
.hint.err{color:var(--danger)}
.empty{padding:var(--sp-4);text-align:center;font-size:var(--fs-sm);color:var(--text-muted)}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button id="pick" class="btn btn-sm">选择目录</button>
    <input id="path" class="input input-sm grow" placeholder="项目目录，如 E:\project（会递归扫描子目录）">
  </div>

  <div class="rules" id="rulesPanel"><div class="empty">加载规则中…</div></div>

  <div class="bar">
    <label class="rchk"><input type="checkbox" id="gitHist"> 含 Git 历史（git log -p，可发现已提交过的密钥）</label>
    <span class="lbl">单文件上限</span>
    <input id="maxSize" class="input input-sm" style="width:68px;flex:none" value="2"> <span class="lbl">MB</span>
    <div class="grow"></div>
    <button id="scan" class="btn btn-sm">开始扫描</button>
    <button id="stop" class="btn btn-ghost btn-sm hidden">停止</button>
  </div>

  <div class="progress"><div id="fill" class="progress-fill"></div></div>

  <div class="statusline">
    <span id="phase">就绪</span>
    <span>已扫 <b id="cnt">0</b> 个文件</span>
    <span id="cur" class="cur"></span>
    <span id="eta"></span>
    <span id="hint" class="hint"></span>
  </div>

  <div class="bar" id="restools">
    <span class="lbl">严重度</span>
    <select id="fSev" class="select select-sm">
      <option value="">全部</option>
      <option value="high">高</option>
      <option value="medium">中</option>
      <option value="low">低</option>
    </select>
    <span class="lbl">类别</span>
    <select id="fCat" class="select select-sm">
      <option value="">全部</option>
      <option value="secret">密钥/凭证</option>
      <option value="token">令牌</option>
      <option value="key">私钥</option>
      <option value="pii">个人身份</option>
    </select>
    <input id="search" class="input input-sm grow" placeholder="过滤路径 / 规则 / 命中值…">
    <label class="rchk"><input type="checkbox" id="reveal"> 显示明文</label>
    <button id="export" class="btn btn-ghost btn-sm">导出</button>
  </div>

  <div class="wrap"><div id="list"><div class="empty">扫描后这里会列出命中的敏感信息（脱敏显示，勾选「显示明文」可见原值）</div></div></div>

  <div class="note">本工具只扫描你<b>明确选择</b>的目录，所有匹配都在本机完成、不上传。命中结果默认脱敏，请仅在你自己的项目里使用；发现密钥后应立即在对应平台<b>吊销并轮换</b>，而不是仅仅删除。身份证/手机号/银行卡等 PII 默认开启但误报较高，可按需关闭。</div>
</div>

<script>
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmtDur(s){
  s=Math.round(Number(s)||0)
  if(s<60) return s+' 秒'
  if(s<3600) return Math.floor(s/60)+' 分 '+(s%60)+' 秒'
  return Math.floor(s/3600)+' 小时 '+Math.floor((s%3600)/60)+' 分'
}
</script>
<script>
(function(){
  'use strict'
  var L10N = {
    'en-US': {
      '选择目录':'Select folder','开始扫描':'Scan','停止':'Stop','就绪':'Ready',
      '导出':'Export','显示明文':'Show cleartext','全部':'All'
    }
  }
  function L(k){
    var loc=document.documentElement.getAttribute('lang')||'zh-CN'
    var m=L10N[loc]||L10N[loc.split('-')[0]]||{}
    return (m&&m[k]!==undefined)?m[k]:k
  }
  function el(i){return document.getElementById(i)}
  function setHint(msg,isErr){var h=el('hint');h.textContent=msg||'';h.className=isErr?'hint err':'hint'}

  var seq=0, pend={}
  function send(command,input){
    return new Promise(function(res,rej){
      var id='ss_'+(++seq); pend[id]={res:res,rej:rej}
      parent.postMessage({type:'plugin:execute',id:id,command:command,input:input||{}},'*')
      setTimeout(function(){ var t=pend[id]; if(t){delete pend[id]; rej(new Error('后端 30 秒无响应'))} },30000)
    })
  }
  window.addEventListener('message',function(e){
    var d=e.data; if(!d) return
    if(d.type==='plugin:result'&&d.id&&pend[d.id]){
      var p=pend[d.id]; delete pend[d.id]
      if(d.error) p.rej(new Error(typeof d.error==='string'?d.error:(d.error.message||'后端错误')))
      else p.res(d.data)
      return
    }
    if(d.type==='plugin:theme'){
      var dd=d.data||{}
      if(dd.locale){ document.documentElement.setAttribute('lang',dd.locale); renderStatic() }
    }
    // 宿主桥接就绪信号：在此之前发的 plugin:execute 可能被丢弃，
    // 因此首屏规则加载延后到收到该信号（或 1.5s 兜底）再触发。
    if(d.type==='plugin:init'){ bootRules(); return }
  })

  var running=false, sid=null, timer=null
  var allRules=[], ruleMeta={}

  function renderStatic(){
    el('pick').textContent=L('选择目录')
    el('scan').textContent=L('开始扫描')
    el('stop').textContent=L('停止')
    el('export').textContent=L('导出')
  }

  /* ---------- 规则面板 ---------- */
  var CAT_NAME={secret:'密钥/凭证',token:'令牌',key:'私钥',pii:'个人身份'}
  function buildRules(res){
    // 后端回 {rules:[...]}；兼容宿主直接透传数组、或再包一层 data 的情况
    var rules = Array.isArray(res) ? res
      : ((res && (res.rules || (res.data && res.data.rules))) || [])
    allRules=rules
    ruleMeta={}
    var byCat={}
    allRules.forEach(function(r){ ruleMeta[r.id]=r; (byCat[r.category]=byCat[r.category]||[]).push(r) })
    var html=''
    Object.keys(byCat).forEach(function(cat){
      html+='<div class="rgroup"><div class="rhead"><span class="cat">'+escapeHtml(CAT_NAME[cat]||cat)+'</span>'+
            '<span class="lnk" data-cat="'+cat+'">全选</span><span class="lnk" data-cat-off="'+cat+'">全不选</span></div><div class="rchks">'
      byCat[cat].forEach(function(r){
        html+='<label class="rchk" title="'+escapeHtml(r.desc)+'">'+
              '<input type="checkbox" data-rule="'+escapeHtml(r.id)+'"'+(r.defaultOn?' checked':'')+'>'+
              escapeHtml(r.name)+
              '<span class="sev sev-'+r.severity+'">'+(r.severity==='high'?'高':(r.severity==='medium'?'中':'低'))+'</span></label>'
      })
      html+='</div></div>'
    })
    el('rulesPanel').innerHTML=html
    var links=el('rulesPanel').querySelectorAll('.lnk')
    for(var i=0;i<links.length;i++){
      links[i].addEventListener('click',function(){
        var on = this.hasAttribute('data-cat')
        var cat = this.getAttribute('data-cat')||this.getAttribute('data-cat-off')
        var boxes=el('rulesPanel').querySelectorAll('input[data-rule]')
        for(var j=0;j<boxes.length;j++){
          var r=ruleMeta[boxes[j].getAttribute('data-rule')]
          if(r&&r.category===cat) boxes[j].checked=on
        }
      })
    }
  }
  function enabledRules(){
    var boxes=el('rulesPanel').querySelectorAll('input[data-rule]:checked')
    var out=[]
    for(var i=0;i<boxes.length;i++){ out.push(boxes[i].getAttribute('data-rule')) }
    return out
  }

  /* ---------- 目录选择 ---------- */
  el('pick').addEventListener('click',function(){
    if(window.qdPickFolder) window.qdPickFolder({title:'选择要扫描的项目目录'}).then(function(p){ if(p) el('path').value=p })
    else setHint('当前宿主不支持目录选择，请手动粘贴路径',true)
  })

  /* ---------- 扫描 / 停止 ---------- */
  el('scan').addEventListener('click',function(){
    if(running) return
    var path=el('path').value.trim()
    if(!path){ setHint('请先选择或粘贴一个目录',true); return }
    var en=enabledRules()
    if(!en.length){ setHint('至少启用一条规则',true); return }
    setHint('')
    el('scan').disabled=true
    el('stop').className='btn btn-ghost btn-sm'
    el('list').innerHTML='<div class="empty">扫描进行中…</div>'
    var input={
      path:path, rules:en,
      maxFileSizeMB:Math.max(1,parseInt(el('maxSize').value,10)||2),
      gitHistory:el('gitHist').checked
    }
    send('scan',input).then(function(r){
      sid=r.sessionId
      running=true
      timer=setInterval(poll,500)
      poll()
    }).catch(function(e){ setHint(e.message,true); el('scan').disabled=false })
  })
  el('stop').addEventListener('click',function(){
    if(!running||!sid) return
    send('scan-cancel',{sessionId:sid}).then(function(){ setHint('已请求停止…') }).catch(function(e){ setHint(e.message,true) })
  })

  /* ---------- 轮询 ---------- */
  function poll(){
    if(!sid) return
    send('scan-poll',{sessionId:sid}).then(function(s){
      var total=s.totalEst||0, scanned=s.scanned||0
      var pct = total>0 ? Math.min(100, Math.round(scanned/total*100)) : (s.done?100:0)
      el('fill').style.width=pct+'%'
      el('cnt').textContent=scanned
      el('cur').textContent=s.current||''
      el('cur').title=s.current||''
      el('phase').textContent = s.canceled?'已停止':(s.done?'完成':'扫描中')
      el('eta').textContent = s.done||s.canceled ? '' : (s.elapsedMs>300?('耗时 '+fmtDur(s.elapsedMs/1000)):'')
      renderResults(s.matches||[])
      if(s.done||s.canceled){
        clearInterval(timer); timer=null; running=false
        el('scan').disabled=false
        el('stop').className='btn btn-ghost btn-sm hidden'
        el('fill').style.width='100%'
        var msg = (s.canceled?'已停止。':'扫描完成。')+' 共 '+scanned+' 个文件，命中 '+s.total+' 处'
        if(s.truncated) msg+='（结果已截断，超过上限）'
        setHint(msg,false)
      }
    }).catch(function(e){
      clearInterval(timer); timer=null; running=false
      el('scan').disabled=false
      setHint('轮询失败：'+e.message,true)
    })
  }

  /* ---------- 结果渲染 ---------- */
  var sevRank={high:3,medium:2,low:1}
  function renderResults(all){
    var fSev=el('fSev').value, fCat=el('fCat').value, q=el('search').value.trim().toLowerCase(), reveal=el('reveal').checked
    var rows=all.filter(function(m){
      if(fSev&&m.severity!==fSev) return false
      if(fCat&&m.category!==fCat) return false
      if(q){
        var hay=(m.file+' '+m.rule+' '+(reveal?m.value:m.masked)+' '+(ruleMeta[m.rule]?ruleMeta[m.rule].name:'')).toLowerCase()
        if(hay.indexOf(q)<0) return false
      }
      return true
    })
    rows.sort(function(a,b){
      var d=sevRank[b.severity]-sevRank[a.severity]; if(d) return d
      return (a.file+':'+a.line).localeCompare(b.file+':'+b.line)
    })
    if(!all.length){
      el('list').innerHTML='<div class="empty">未发现命中的敏感信息</div>'
      return
    }
    if(!rows.length){
      el('list').innerHTML='<div class="empty">当前筛选条件下无结果（共 '+all.length+' 处命中）</div>'
      return
    }
    var h='<table class="res"><thead><tr><th style="width:54px">严重度</th><th style="width:120px">规则</th><th>文件 : 行</th><th>命中值</th></tr></thead><tbody>'
    rows.forEach(function(m){
      var sv=m.severity==='high'?'高':(m.severity==='medium'?'中':'低')
      var val = reveal ? m.value : m.masked
      h+='<tr><td class="sevcell"><span class="sev sev-'+m.severity+'">'+sv+'</span></td>'+
         '<td class="dim">'+escapeHtml(ruleMeta[m.rule]?ruleMeta[m.rule].name:m.rule)+'</td>'+
         '<td class="pth">'+escapeHtml(m.file)+(m.line?(' : '+m.line):'')+'</td>'+
         '<td class="val">'+escapeHtml(val)+'</td></tr>'
    })
    h+='</tbody></table>'
    el('list').innerHTML=h
  }

  /* ---------- 筛选交互 ---------- */
  el('fSev').addEventListener('change',refresh)
  el('fCat').addEventListener('change',refresh)
  el('search').addEventListener('input',refresh)
  el('reveal').addEventListener('change',refresh)
  function refresh(){ if(sid){ send('scan-poll',{sessionId:sid}).then(function(s){ renderResults(s.matches||[]) }).catch(function(){}) } }

  /* ---------- 导出 ---------- */
  el('export').addEventListener('click',function(){
    send('scan-poll',{sessionId:sid||''}).then(function(s){
      var ms=s.matches||[]
      if(!ms.length){ setHint('没有可导出的结果',true); return }
      var lines=['敏感信息扫描结果  '+new Date().toLocaleString(),'命中 '+ms.length+' 处','']
      ms.forEach(function(m){
        lines.push('['+m.severity+'] '+m.rule+'  '+m.file+(m.line?(' : '+m.line):'')+'  '+m.value)
      })
      var blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'})
      var a=document.createElement('a')
      a.href=URL.createObjectURL(blob)
      a.download='secrets-scan-'+Date.now()+'.txt'
      document.body.appendChild(a); a.click(); document.body.removeChild(a)
      setTimeout(function(){ URL.revokeObjectURL(a.href) },1000)
    }).catch(function(e){ setHint('导出失败：'+e.message,true) })
  })

  /* ---------- 首屏规则加载（门控） ---------- */
  // 必须等宿主桥接就绪（plugin:init）后再发 plugin:execute，否则早期请求会被丢弃，
  // 表现为「规则加载失败：后端 30 秒无响应」。个别宿主不下发 plugin:init 时，
  // 由下方 1.5s 兜底触发，避免白屏。booted 守卫保证只加载一次。
  var booted=false
  function bootRules(){
    if(booted) return
    booted=true
    send('rules',{}).then(buildRules).catch(function(e){ el('rulesPanel').innerHTML='<div class="empty">规则加载失败：'+escapeHtml(e.message)+'</div>' })
  }

  renderStatic()
  // 不在脚本末尾立即加载：必须等宿主 plugin:init 或 1.5s 兜底，避免早期请求被丢弃。
  setTimeout(function(){ bootRules() }, 1500) // 兜底：宿主未发 plugin:init 时仍能加载
})()
</script>
</body>
</html>

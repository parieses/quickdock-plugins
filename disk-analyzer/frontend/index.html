<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>磁盘分析器</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans,system-ui,sans-serif)}
.p-app{display:flex;flex-direction:column;height:100%;min-height:0}
.p-head{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0}
.p-head-title{font-size:13px;font-weight:var(--fw-semibold);margin-right:4px}
.p-spacer{flex:1}
.p-btn{background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border);border-radius:5px;padding:4px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.p-btn:hover{background:var(--bg-hover)}
.p-btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.p-btn-primary:hover{filter:brightness(1.08)}
.p-select{background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border);border-radius:5px;padding:3px 6px;font-size:12px}
.p-drives{display:none;padding:8px 12px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;font-size:12px;flex-shrink:0}
.p-drives.show{display:flex}
.p-drive-opt{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;padding:2px 6px;border-radius:4px;background:var(--bg-tertiary);border:1px solid var(--border)}
.p-drive-opt input{accent-color:var(--accent);margin:0}
.p-drive-opt span{color:var(--text-primary)}
.p-drive-hint{width:100%;color:var(--text-muted);font-size:11px}
.p-progress{display:none;padding:5px 12px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px;align-items:center;gap:8px}
.p-progress.show{display:flex}
.p-progress-bar{position:relative;flex:1;height:6px;border-radius:3px;background:var(--bg-tertiary);overflow:hidden;max-width:240px}
.p-progress-bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.7;width:0%}
.p-progress-text{color:var(--text-muted);white-space:nowrap}
.p-stats{display:flex;gap:16px;padding:6px 12px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px;flex-wrap:wrap}
.p-stat-label{color:var(--text-muted)}
.p-stat-value{color:var(--text-primary);font-weight:var(--fw-semibold)}
.p-warn{display:none;padding:6px 12px;background:color-mix(in srgb,var(--warn,#e0a000) 18%,transparent);color:var(--text-primary);font-size:11px;flex-shrink:0;border-bottom:1px solid var(--border)}
.p-warn.show{display:block}
.p-crumb{display:flex;align-items:center;gap:2px;padding:6px 12px;background:var(--bg-primary);border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px;overflow-x:auto;white-space:nowrap}
.p-crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.p-crumb a:hover{text-decoration:underline}
.p-crumb span.p-crumb-sep{color:var(--text-muted);margin:0 2px}
.p-content{position:relative;flex:1;min-height:0}
.p-tree{position:absolute;inset:0;overflow-y:auto;padding:8px}
.p-treemap-wrap{position:absolute;inset:0;display:none}
.p-treemap-wrap.show{display:block}
#treemap{width:100%;height:100%;display:block;cursor:pointer}
.p-loading,.p-empty{text-align:center;padding:40px;color:var(--text-muted)}
/* 列表视图 */
.p-node{margin:1px 0}
.p-node-header{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;user-select:none}
.p-node-header:hover{background:var(--bg-hover)}
.p-node-header.expanded>.p-arrow{transform:rotate(90deg)}
.p-arrow{width:12px;height:12px;transition:transform 150ms;flex-shrink:0;color:var(--text-muted)}
.p-icon{width:16px;height:16px;flex-shrink:0}
.p-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)}
.p-size{font-family:var(--font-mono);color:var(--accent);font-size:11px;min-width:72px;text-align:right;flex-shrink:0}
.p-pct{font-family:var(--font-mono);color:var(--text-muted);font-size:10px;min-width:42px;text-align:right;flex-shrink:0}
.p-bar{position:relative;height:3px;flex-basis:100%;margin:2px 0 0 21px;border-radius:2px;background:var(--bg-secondary);overflow:hidden;flex-shrink:0}
.p-bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.55}
.p-trunc{color:var(--warn,#e0a000);font-size:10px;margin-left:4px}
.p-children{padding-left:14px;display:none}
.p-children.open{display:block}
/* 盘符选择视图 */
.p-drive-card{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--bg-secondary)}
.p-drive-card:hover{background:var(--bg-hover)}
.p-drive-card .p-dc-name{font-size:13px;font-weight:var(--fw-semibold);color:var(--text-primary)}
.p-drive-card .p-dc-sub{font-size:11px;color:var(--text-muted)}
.p-drive-card .p-dc-bar{flex:1;height:6px;border-radius:3px;background:var(--bg-tertiary);overflow:hidden;max-width:200px}
.p-drive-card .p-dc-bar>i{display:block;height:100%;background:var(--accent);opacity:.7}
/* 方块图 hover 提示框 */
.p-tooltip{position:absolute;z-index:50;pointer-events:none;display:none;background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:12px;max-width:340px;box-shadow:0 4px 16px rgba(0,0,0,.4);line-height:1.5}
.p-tooltip .tt-name{font-weight:var(--fw-semibold);word-break:break-all}
.p-tooltip .tt-meta{color:var(--text-muted);margin-top:2px;word-break:break-all}
/* 轻量提示（打开文件管理器等操作反馈） */
.p-toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></symbol><symbol id="icon-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></symbol><symbol id="icon-git-branch" viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></symbol><symbol id="icon-trash-2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></symbol><symbol id="icon-shield-alert" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></symbol><symbol id="icon-hard-drive" viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12"></line><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></symbol><symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></symbol><symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></symbol><symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></symbol><symbol id="icon-gauge" viewBox="0 0 24 24"><path d="M12 15l-2-2"></path><path d="M19.07 4.93a10 10 0 1 1-14.14 0"></path><path d="M12 2v4"></path></symbol><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>

<body>
<div class="p-app">
  <div class="p-head">
    <span class="p-head-title" data-orig="📊 磁盘分析器">📊 磁盘分析器</span>
    <span class="p-spacer"></span>
    <label style="font-size:12px;color:var(--text-muted)" data-orig="深度">深度</label>
    <select class="p-select" id="selDepth" data-orig-title="后台全量扫描的深度（层数越多树越深、扫描越久）" title="后台全量扫描的深度（层数越多树越深、扫描越久）">
      <option value="1" data-orig="1 层">1 层</option>
      <option value="2" data-orig="2 层">2 层</option>
      <option value="3" selected data-orig="3 层">3 层</option>
      <option value="4" data-orig="4 层">4 层</option>
    </select>
    <button class="btn" id="btnView" data-orig="🔲 方块图" data-orig-title="切换列表 / 方块图（SpaceSniffer 模式）" title="切换列表 / 方块图（SpaceSniffer 模式）">🔲 方块图</button>
    <button class="btn" id="btnDrives" data-orig="⚙ 盘符" data-orig-title="选择要扫描的盘符" title="选择要扫描的盘符">⚙ 盘符</button>
    <button class="btn" id="btnStop" data-orig="⏹ 停止" data-orig-title="停止当前扫描" title="停止当前扫描" style="display:none">⏹ 停止</button>
    <button class="btn p-btn-primary" id="btnRoot" data-orig="🏠 此电脑">🏠 此电脑</button>
  </div>
  <div class="p-drives" id="drivePanel">
    <div class="p-drive-hint" data-orig="勾选要显示/扫描的盘符（取消勾选的盘符不会出现在下方列表中）：">勾选要显示/扫描的盘符（取消勾选的盘符不会出现在下方列表中）：</div>
  </div>
  <div class="p-progress" id="progress">
    <span class="p-progress-text" id="progText" data-orig="扫描中...">扫描中...</span>
    <div class="p-progress-bar"><i id="progBar"></i></div>
  </div>
  <div class="p-stats" id="stats">
    <span><span class="p-stat-label" data-orig="总空间:">总空间:</span> <span class="p-stat-value" id="statTotal">-</span></span>
    <span><span class="p-stat-label" data-orig="已用:">已用:</span> <span class="p-stat-value" id="statUsed">-</span></span>
    <span><span class="p-stat-label" data-orig="可用:">可用:</span> <span class="p-stat-value" id="statFree">-</span></span>
    <span><span class="p-stat-label" data-orig="使用率:">使用率:</span> <span class="p-stat-value" id="statUsage">-</span></span>
    <span><span class="p-stat-label" data-orig="耗时:">耗时:</span> <span class="p-stat-value" id="statElapsed">-</span></span>
  </div>
  <div class="p-warn" id="warn"></div>
  <div class="p-crumb" id="crumb"></div>
  <div class="p-content">
    <div class="p-tree" id="tree"><div class="p-loading" data-orig='点击"此电脑"选择盘符开始扫描'>点击"此电脑"选择盘符开始扫描</div></div>
    <div class="p-treemap-wrap" id="mapWrap"><canvas id="treemap"></canvas><div class="p-tooltip" id="tooltip"></div></div>
    <div class="p-toast" id="toast"></div>
  </div>
</div>
<script>
var SEL_KEY='qdDiskAnalyzerDrives';
// ===== 自包含页面 i18n（样板同 pdf-toolkit，key=中文原文，经 <html lang> 判定语言）=====
var L10N={'en-US':{
  '磁盘分析器':'Disk Analyzer',
  '📊 磁盘分析器':'📊 Disk Analyzer',
  '深度':'Depth',
  '1 层':'1 level','2 层':'2 levels','3 层':'3 levels','4 层':'4 levels',
  '后台全量扫描的深度（层数越多树越深、扫描越久）':'Depth for the background full scan (more levels = deeper tree, longer scan)',
  '🔲 方块图':'🔲 Treemap',
  '切换列表 / 方块图（SpaceSniffer 模式）':'Switch list / treemap (SpaceSniffer mode)',
  '⚙ 盘符':'⚙ Drives',
  '选择要扫描的盘符':'Choose drives to scan',
  '⏹ 停止':'⏹ Stop',
  '停止当前扫描':'Stop the current scan',
  '🏠 此电脑':'🏠 This PC',
  '勾选要显示/扫描的盘符（取消勾选的盘符不会出现在下方列表中）：':'Check the drives to show/scan (unchecked drives will not appear below):',
  '扫描中...':'Scanning…',
  '总空间:':'Total:',
  '已用:':'Used:',
  '可用:':'Free:',
  '使用率:':'Usage:',
  '耗时:':'Elapsed:',
  '点击"此电脑"选择盘符开始扫描':'Click "This PC" to pick a drive and start scanning',
  '该节点没有可打开的路径':'This node has no openable path',
  '已在文件管理器中打开: ':'Opened in file manager: ',
  '打开失败: ':'Failed to open: ',
  '响应超时':'Response timed out',
  '启动扫描失败':'Failed to start scan',
  '正在启动扫描...':'Starting scan…',
  '扫描失败: ':'Scan failed: ',
  '⚠ 部分统计：有目录体积因达上限/超时未完整统计，带 ⚠ 标记的数值偏小（可继续下钻逐层查看）。':'⚠ Partial stats: some directories hit size/time limits and were not fully measured; values marked ⚠ are underestimates (drill down for per-level detail).',
  '扫描完成':'Scan complete',
  '扫描中':'Scanning',
  '正在启动扫描':'Starting scan…',
  ' · 已扫描 ':' · ',
  ' 个目录 · 节点 ':' dirs scanned · snapshot ',
  '扫描进行中，等待该层结果...':'Scan in progress, waiting for this level...',
  '该目录为空或无权限访问':'This folder is empty or access denied',
  '盘符 · ':'Drive · ',
  '（体积因超时被截断，数值偏小）':' (size truncated due to timeout, value underestimated)',
  '扫描中…':'Scanning…',
  '体积统计中…':'Measuring…',
  ' · 文件':' · File',
  ' · 文件夹':' · Folder',
  '没有可选的盘符，点"⚙ 盘符"勾选':'No drives available. Click "⚙ Drives" to check some',
  ' 已用':' used',
  '枚举盘符中...':'Enumerating drives…',
  '📋 列表':'📋 List'
}};
function isEn(){return (document.documentElement.getAttribute('lang')||'').toLowerCase().indexOf('en')===0}
function L(s){if(!isEn())return s;var t=L10N['en-US'];return t[s]!==undefined?t[s]:s}
function applyStaticL10n(){
  var els=document.querySelectorAll('[data-orig]'),i;
  for(i=0;i<els.length;i++)els[i].textContent=L(els[i].getAttribute('data-orig'));
  els=document.querySelectorAll('[data-orig-title]');
  for(i=0;i<els.length;i++)els[i].title=L(els[i].getAttribute('data-orig-title'));
  document.title=L('磁盘分析器');
}
function $(id){return document.getElementById(id)}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showToast(msg){
  var t=$('toast');
  t.textContent=msg;
  t.style.opacity=1;
  if(t._tm)clearTimeout(t._tm);
  t._tm=setTimeout(function(){t.style.opacity=0},2400);
}
// 在系统文件管理器中打开节点（右键触发）：文件夹直接打开，文件在父目录中选中
function openInExplorer(node){
  if(!node||!node.path){showToast(L('该节点没有可打开的路径'));return}
  pluginExec('disk-open',{path:node.path,isFile:!!node.isFile}).then(function(){
    showToast(L('已在文件管理器中打开: ')+node.name);
  }).catch(function(e){showToast(L('打开失败: ')+e.message)});
}

// ---- 插件 RPC（与后端 JSON-RPC 对齐）----
var cmdQueue=[],cmdRunning=false;
function pluginExec(cmd,data){return new Promise(function(resolve,reject){
  cmdQueue.push({cmd:cmd,data:data||{},resolve:resolve,reject:reject});
  if(!cmdRunning)nextCmd();
})}
function nextCmd(){
  if(cmdQueue.length===0){cmdRunning=false;return}
  cmdRunning=true;
  var task=cmdQueue.shift();
  var timer=setTimeout(function(){
    window.removeEventListener('message',handler);
    cmdRunning=false;
    task.reject(new Error(L('响应超时')));
  },30000);
  window.parent.postMessage({type:'plugin:execute',id:Date.now(),command:task.cmd,input:{text:JSON.stringify(task.data)}},'*');
  var handler=function(e){
    if(e.data&&e.data.type==='plugin:result'){
      clearTimeout(timer);
      window.removeEventListener('message',handler);
      if(e.data.error){task.reject(new Error(e.data.error))}
      else{task.resolve(e.data.data)}
      setTimeout(nextCmd,20);
    }
  };
  window.addEventListener('message',handler);
}

// ---- 格式化 ----
function formatSize(bytes){if(!bytes||bytes===0)return '0 B';var units=['B','KB','MB','GB','TB','PB'],size=parseFloat(bytes),idx=0;while(size>=1024&&idx<units.length-1){size/=1024;idx++}return (idx===0?String(Math.round(size)):size.toFixed(1))+' '+units[idx]}
function formatPct(n){if(!isFinite(n)||n<0)n=0;if(n>100)n=100;return n.toFixed(1)+'%'}

function getFileIcon(name,isDir){
  if(isDir)return'📁';
  var ext=name.split('.').pop().toLowerCase();
  var icons={exe:'⚙️',lnk:'🔗',dll:'📦',sys:'⚙️',pdf:'📄',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',ppt:'📑',pptx:'📑',zip:'📦',rar:'📦','7z':'📦',mp3:'🎵',wav:'🎵',mp4:'🎬',avi:'🎬',mkv:'🎬',jpg:'🖼️',png:'🖼️',gif:'🖼️',bmp:'🖼️',txt:'📝',md:'📝',go:'🐹',py:'🐍',js:'📜',ts:'📜',json:'📋',xml:'📋',html:'🌐',css:'🎨'};
  return icons[ext]||'📄';
}

// ---- 盘符选择持久化 ----
function loadSelection(){try{return JSON.parse(localStorage.getItem(SEL_KEY))||{}}catch(e){return{}}}
function saveSelection(s){try{localStorage.setItem(SEL_KEY,JSON.stringify(s))}catch(e){}}
var driveSelection=loadSelection();
function isSelected(path){return driveSelection[path]!==false}

// ---- 全局状态 ----
var state={
  view:'map',
  depth:3,
  root:null,        // 最近一次扫描返回的（部分）树根
  drillPath:[],     // 从 root 往下钻的路径（节点名数组）
  current:null,     // = locateNode(root, drillPath)
  lastVersion:-1,   // 最近一次成功拉取的快照版本
  activeScan:null,  // {path, timer} 正在进行的后台扫描
  lastRoot:null     // 盘符列表（用于筛选）
};
var treemapRects=[];

// ---- 类别配色（SpaceSniffer 式）----
var CAT_COLORS={video:'#e0556b',audio:'#c77dff',image:'#4cc9f0',doc:'#f9c74f',archive:'#90be6d',code:'#577590',app:'#f3722c',data:'#43aa8b',other:'#8d99ae'};
function catOf(name){
  var ext=String(name).split('.').pop().toLowerCase();
  if(['mp4','mkv','avi','mov','webm','flv','wmv'].indexOf(ext)>=0)return'video';
  if(['mp3','wav','flac','ogg','m4a','aac'].indexOf(ext)>=0)return'audio';
  if(['jpg','jpeg','png','gif','bmp','webp','svg','ico'].indexOf(ext)>=0)return'image';
  if(['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','md','rtf'].indexOf(ext)>=0)return'doc';
  if(['zip','rar','7z','tar','gz','tgz','iso'].indexOf(ext)>=0)return'archive';
  if(['go','py','js','ts','java','c','cpp','h','rb','php','sh','json','xml','html','css','vue'].indexOf(ext)>=0)return'code';
  if(['exe','msi','dll','sys','bat','cmd','app'].indexOf(ext)>=0)return'app';
  if(['db','sqlite','sql','csv','dat','bin','log'].indexOf(ext)>=0)return'data';
  return'other';
}
function folderColor(path){
  var h=0;for(var i=0;i<path.length;i++){h=(h*31+path.charCodeAt(i))%360}
  return 'hsl('+h+',58%,52%)';
}
function colorFor(node){
  if(node.scanning)return 'rgba(130,140,160,0.30)'; // 扫描中占位：半透明灰
  if(node.isFile)return CAT_COLORS[catOf(node.name)]||CAT_COLORS.other;
  return folderColor(node.path||node.name||'');
}

// ---- 在树中按路径定位节点（扫描更新整棵树后，下钻视图不丢失）----
function locateNode(root,names){
  if(!root)return null;
  var cur=root;
  for(var i=0;i<names.length;i++){
    var child=null,arr=cur.children||[];
    for(var k=0;k<arr.length;k++){if(arr[k].name===names[i]){child=arr[k];break}}
    if(!child)return cur; // 该层还没扫到，回退到当前已扫出的节点
    cur=child;
  }
  return cur;
}

// ---- 导航 ----
function gotoIndex(i){state.drillPath=state.drillPath.slice(0,i);render()}
function openNode(node){
  if(!node||node.isFile)return;
  if(node.children&&node.children.length){state.drillPath.push(node.name);render();return}
  // 还没扫到子节点：按需补扫这一层（disk-scan 边界扫描），再下钻
  showLoading();
  pluginExec('disk-scan',{path:node.path,depth:1,limit:80}).then(function(data){
    var fresh=locateNode(state.root,state.drillPath.concat([node.name]));
    if(fresh&&data.children)fresh.children=data.children;
    state.drillPath.push(node.name);
    render();
  }).catch(function(e){showError(e.message)});
}
function startScan(path){
  stopScan(); // 先停掉旧的轮询
  state.root=null;state.drillPath=[];state.current=null;state.lastVersion=-1;
  showLoading();
  pluginExec('disk-scan-full',{path:path,maxDepth:state.depth}).then(function(data){
    if(data&&(data.started||data.alreadyRunning)){
      state.activeScan={path:path,timer:null};
      poll();
    }else{
      showError(L('启动扫描失败'));
    }
  }).catch(function(e){showError(e.message)});
}
function stopScan(){
  if(state.activeScan&&state.activeScan.timer){clearTimeout(state.activeScan.timer)}
  state.activeScan=null;
  $('progress').classList.remove('show');
  $('btnStop').style.display='none';
}
function poll(){
  if(!state.activeScan)return;
  var path=state.activeScan.path;
  pluginExec('disk-scan-status',{path:path,since:state.lastVersion}).then(function(d){
    if(!state.activeScan||state.activeScan.path!==path)return; // 已被新扫描取代
    state.lastVersion=d.version;
    if(d.root)state.root=d.root;
    updateProgress(d);
    if(d.done){
      state.activeScan=null;
      $('progress').classList.remove('show');
      $('btnStop').style.display='none';
      render();
    }else{
      render(); // 渐进重绘
      state.activeScan.timer=setTimeout(poll, d.unchanged?900:400);
    }
  }).catch(function(e){
    state.activeScan=null;
    $('progress').classList.remove('show');
    $('btnStop').style.display='none';
    showError(e.message);
  });
}

// ---- 渲染分发 ----
function render(){
  state.current=locateNode(state.root,state.drillPath);
  renderCrumb();
  if(state.view==='map'){
    $('tree').style.display='none';
    renderTreemap();
  }else{
    $('mapWrap').classList.remove('show');
    $('tree').style.display='block';
    renderTree(state.current);
  }
  updateStats(state.current);
  showWarn(state.current);
}
function showLoading(){$('mapWrap').classList.remove('show');$('tree').style.display='block';$('tree').innerHTML='<div class="p-loading">'+L('扫描中...')+'</div>';$('progress').classList.add('show');$('btnStop').style.display='inline-block';$('progText').textContent=L('正在启动扫描...');}
function showError(msg){$('tree').innerHTML='<div class="p-empty">'+L('扫描失败: ')+escapeHtml(msg)+'</div>';$('mapWrap').classList.remove('show');$('progress').classList.remove('show');$('btnStop').style.display='none';}

function renderCrumb(){
  var c=$('crumb');c.innerHTML='';
  var home=document.createElement('a');home.textContent=L('🏠 此电脑');
  home.addEventListener('click',function(){scanRoot()});
  c.appendChild(home);
  state.drillPath.forEach(function(name,i){
    var sep=document.createElement('span');sep.className='p-crumb-sep';sep.textContent='/';
    c.appendChild(sep);
    var a=document.createElement('a');a.textContent=name;
    (function(idx){a.addEventListener('click',function(){gotoIndex(idx)})})(i);
    c.appendChild(a);
  });
}

function updateStats(node){
  if(!node){return}
  if(node.isDrive||node.total>0){
    $('statTotal').textContent=formatSize(node.total||0);
    $('statUsed').textContent=formatSize(node.size||0);
    $('statFree').textContent=formatSize((node.total||0)-(node.size||0));
    $('statUsage').textContent=formatPct(node.total>0?(node.size/node.total*100):0);
  }else{
    $('statTotal').textContent='-';
    $('statUsed').textContent=formatSize(node.size||0);
    $('statFree').textContent='-';
    $('statUsage').textContent='-';
  }
  $('statElapsed').textContent=(node.elapsedMs?node.elapsedMs/1000:0).toFixed(1)+'s';
}
function showWarn(node){
  var w=$('warn');
  if(node&&node.truncated){
    w.textContent=L('⚠ 部分统计：有目录体积因达上限/超时未完整统计，带 ⚠ 标记的数值偏小（可继续下钻逐层查看）。');
    w.classList.add('show');
  }else{w.classList.remove('show')}
}
function updateProgress(d){
  $('progress').classList.add('show');
  $('btnStop').style.display='inline-block';
  var pct=0;
  $('progText').textContent=(d.done?L('扫描完成'):(state.root?L('扫描中'):L('正在启动扫描')))+(isEn()?' · ':' · 已扫描 ')+d.scannedDirs+L(' 个目录 · 节点 ')+d.version;
  // version 仅作相对进度指示
  pct=Math.min(100,Math.round(d.version%100));
  if(d.done)pct=100;
  $('progBar').style.width=pct+'%';
}

// ---- 列表视图 ----
function renderTree(node){
  var parentEl=$('tree');
  parentEl.innerHTML='';
  parentEl.style.display='block';
  if(!node||!node.children||node.children.length===0){
    parentEl.innerHTML='<div class="p-empty">'+(state.activeScan?L('扫描进行中，等待该层结果...'):L('该目录为空或无权限访问'))+'</div>';return;
  }
  var parentSize=node.size||0;
  node.children.forEach(function(child){
    var isDrive=!!child.isDrive;
    var pctVal=isDrive?(child.usagePct||0):(parentSize>0?(child.size/parentSize*100):0);
    var div=document.createElement('div');div.className='p-node';
    var header=document.createElement('div');header.className='p-node-header';
    var arrow=document.createElement('span');arrow.className='p-arrow';arrow.textContent='▶';
    var icon=document.createElement('span');icon.className='p-icon';icon.textContent=isDrive?'💽':getFileIcon(child.name,!child.isFile);
    var name=document.createElement('span');name.className='p-name';name.textContent=child.name+(child.truncated?' ⚠':'');
    var size=document.createElement('span');size.className='p-size';size.textContent=formatSize(child.size);
    var pct=document.createElement('span');pct.className='p-pct';pct.textContent=formatPct(pctVal);
    header.appendChild(arrow);header.appendChild(icon);header.appendChild(name);header.appendChild(size);header.appendChild(pct);
    div.appendChild(header);
    var bar=document.createElement('div');bar.className='p-bar';var fill=document.createElement('i');fill.style.width=formatPct(pctVal);bar.appendChild(fill);div.appendChild(bar);
    header.title=(isDrive?L('盘符 · '):'')+child.name+(child.truncated?L('（体积因超时被截断，数值偏小）'):'');
    parentEl.appendChild(div);
    if(!child.isFile){
      var childrenDiv=document.createElement('div');childrenDiv.className='p-children';div.appendChild(childrenDiv);
      header.addEventListener('click',function(){openNode(child)});
    }
    // 右键 → 系统文件管理器打开（文件夹开目录，文件在父目录选中）
    header.addEventListener('contextmenu',function(e){e.preventDefault();openInExplorer(child)});
  });
}

// ---- SpaceSniffer 式方块图（Squarified Treemap）----
function squarify(items,x,y,w,h){
  var total=0;items.forEach(function(it){total+=it.value});
  if(total<=0||w<=0||h<=0)return[];
  var scale=(w*h)/total;
  var areas=items.map(function(it){return{item:it,area:Math.max(it.value,1)*scale}});
  areas.sort(function(a,b){return b.area-a.area});
  var rects=[];var rect={x:x,y:y,w:w,h:h};var row=[];var i=0;
  function worst(row,rect){
    if(row.length===0)return Infinity;
    var sum=0,max=0,min=Infinity;
    row.forEach(function(r){sum+=r.area;if(r.area>max)max=r.area;if(r.area<min)min=r.area});
    if(sum<=0||min<=0)return Infinity;
    var side=Math.min(rect.w,rect.h),s2=side*side;
    return Math.max((s2*max)/(sum*sum),(sum*sum)/(s2*min));
  }
  function layout(row,rect){
    var sum=0;row.forEach(function(r){sum+=r.area});
    if(sum<=0)return;
    if(rect.w>=rect.h){
      var rw=sum/rect.h,yy=rect.y;
      row.forEach(function(r){var rh=r.area/rw;rects.push({x:rect.x,y:yy,w:rw,h:rh,node:r.item.node});yy+=rh});
      rect.x+=rw;rect.w-=rw;
    }else{
      var rh=sum/rect.w,xx=rect.x;
      row.forEach(function(r){var rw=r.area/rh;rects.push({x:xx,y:rect.y,w:rw,h:rh,node:r.item.node});xx+=rw});
      rect.y+=rh;rect.h-=rh;
    }
  }
  while(i<areas.length){
    var next=areas[i];
    if(row.length===0){row.push(next);i++;continue}
    var before=worst(row,rect),after=worst(row.concat([next]),rect);
    if(after<=before){row.push(next);i++}else{layout(row,rect);row=[]}
  }
  if(row.length)layout(row,rect);
  return rects;
}
function renderTreemap(){
  $('tree').classList.remove('p-loading-flag');
  var node=state.current;
  if(!node||!node.children||node.children.length===0){
    $('mapWrap').classList.remove('show');
    $('tree').style.display='block';
    $('tree').innerHTML='<div class="p-empty">'+(state.activeScan?L('扫描进行中，等待该层结果...'):L('该目录为空或无权限访问'))+'</div>';
    return;
  }
  $('mapWrap').classList.add('show');
  $('tree').style.display='none';
  var cv=$('treemap');
  var dpr=window.devicePixelRatio||1;
  var W=cv.clientWidth||300,H=cv.clientHeight||300;
  cv.width=W*dpr;cv.height=H*dpr;
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var items=node.children.map(function(c){return{value:Math.max(c.size,1),node:c}});
  var rects=squarify(items,1,1,W-2,H-2);
  treemapRects=rects;
  paintTreemap(-1);
}
// 仅重绘方块（hover 时调用，不重新布局，开销小）
function paintTreemap(hi){
  var cv=$('treemap');
  var ctx=cv.getContext('2d');
  var W=cv.clientWidth||300,H=cv.clientHeight||300;
  ctx.clearRect(0,0,W,H);
  for(var k=0;k<treemapRects.length;k++){
    var r=treemapRects[k],n=r.node;
    ctx.fillStyle=colorFor(n);
    ctx.fillRect(r.x,r.y,r.w-1,r.h-1);
    // 扫描中的方块画一层斜纹，提示"体积还在统计"
    if(n.scanning){
      ctx.save();
      ctx.beginPath();ctx.rect(r.x,r.y,r.w-1,r.h-1);ctx.clip();
      ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
      for(var o=-r.h;o<r.w;o+=6){ctx.beginPath();ctx.moveTo(r.x+o,r.y+r.h);ctx.lineTo(r.x+o+r.h,r.y);ctx.stroke();}
      ctx.restore();
    }
    if(r.w>48&&r.h>16){
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.font='12px sans-serif';
      var label=fitText(n.name,r.w-6);
      ctx.fillText(label,r.x+3,r.y+14);
      if(r.h>30){
        ctx.fillStyle='rgba(255,255,255,0.8)';
        ctx.font='10px sans-serif';
        ctx.fillText((n.scanning?L('扫描中…'):((n.truncated?'⚠ ':'')+formatSize(n.size))),r.x+3,r.y+28);
      }
    }
    // hover 高亮：白描边
    if(k===hi){
      ctx.strokeStyle='rgba(255,255,255,0.95)';
      ctx.lineWidth=2;
      ctx.strokeRect(r.x+1,r.y+1,Math.max(0,r.w-3),Math.max(0,r.h-3));
    }
  }
}
function fitText(s,maxW){
  s=String(s);if(s.length<=Math.floor(maxW/7))return s;
  return s.substring(0,Math.max(1,Math.floor(maxW/7)-1))+'…';
}
$('treemap').addEventListener('click',function(e){
  var cv=$('treemap');var rect=cv.getBoundingClientRect();
  var mx=e.clientX-rect.left,my=e.clientY-rect.top;
  for(var i=0;i<treemapRects.length;i++){
    var r=treemapRects[i];
    if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){openNode(r.node);break}
  }
});
// ---- hover 反馈：高亮 + 浮动提示框 ----
var hoverIdx=-1;
function rectAt(mx,my){
  for(var i=0;i<treemapRects.length;i++){
    var r=treemapRects[i];
    if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h)return i;
  }
  return -1;
}
$('treemap').addEventListener('mousemove',function(e){
  var cv=$('treemap');var rect=cv.getBoundingClientRect();
  var mx=e.clientX-rect.left,my=e.clientY-rect.top;
  var idx=rectAt(mx,my);
  if(idx!==hoverIdx){hoverIdx=idx;paintTreemap(idx);}
  var tip=$('tooltip');
  if(idx>=0){
    var n=treemapRects[idx].node;
    var pct=(state.current&&state.current.size>0)?(n.size/state.current.size*100):0;
    tip.innerHTML='<div class="tt-name">'+escapeHtml(n.name)+(n.truncated?' ⚠':'')+'</div>'+
      '<div class="tt-meta">'+(n.scanning?L('体积统计中…'):formatSize(n.size))+
      (pct>0&&!n.scanning?(isEn()?(' · '+formatPct(pct)+' of current'):(' · 占当前 '+formatPct(pct))):'')+
      (n.isFile?L(' · 文件'):L(' · 文件夹'))+'</div>'+
      (n.path?'<div class="tt-meta">'+escapeHtml(n.path)+'</div>':'');
    tip.style.display='block';
    var tw=tip.offsetWidth,th=tip.offsetHeight;
    var x=e.clientX-rect.left+14; if(x+tw>cv.clientWidth) x=e.clientX-rect.left-tw-14;
    if(x<0)x=2;
    var y=e.clientY-rect.top+14; if(y+th>cv.clientHeight) y=e.clientY-rect.top-th-14;
    if(y<0)y=2;
    tip.style.left=x+'px';tip.style.top=y+'px';
  }else{
    tip.style.display='none';
  }
});
$('treemap').addEventListener('mouseleave',function(){
  $('tooltip').style.display='none';
  if(hoverIdx!==-1){hoverIdx=-1;paintTreemap(-1);}
});
// 右键方块 → 系统文件管理器打开该路径
$('treemap').addEventListener('contextmenu',function(e){
  e.preventDefault();
  var cv=$('treemap');var rect=cv.getBoundingClientRect();
  var mx=e.clientX-rect.left,my=e.clientY-rect.top;
  var idx=rectAt(mx,my);
  if(idx>=0){openInExplorer(treemapRects[idx].node)}
});
var resizeTimer=null;
window.addEventListener('resize',function(){if(resizeTimer)clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){if(state.view==='map')renderTreemap()},150)});

// ---- 盘符面板 / 选择视图 ----
function buildDrivePanel(drives){
  var panel=$('drivePanel');
  panel.querySelectorAll('.p-drive-opt').forEach(function(n){n.remove()});
  (drives||[]).forEach(function(d){
    var opt=document.createElement('label');opt.className='p-drive-opt';
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=isSelected(d.path);
    cb.addEventListener('change',function(){
      driveSelection[d.path]=cb.checked;saveSelection(driveSelection);
      // 勾选即扫描该盘根目录（默认看到的是盘内文件/文件夹的方块图，而非最外层盘符）
      if(cb.checked){startScan(d.path);}
      else if(state.activeScan&&state.activeScan.path===d.path){scanRoot();}
      else{renderDrivePicker(state.lastRoot);}
    });
    var span=document.createElement('span');span.textContent=d.name+' · '+formatSize(d.size);
    opt.appendChild(cb);opt.appendChild(span);panel.appendChild(opt);
  });
}
function renderDrivePicker(data){
  state.root=null;state.drillPath=[];state.current=null;
  var tree=$('tree');tree.style.display='block';$('mapWrap').classList.remove('show');
  tree.innerHTML='';
  var drives=(data&&data.children||[]).filter(function(d){return isSelected(d.path)});
  if(drives.length===0){tree.innerHTML='<div class="p-empty">'+L('没有可选的盘符，点"⚙ 盘符"勾选')+'</div>';return}
  drives.forEach(function(d){
    var card=document.createElement('div');card.className='p-drive-card';
    var pct=d.usagePct||0;
    card.innerHTML='<div style="min-width:60px"><div class="p-dc-name">'+escapeHtml(d.name)+'</div><div class="p-dc-sub">'+formatSize(d.size)+' / '+formatSize(d.total||0)+'</div></div>'+
      '<div class="p-dc-bar"><i style="width:'+formatPct(pct)+'"></i></div>'+
      '<div class="p-dc-sub">'+formatPct(pct)+L(' 已用')+'</div>';
    card.addEventListener('click',function(){startScan(d.path)});
    tree.appendChild(card);
  });
}
function scanRoot(){
  stopScan();
  $('tree').innerHTML='<div class="p-loading">'+L('枚举盘符中...')+'</div>';
  pluginExec('disk-scan-root',{}).then(function(data){
    state.lastRoot=data;
    buildDrivePanel(data.children);
    renderDrivePicker(data);
  }).catch(function(e){showError(e.message)});
}

// ---- 控件 ----
$('btnRoot').addEventListener('click',function(){scanRoot()});
$('btnStop').addEventListener('click',function(){stopScan();render()});
$('btnDrives').addEventListener('click',function(){$('drivePanel').classList.toggle('show')});
$('selDepth').addEventListener('change',function(){state.depth=parseInt(this.value,10)||3});
$('btnView').addEventListener('click',function(){
  state.view=(state.view==='map')?'list':'map';
  $('btnView').textContent=(state.view==='map')?L('🔲 方块图'):L('📋 列表');
  render();
});

// ---- 初始化 ----
function refreshL10n(){
  applyStaticL10n();
  $('btnView').textContent=(state.view==='map')?L('🔲 方块图'):L('📋 列表');
  if(state.root||state.current){render()}
  else{$('tree').innerHTML='<div class="p-loading">'+L('点击"此电脑"选择盘符开始扫描')+'</div>'}
}
applyStaticL10n();
window.addEventListener('message',function(e){
  if(!e.data||!e.data.type)return;
  if(e.data.type==='plugin:init'){
    var input=null;
    if(e.data.data&&e.data.data.text){try{input=JSON.parse(e.data.data.text)}catch(err){input=null}}
    if(input&&input.path){startScan(input.path)}
    else{scanRoot()}
  }else if(e.data.type==='plugin:theme'&&e.data.data&&e.data.data.theme){
    document.documentElement.setAttribute('data-theme',e.data.data.theme);
    if(e.data.data.locale){
      document.documentElement.setAttribute('lang',e.data.data.locale);
      refreshL10n();
    }
  }
});
</script>

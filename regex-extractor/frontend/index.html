<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正则提取工具</title>

<script>
/* QuickDock sandbox 剪贴板桥接：iframe 内 navigator.clipboard 被 Permissions-Policy 禁用 */
window.__cpSeq=0;
window.execCopyFallback=function(t){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';a.style.top='0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');document.body.removeChild(a);return ok}catch(e){return false}};
window.copyViaHost=function(t,cb){var id='cp_'+(++window.__cpSeq),done=false;function onMsg(e){var d=e&&e.data;if(d&&d.type==='plugin:copy-result'&&d.id===id){done=true;window.removeEventListener('message',onMsg);cb&&cb(!!d.ok)}}window.addEventListener('message',onMsg);parent.postMessage({type:'plugin:copy',id:id,text:t},'*');setTimeout(function(){if(!done){window.removeEventListener('message',onMsg);cb&&cb(window.execCopyFallback(t))}},300)};
</script>

<body>
<div class="re-app">
  <!-- 模式切换 -->
  <div class="re-mode">
    <button class="re-mode-btn active" id="modeExtract">🔍 提取</button>
    <button class="re-mode-btn" id="modeReplace">🔁 替换</button>
  </div>

  <!-- 输入区 -->
  <div class="re-input-area">
    <div class="re-row">
      <div class="re-field re-field-regex">
        <label class="re-label">正则表达式</label>
        <div class="re-regex-input">
          <span class="re-regex-delim">/</span>
          <input type="text" id="patternInput" class="re-input re-input-regex" placeholder="\d+\.\d+\.\d+\.\d+" spellcheck="false">
          <span class="re-regex-delim">/</span>
          <input type="text" id="flagsInput" class="re-input re-input-flags" value="g" placeholder="g" maxlength="5">
        </div>
      </div>
      <div class="re-field re-field-actions">
        <button class="re-btn re-btn-primary" id="btnExtract">▶ 执行</button>
        <button class="re-btn" id="btnClear">✕ 清空</button>
      </div>
    </div>
    <div class="re-row" id="replaceRow" style="display:none">
      <div class="re-field re-field-full">
        <label class="re-label">替换为</label>
        <div class="re-replace-wrap">
          <input type="text" id="replacementInput" class="re-input re-replacement" placeholder="替换模板，支持 $1 / $2 反向引用" spellcheck="false">
        </div>
      </div>
    </div>
    <div class="re-row">
      <div class="re-field re-field-full">
        <label class="re-label">待匹配文本</label>
        <textarea id="textInput" class="re-textarea" placeholder="在此粘贴要提取的文本…" spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <!-- 结果区 -->
  <div class="re-result-area" id="resultArea" style="display:none">
    <div class="re-result-header">
      <span>匹配结果</span>
      <span class="re-result-stats" id="matchStats"></span>
      <span class="re-spacer"></span>
      <button class="re-btn re-btn-sm" id="btnCopyResult">复制</button>
    </div>
    <div class="re-result-body" id="matchResults"></div>
  </div>

  <!-- 替换结果 -->
  <div class="re-result-area" id="replaceArea" style="display:none">
    <div class="re-result-header">
      <span>替换结果</span>
      <span class="re-result-stats" id="replaceStats"></span>
      <span class="re-spacer"></span>
      <button class="re-btn re-btn-sm" id="btnCopyReplace">复制</button>
    </div>
    <div class="re-result-body" id="replaceBody"></div>
  </div>
</div>

<script src="app.js"></script>

<!-- 跟随宿主浅色/深色主题 -->
  <script>
  /* qd-theme-follow：把宿主的浅色/深色同步到 <html data-theme>
     （qd-theme.css 里浅色是 html[data-theme="light"] 的变量覆盖）。
     三级取值，任意一级拿到就生效，互为兜底：
       1) 宿主消息 plugin:theme / plugin:init（宿主若补上独立窗口的广播即走这条）
       2) 同源 opener / parent 窗口的 <html data-theme>，并监听其变化、窗口 focus 时重读
       3) 系统偏好 prefers-color-scheme（宿主主题=「跟随系统」时有效）
     独立注册，不改动页面原有逻辑。 */
  (function () {
    var el = document.documentElement;
    function set(t) { if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); }
    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || !d.type) return;
      if (d.type === 'plugin:theme' || d.type === 'plugin:init') { if (d.data && d.data.theme) set(d.data.theme); }
    });
    /* 2) 同源窗口 */
    var w = null;
    try {
      if (window.opener && window.opener !== window) w = window.opener;
      else if (window.parent && window.parent !== window) w = window.parent;
    } catch (err) { w = null; }
    function fromWin() {
      try { var t = w.document.documentElement.getAttribute('data-theme'); if (t) { set(t); return true; } return false; }
      catch (err) { return false; }
    }
    if (w && fromWin()) {
      try {
        new MutationObserver(fromWin).observe(w.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      } catch (err) {}
      window.addEventListener('focus', fromWin);
    }
    /* 3) 系统偏好兜底：仅在还没拿到明确主题时生效 */
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var sys = function () { if (!el.getAttribute('data-theme')) set(mq.matches ? 'light' : 'dark'); };
      sys();
      if (mq.addEventListener) mq.addEventListener('change', sys);
    }
  })();
  </script>
<!-- 运行期异常上报：未捕获异常 / Promise 拒绝 -> 宿主 plugin-YYYYMMDD.log（E 级） -->
<script>
(function () {
  if (window.__qdErrHook) return
  window.__qdErrHook = true
  var sent = 0, last = {}
  function report(kind, msg, stack) {
    try {
      if (sent >= 20) return // 单页最多 20 条，防止循环报错刷屏
      var key = kind + '|' + msg
      var now = Date.now()
      if (last[key] && now - last[key] < 10000) return // 同一错误 10s 内只报一次
      last[key] = now
      sent++
      if (typeof window.qdHostCall !== 'function') return
      window.qdHostCall('log.error', {
        message: '前端' + kind + ': ' + msg + (stack ? ' | ' + String(stack).slice(0, 600) : '')
      }).catch(function () {})
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    report('未捕获异常', (e && e.message) || 'unknown', e && e.error && e.error.stack)
  })
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason
    report('Promise 拒绝', (r && r.message) || String(r), r && r.stack)
  })
})()
</script>

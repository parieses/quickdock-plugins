<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>代码格式化</title>
<link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">
<style>
.cmp-app{display:flex;flex-direction:column;height:100vh}
.cmp-tabs{display:flex;gap:4px;padding:6px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0}
.cmp-tab{height:30px;padding:0 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:13px;cursor:pointer;font-family:inherit}
.cmp-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cmp-pane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.cmp-pane[hidden]{display:none}
.p-app{display:flex;flex-direction:column;height:100%}
.p-toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.p-btn{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.p-btn:hover{background:var(--bg-hover)}
.p-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.p-btn-primary:hover{background:var(--accent-hover)}
.p-btn-toggle{background:transparent}.p-btn-toggle.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.p-btn-group{display:flex;gap:1px}.p-btn-group .p-btn{border-radius:0}
.p-btn-group .p-btn:first-child{border-radius:var(--radius)0 0 var(--radius)}
.p-btn-group .p-btn:last-child{border-radius:0 var(--radius)var(--radius)0}
.p-select{height:28px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.p-spacer{flex:1}
.p-body{display:flex;flex:1;min-height:0;gap:1px}
.p-pane{display:flex;flex-direction:column;flex:1;min-width:0;background:var(--bg-secondary)}
.p-pane-header{padding:6px 10px;flex-shrink:0;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;background:var(--bg-secondary);border-bottom:1px solid var(--border)}
.p-textarea{flex:1;resize:none;padding:10px;border:none;outline:none;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-mono);font-size:13px;line-height:1.5;tab-size:2}
.p-textarea::placeholder{color:var(--text-placeholder)}.p-textarea-input:focus{background:var(--bg-tertiary)}.p-textarea-output{background:var(--bg-tertiary)}
.p-statusbar{padding:4px 10px;font-size:11px;color:var(--text-muted);background:var(--bg-secondary);border-top:1px solid var(--border);flex-shrink:0;min-height:24px}
</style>
<script>
/* QuickDock sandbox 剪贴板桥接：iframe 内 navigator.clipboard 被 Permissions-Policy 禁用 */
window.__cpSeq=0;
window.execCopyFallback=function(t){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';a.style.top='0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');document.body.removeChild(a);return ok}catch(e){return false}};
window.copyViaHost=function(t,cb){var id='cp_'+(++window.__cpSeq),done=false;function onMsg(e){var d=e&&e.data;if(d&&d.type==='plugin:copy-result'&&d.id===id){done=true;window.removeEventListener('message',onMsg);cb&&cb(!!d.ok)}}window.addEventListener('message',onMsg);parent.postMessage({type:'plugin:copy',id:id,text:t},'*');setTimeout(function(){if(!done){window.removeEventListener('message',onMsg);cb&&cb(window.execCopyFallback(t))}},300)};
</script>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></symbol><symbol id="icon-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></symbol><symbol id="icon-git-branch" viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></symbol><symbol id="icon-trash-2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></symbol><symbol id="icon-shield-alert" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></symbol><symbol id="icon-hard-drive" viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12"></line><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></symbol><symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></symbol><symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></symbol><symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></symbol><symbol id="icon-gauge" viewBox="0 0 24 24"><path d="M12 15l-2-2"></path><path d="M19.07 4.93a10 10 0 1 1-14.14 0"></path><path d="M12 2v4"></path></symbol><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>
</head>
<body>
<div class="cmp-app">
  <div class="cmp-tabs">
    <button class="cmp-tab" data-tab="code" id="tabCode">{} 通用代码</button>
    <button class="cmp-tab" data-tab="sql" id="tabSql">🗄 SQL</button>
  </div>

  <!-- 通用代码 -->
  <div class="cmp-pane" id="paneCode">
    <div class="p-app">
      <div class="p-toolbar">
        <select class="p-select" id="cpLang"><option value="auto">自动检测</option><option value="js">JavaScript</option><option value="css">CSS</option><option value="html">HTML</option></select>
        <div class="btn-group">
          <button class="btn p-btn-toggle active" id="cpMinify" data-mode="minify">压缩</button>
          <button class="btn p-btn-toggle" id="cpPrettify" data-mode="prettify">美化</button>
        </div>
        <button class="btn p-btn-primary" id="cpProcess">▶ 执行</button>
        <button class="btn" id="cpCopy">📋 复制</button>
        <span class="p-spacer"></span>
        <button class="btn" id="cpClear">✕ 清空</button>
      </div>
      <div class="p-body">
        <div class="p-pane"><div class="p-pane-header">源代码</div><textarea id="cpInput" class="p-textarea p-textarea-input" placeholder="粘贴 JS / CSS / HTML…" spellcheck="false"></textarea></div>
        <div class="p-pane"><div class="p-pane-header">处理结果</div><textarea id="cpOutput" class="p-textarea p-textarea-output" readonly placeholder="结果…" spellcheck="false"></textarea></div>
      </div>
      <div class="p-statusbar" id="cpStatus">等待输入…</div>
    </div>
  </div>

  <!-- SQL -->
  <div class="cmp-pane" id="paneSql" hidden>
    <div class="p-app">
      <div class="p-toolbar">
        <button class="btn p-btn-primary" id="spFormat">▶ 格式化</button>
        <button class="btn" id="spCopy">📋 复制</button>
        <span class="p-spacer"></span>
        <button class="btn" id="spClear">✕ 清空</button>
      </div>
      <div class="p-body">
        <div class="p-pane"><div class="p-pane-header">SQL 输入</div><textarea id="spInput" class="p-textarea p-textarea-input" placeholder="SELECT * FROM users WHERE id = 1" spellcheck="false"></textarea></div>
        <div class="p-pane"><div class="p-pane-header">格式化输出</div><textarea id="spOutput" class="p-textarea p-textarea-output" readonly placeholder="格式化结果…" spellcheck="false"></textarea></div>
      </div>
      <div class="p-statusbar" id="spStatus">等待输入…</div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict'
  // ===== tab 切换 =====
  var tabCode=document.getElementById('tabCode'),tabSql=document.getElementById('tabSql')
  var paneCode=document.getElementById('paneCode'),paneSql=document.getElementById('paneSql')
  function showFmtTab(which){
    if(which==='sql'){tabSql.classList.add('active');tabCode.classList.remove('active');paneSql.hidden=false;paneCode.hidden=true}
    else{tabCode.classList.add('active');tabSql.classList.remove('active');paneCode.hidden=false;paneSql.hidden=true}
  }
  tabCode.addEventListener('click',function(){showFmtTab('code')})
  tabSql.addEventListener('click',function(){showFmtTab('sql')})
  window.showFmtTab=showFmtTab

  // ===== 通用代码（复用 code-formatter 算法）=====
  var cpInput=document.getElementById('cpInput'),cpOutput=document.getElementById('cpOutput')
  var cpProcess=document.getElementById('cpProcess'),cpCopy=document.getElementById('cpCopy'),cpClear=document.getElementById('cpClear')
  var cpMinify=document.getElementById('cpMinify'),cpPrettify=document.getElementById('cpPrettify')
  var cpLang=document.getElementById('cpLang'),cpStatus=document.getElementById('cpStatus')
  var cpMode='minify'
  cpMinify.addEventListener('click',function(){cpMode='minify';cpMinify.classList.add('active');cpPrettify.classList.remove('active');if(cpInput.value.trim())cpProcessCode()})
  cpPrettify.addEventListener('click',function(){cpMode='prettify';cpPrettify.classList.add('active');cpMinify.classList.remove('active');if(cpInput.value.trim())cpProcessCode()})
  cpProcess.addEventListener('click',cpProcessCode)
  cpCopy.addEventListener('click',function(){if(cpOutput.value){window.copyViaHost(cpOutput.value,function(){cpStatus.textContent='已复制！'})}})
  cpClear.addEventListener('click',function(){cpInput.value='';cpOutput.value='';cpStatus.textContent='等待输入…';cpInput.focus()})
  document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();cpProcessCode()}if(e.key==='Escape'&&!paneCode.hidden)cpInput.focus()})
  var cpTimer;cpInput.addEventListener('input',function(){if(cpTimer)clearTimeout(cpTimer);if(cpInput.value.trim())cpTimer=setTimeout(cpProcessCode,500);else{cpOutput.value='';cpStatus.textContent='等待输入…'}})
  function cpDetectLang(code){var t=code.trim();if(/^</.test(t)||/^<!DOCTYPE/i.test(t))return'html';if(/^[.#@]\w+\s*\{/.test(t)||/\{[\s\S]*:[^;]+;/.test(t))return'css';return'js'}
  function cpProcessCode(){
    var text=cpInput.value.trim()
    if(!text){cpOutput.value='';cpStatus.textContent='等待输入…';return}
    var lang=cpLang.value==='auto'?cpDetectLang(text):cpLang.value
    var result=cpMode==='minify'?cpMinifyFn(text,lang):cpPrettifyFn(text,lang)
    cpOutput.value=result
    var diff=text.length-result.length
    cpStatus.textContent='✅ '+lang.toUpperCase()+' '+(cpMode==='minify'?'压缩':'美化')+'完成 | '+(diff>0?'缩小 '+diff+' 字符':diff<0?'增大 '+(-diff)+' 字符':'大小不变')
  }
  function cpMinifyFn(code,lang){
    if(lang==='html')return code.replace(/<!--[\s\S]*?-->/g,'').replace(/>\s+</g,'><').replace(/\s{2,}/g,' ').trim()
    if(lang==='css')return code.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*([{}:;,>~+])\s*/g,'$1').trim()
    return code.replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*([=+\-*/%&|^~!?:;{}()\[\],<>])\s*/g,'$1').replace(/;}/g,'}').trim()
  }
  function cpPrettifyFn(code,lang){
    if(lang==='html'){var out='',ind=0,i=0;while(i<code.length){if(code[i]==='<'){var tag='';while(i<code.length&&code[i]!=='>'){tag+=code[i];i++}tag+='>';if(tag.indexOf('</')===0)ind=Math.max(0,ind-1);if(out.length>0&&out[out.length-1]!=='\n')out+='\n';for(var s=0;s<ind;s++)out+='  ';out+=tag;if(tag.indexOf('</')<0&&tag.indexOf('/>')<0&&tag.indexOf('<!')!==0)ind++}else out+=code[i];i++}return out.trim()}
    if(lang==='css'){code=code.replace(/\/\*[\s\S]*?\*\//g,'');var out2='';for(var j=0;j<code.length;j++){var c=code[j];if(c==='{'){out2+=' {\n  '}else if(c==='}'){out2+='\n}\n'}else if(c===';'){out2+=';\n  '}else out2+=c}return out2.trim()}
    code=code.replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'')
    var out3='',indent=0,inStr=false,sc=''
    for(var k=0;k<code.length;k++){var ch=code[k],next=code[k+1]||''
      if(inStr){out3+=ch;if(ch==='\\'&&next){out3+=next;k++}else if(ch===sc)inStr=false;continue}
      if(ch==="'"||ch==='"'||ch==='`'){inStr=true;sc=ch;out3+=ch;continue}
      if(ch==='{'){out3+=' {\n';indent++;for(var si=0;si<indent;si++)out3+='  ';continue}
      if(ch==='}'){indent=Math.max(0,indent-1);out3+='\n';for(var si2=0;si2<indent;si2++)out3+='  ';out3+='}';continue}
      if(ch===';'){out3+=';\n';for(var si3=0;si3<indent;si3++)out3+='  ';continue}
      if(ch===','&&k>0){out3+=',\n';for(var si4=0;si4<indent;si4++)out3+='  ';continue}
      if(ch==='\n'||ch==='\r')continue
      if(ch===' '||ch==='\t'){if(out3.length>0&&out3[out3.length-1]!==' '&&out3[out3.length-1]!=='\n')out3+=' ';continue}
      out3+=ch
    }
    return out3.replace(/\n{3,}/g,'\n\n').trim()
  }

  // ===== SQL（复用 sql-formatter 算法）=====
  var spInput=document.getElementById('spInput'),spOutput=document.getElementById('spOutput')
  var spFormat=document.getElementById('spFormat'),spCopy=document.getElementById('spCopy'),spClear=document.getElementById('spClear')
  var spStatus=document.getElementById('spStatus')
  document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter'&&!paneSql.hidden){e.preventDefault();spDoFormat()}if(e.key==='Escape'&&!paneSql.hidden)spInput.focus()})
  spFormat.addEventListener('click',spDoFormat)
  spCopy.addEventListener('click',function(){if(spOutput.value){window.copyViaHost(spOutput.value,function(){spStatus.textContent='已复制！'})}})
  spClear.addEventListener('click',function(){spInput.value='';spOutput.value='';spStatus.textContent='等待输入…';spInput.focus()})
  var spTimer;spInput.addEventListener('input',function(){if(spTimer)clearTimeout(spTimer);if(spInput.value.trim())spTimer=setTimeout(spDoFormat,600);else{spOutput.value='';spStatus.textContent='等待输入…'}})
  var SP_MAJOR_KW=['SELECT','FROM','WHERE','AND','OR','SET','INSERT INTO','VALUES','UPDATE','DELETE FROM','CREATE TABLE','ALTER TABLE','DROP TABLE','ORDER BY','GROUP BY','HAVING','LIMIT','OFFSET','JOIN','INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL JOIN','CROSS JOIN','ON','USING','UNION','UNION ALL','IN','EXISTS','NOT','BETWEEN','LIKE','IS NULL','IS NOT NULL','AS','DISTINCT','CASE','WHEN','THEN','ELSE','END','WITH','RECURSIVE','RETURNING','BEGIN','COMMIT','ROLLBACK']
  function spEscRE(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
  function spFormatSQL(sql){
    sql=sql.toUpperCase()
    var sorted=SP_MAJOR_KW.slice().sort(function(a,b){return b.length-a.length})
    for(var i=0;i<sorted.length;i++){var re=new RegExp('\\b'+spEscRE(sorted[i])+'\\b','g');sql=sql.replace(re,function(m){return m})}
    var clauses=['SELECT','FROM','WHERE','ORDER BY','GROUP BY','HAVING','LIMIT','OFFSET','SET','VALUES','INSERT INTO','UPDATE','DELETE FROM','CREATE TABLE','ALTER TABLE','DROP TABLE','INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL JOIN','CROSS JOIN','JOIN','UNION','UNION ALL','ON','USING','RETURNING']
    for(var j=0;j<clauses.length;j++){var re2=new RegExp('\\b'+spEscRE(clauses[j])+'\\b','gi');sql=sql.replace(re2,'\n'+clauses[j])}
    sql=sql.replace(/\nAND\b/gi,'\n  AND').replace(/\nOR\b/gi,'\n  OR')
    sql=sql.replace(/\n{3,}/g,'\n').replace(/^\n+/,'').replace(/\n+$/,'')
    var lines=sql.split('\n'),result=[]
    for(var k=0;k<lines.length;k++){
      var line=lines[k],depth=0,chars='',inComma=false
      if(/^SELECT/.test(line.trim())||/^\s*,/.test(line)){
        for(var ci=0;ci<line.length;ci++){
          var ch=line[ci];if(ch==='(')depth++;if(ch===')')depth--
          if(ch===','&&depth===0){chars+=',\n  ';inComma=true}else{chars+=ch}
        }
        result.push(chars)
      }else result.push(line)
    }
    return result.join('\n').trim()
  }
  function spDoFormat(){
    var text=spInput.value.trim()
    if(!text){spOutput.value='';spStatus.textContent='等待输入…';return}
    var result=spFormatSQL(text)
    spOutput.value=result
    spStatus.textContent='✅ 格式化完成 | '+(text.length-result.length>0?'压缩 '+(text.length-result.length)+' 字符':'大小不变')
  }

  // ===== 命令面板带参打开：按命令选择 tab / 模式并自动处理 =====
  window.addEventListener('message',function(e){
    var d=e&&e.data
    if(!d||d.type!=='plugin:init'||!d.data)return
    var pd=d.data,cmd=pd.command||''
    if(cmd==='format-sql'){
      showFmtTab('sql')
      if(pd.text){spInput.value=pd.text;spDoFormat()}
    }else{
      showFmtTab('code')
      if(cmd==='code-prettify'){cpMode='prettify';cpPrettify.classList.add('active');cpMinify.classList.remove('active')}
      else{cpMode='minify';cpMinify.classList.add('active');cpPrettify.classList.remove('active')}
      if(pd.text){cpInput.value=pd.text;cpProcessCode()}
    }
  })

  cpInput.focus()
})()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋</title>
<link rel="stylesheet" href="qd-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="g-app">
  <div class="g-head">
    <div class="g-title">五子棋</div>
    <div class="g-status" id="status">轮到你落子</div>
    <button class="p-btn p-btn-primary" id="new" type="button">新对局</button>
  </div>
  <div class="g-board">
    <div class="g-grid" id="grid"></div>
    <div class="g-over" id="over" hidden>
      <div class="g-over-text" id="overText">游戏结束</div>
      <button class="p-btn p-btn-primary" id="retry" type="button">再来一局</button>
    </div>
  </div>
  <div class="g-foot" id="best">战绩：—</div>
</div>
<script src="app.js"></script>
</body>
</html>

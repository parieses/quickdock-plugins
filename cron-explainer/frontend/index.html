<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Crontab 解释器</title>
<link rel="stylesheet" href="qd-theme.css">
<style>
.p-app{display:flex;flex-direction:column;height:100vh;padding:10px;gap:8px}
.p-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.p-row{display:flex;gap:8px;align-items:center}
.p-input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-family:var(--font-mono);font-size:14px;outline:none}
.p-input:focus{border-color:var(--accent)}.p-input::placeholder{color:var(--text-placeholder)}
.p-btn{height:32px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:12px;cursor:pointer;white-space:nowrap}
.p-btn:hover{background:var(--bg-hover)}
.p-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.p-btn-primary:hover{background:var(--accent-hover)}
.p-output{flex:1;overflow:auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:10px;font-family:var(--font-mono);font-size:12px;line-height:1.6;white-space:pre-wrap;color:var(--text-primary)}
.p-vis-bar{display:flex;align-items:center;gap:2px;font-size:11px;font-family:var(--font-mono);padding:1px 0}
.p-vis-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.p-vis-active{background:var(--accent)}
.p-vis-inactive{background:var(--bg-tertiary)}

/* 标签页 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding-bottom:6px;flex-shrink:0}
.tab{padding:6px 14px;border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--text-secondary);font-size:12px;cursor:pointer}
.tab:hover{color:var(--text-primary);background:var(--bg-hover)}
.tab.active{background:var(--accent);color:#fff;font-weight:600}
.pane{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px}

/* 生成页 */
.g-fields{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.g-field{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)}
.g-field input[type=number]{width:64px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-family:var(--font-mono);font-size:13px;outline:none}
.g-field input[type=text]{width:88px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-family:var(--font-mono);font-size:13px;outline:none}
.g-field input:focus{border-color:var(--accent)}
.g-week{display:flex;gap:4px;flex-wrap:wrap}
.g-day{padding:5px 9px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-secondary);font-size:12px;cursor:pointer;user-select:none}
.g-day.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.g-presets{display:flex;flex-wrap:wrap;gap:6px}
.g-preset{padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-secondary);font-size:11px;cursor:pointer;font-family:var(--font-mono)}
.g-preset:hover{border-color:var(--accent);color:var(--accent)}
.g-expr{font-family:var(--font-mono);font-size:15px;color:var(--accent);font-weight:600}
select.p-input{cursor:pointer}
</style>
</head>
<body>
<div class="p-app">
  <div class="tabs">
    <button class="tab active" data-tab="explain">解释</button>
    <button class="tab" data-tab="gen">生成</button>
  </div>

  <!-- ============ 解释 ============ -->
  <div class="pane" id="pane-explain">
    <div class="p-label">Cron 表达式</div>
    <div class="p-row">
      <input type="text" id="inputField" class="p-input" placeholder="*/5 * * * *" spellcheck="false" autofocus>
      <button class="p-btn p-btn-primary" id="btnExplain">解释</button>
    </div>
    <div class="p-label">解释结果</div>
    <div class="p-output" id="output">
      <span style="color:var(--text-muted)">输入 cron 表达式查看解释…</span>
    </div>
  </div>

  <!-- ============ 生成 ============ -->
  <div class="pane" id="pane-gen" style="display:none">
    <div class="p-label">常用预设</div>
    <div class="g-presets" id="presets"></div>

    <div class="p-label">周期类型</div>
    <select id="genType" class="p-input">
      <option value="minute">每隔 N 分钟</option>
      <option value="hour">每隔 N 小时</option>
      <option value="day">每天</option>
      <option value="week">每周</option>
      <option value="month">每月</option>
      <option value="custom">自定义（分别填 5 段）</option>
    </select>

    <div class="g-fields" id="genFields"></div>

    <div class="p-label">生成的表达式</div>
    <div class="p-row">
      <span class="g-expr" id="genExpr">—</span>
    </div>
    <div class="p-row">
      <button class="p-btn" id="btnCopyGen">复制</button>
      <button class="p-btn p-btn-primary" id="btnExplainGen">解释它</button>
    </div>
    <div class="p-label">预览</div>
    <div class="p-output" id="genPreview"></div>
  </div>
</div>
<script>
// ==================== 页面 i18n（自包含样板，同 pdf-toolkit） ====================
var L10N = {
  'en-US': {
    'Cron 表达式': 'Cron Expression',
    '解释': 'Explain',
    '解释结果': 'Result',
    '输入 cron 表达式查看解释…': 'Enter a cron expression to see the explanation…',
    '输入 cron 表达式': 'Enter a cron expression',
    '需要 5 段（分 时 日 月 周）': 'Expected 5 fields (min hour dom month dow)',
    '字段分解:': 'Field breakdown:',
    '分 (0-59): ': 'Min (0-59): ',
    '时 (0-23): ': 'Hour (0-23): ',
    '日 (1-31): ': 'Day (1-31): ',
    '月 (1-12): ': 'Month (1-12): ',
    '周 (0-7): ': 'Weekday (0-7): ',
    '⏰ 下次执行:': '⏰ Next runs:',
    '📊 小时分布:': '📊 Hour distribution:',
    '无法计算（请检查表达式）': 'Cannot compute (check the expression)',
    '每分钟执行一次': 'Runs every minute',
    // —— 生成页 ——
    '生成': 'Generate',
    '常用预设': 'Presets',
    '周期类型': 'Frequency',
    '生成的表达式': 'Expression',
    '复制': 'Copy',
    '已复制': 'Copied',
    '解释它': 'Explain it',
    '预览': 'Preview',
    '每隔': 'Every',
    '分钟': 'min(s)',
    '小时': 'hour(s)',
    '于第': 'at min',
    '执行时间': 'At',
    '时': 'h',
    '分': 'm',
    '日期': 'Day',
    '号': '',
    '星期': 'Weekday',
    '日': 'd',
    '周': 'dow',
    '月': 'mon',
    '自定义（分别填 5 段）': 'Custom (5 separate fields)',
    '请至少选择一个星期': 'Select at least one weekday'
  }
};
function isEn() {
  var l = document.documentElement.getAttribute('lang') || '';
  return l.indexOf('en') === 0;
}
function L(key) {
  if (!isEn()) return key;
  var map = L10N['en-US'] || {};
  return map[key] !== undefined ? map[key] : key;
}
function applyStaticL10n() {
  document.querySelectorAll('.p-label, .p-btn, .tab').forEach(function (el) {
    var src = el.getAttribute('data-orig');
    if (!src) { src = el.textContent.trim(); el.setAttribute('data-orig', src); }
    if (src) el.textContent = L(src);
  });
}

(function(){
  var input=document.getElementById('inputField'),output=document.getElementById('output')
  var btn=document.getElementById('btnExplain')
  function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
  btn.addEventListener('click',explain);input.addEventListener('keydown',function(e){if(e.key==='Enter')explain()})
  document.addEventListener('keydown',function(e){if(e.key==='Escape')input.focus()})

  /* ---------- 标签页切换 ---------- */
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')})
      t.classList.add('active')
      var which=t.getAttribute('data-tab')
      document.getElementById('pane-explain').style.display = which==='explain'?'flex':'none'
      document.getElementById('pane-gen').style.display = which==='gen'?'flex':'none'
      if(which==='explain') input.focus()
    })
  })

  /* ---------- 命令面板 / 主题 ---------- */
  window.addEventListener('message',function(e){
    var d=e.data
    if(d&&d.type==='plugin:init'){
      var pd=d.data||{}
      // gen-cron 命令（无输入）直达生成页
      if(pd.command==='gen-cron'&&!pd.text){switchTo('gen');return}
      if(pd.text){switchTo('explain');input.value=pd.text;explain()}
    }
    if(d&&d.type==='plugin:theme'&&d.data&&d.data.locale){
      document.documentElement.setAttribute('lang',d.data.locale)
      applyStaticL10n()
      buildGenFields();renderGen()
      if(input.value.trim())explain()
      else output.innerHTML='<span style="color:var(--text-muted)">'+L('输入 cron 表达式查看解释…')+'</span>'
    }
  })
  function switchTo(which){
    document.querySelectorAll('.tab').forEach(function(x){
      var on=x.getAttribute('data-tab')===which
      x.classList.toggle('active',on)
    })
    document.getElementById('pane-explain').style.display = which==='explain'?'flex':'none'
    document.getElementById('pane-gen').style.display = which==='gen'?'flex':'none'
  }

  /* ==================== 解释 ==================== */
  function explain(){
    var text=input.value.trim().replace(/^\/cron\s+/,'')
    if(!text){output.innerHTML='<span style="color:var(--text-muted)">'+L('输入 cron 表达式')+'</span>';return}
    var parts=text.split(/\s+/)
    if(parts.length!==5){output.innerHTML='<span style="color:var(--danger)">'+L('需要 5 段（分 时 日 月 周）')+'</span>';return}
    var fields={minute:parts[0],hour:parts[1],dom:parts[2],month:parts[3],dow:parts[4]}
    var desc=isEn()?describeEn(fields):describe(fields)
    var nextRuns=computeNext(fields,5)
    var hours=expandField(fields.hour,0,23)
    var html=''
    html+='<div style="color:var(--accent);font-weight:500;margin-bottom:6px">📋 '+escapeHtml(desc)+'</div>'
    html+='<div style="color:var(--text-muted);margin-bottom:4px">'+L('字段分解:')+'</div>'
    html+='<div>'+L('分 (0-59): ')+'<span style="color:var(--text-primary)">'+escapeHtml(fields.minute)+'</span></div>'
    html+='<div>'+L('时 (0-23): ')+'<span style="color:var(--text-primary)">'+escapeHtml(fields.hour)+'</span></div>'
    html+='<div>'+L('日 (1-31): ')+'<span style="color:var(--text-primary)">'+escapeHtml(fields.dom)+'</span></div>'
    html+='<div>'+L('月 (1-12): ')+'<span style="color:var(--text-primary)">'+escapeHtml(fields.month)+'</span></div>'
    html+='<div>'+L('周 (0-7): ')+'<span style="color:var(--text-primary)">'+escapeHtml(fields.dow)+'</span></div>'
    html+='<div style="color:var(--text-muted);margin:6px 0 4px">'+L('⏰ 下次执行:')+'</div>'
    for(var i=0;i<nextRuns.length;i++)html+='<div style="color:var(--text-primary)">  '+(i+1)+'. '+escapeHtml(nextRuns[i])+'</div>'
    if(hours&&hours.length<12){
      html+='<div style="color:var(--text-muted);margin:6px 0 4px">'+L('📊 小时分布:')+'</div>'
      for(var h=0;h<24;h++){
        var active=hours.indexOf(h)>=0
        html+='<div class="p-vis-bar"><span style="color:var(--text-muted);min-width:24px;text-align:right">'+(h<10?'0':'')+h+'</span>'+
          '<span class="p-vis-dot '+(active?'p-vis-active':'p-vis-inactive')+'"></span></div>'
      }
    }
    output.textContent = html
  }
  function describe(f){
    var parts=[]
    if(f.dow!=='*') parts.push('星期'+describeSimple(f.dow,['日','一','二','三','四','五','六','日']))
    if(f.month!=='*') parts.push(describeSimple(f.month,['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']))
    if(f.dom!=='*') parts.push('每月'+describeSimple(f.dom,null)+'号')
    if(f.hour!=='*'&&f.minute!=='*') parts.push(describeSimple(f.hour,null)+'点'+describeSimple(f.minute,null)+'分')
    else if(f.hour!=='*') parts.push(describeSimple(f.hour,null)+'点')
    else if(f.minute!=='*') parts.push('每小时的'+describeSimple(f.minute,null)+'分')
    return parts.length?parts.join('，'):'每分钟执行一次'
  }
  function describeSimple(val,labels){
    var res=[],parts=val.split(',')
    for(var i=0;i<parts.length;i++){
      var p=parts[i].trim()
      if(p.indexOf('/')>=0){var sp=p.split('/');res.push(sp[0]==='*'?'每隔'+sp[1]:sp[0]+'起每'+sp[1])}
      else if(p.indexOf('-')>=0){var dp=p.split('-');res.push((labels?labels[+dp[0]]:dp[0])+'-'+(labels?labels[+dp[1]]:dp[1]))}
      else res.push(labels?labels[+p]:p)
    }
    return res.join('、')
  }
  function expandField(val,min,max){
    if(val==='*')return null
    var result=[],parts=val.split(',')
    for(var i=0;i<parts.length;i++){
      var p=parts[i].trim(),step=1,rs=min,re=max
      var si=p.indexOf('/');if(si>=0){step=+p.slice(si+1);p=p.slice(0,si)}
      if(p==='*'){for(var v=min;v<=max;v+=step)result.push(v);continue}
      var di=p.indexOf('-');if(di>=0){rs=+p.slice(0,di);re=+p.slice(di+1)}else rs=re=+p
      for(var vv=rs;vv<=re;vv+=step)result.push(vv)
    }
    return result
  }
  function computeNext(f,count){
    var now=new Date(),results=[],current=new Date(now);current.setSeconds(0,0)
    var mins=expandField(f.minute,0,59),hours=expandField(f.hour,0,23)
    var doms=expandField(f.dom,1,31),months=expandField(f.month,1,12),dows=expandField(f.dow,0,7)
    var dw={};if(dows)for(var di=0;di<dows.length;di++)dw[dows[di]]=true
    var att=0;while(results.length<count&&att<10000){
      att++;var cm=current.getMonth()+1,cd=current.getDate(),ch=current.getHours(),cmin=current.getMinutes()
      var mOk=!months||months.indexOf(cm)>=0,dOk=!doms||doms.indexOf(cd)>=0
      var wOk=Object.keys(dw).length===0||dw[current.getDay()]
      if(mOk&&dOk&&wOk){if(!hours||hours.indexOf(ch)>=0){if(!mins||mins.indexOf(cmin)>=0){results.push(fmt(current));current.setMinutes(cmin+1);continue}current.setMinutes(cmin+1);continue}current.setHours(ch+1,0,0,0);continue}
      current.setDate(cd+1);current.setHours(0,0,0,0)
    }
    return results.length?results:[L('无法计算（请检查表达式）')]
  }
  function describeEn(f){
    var parts=[]
    if(f.dow!=='*') parts.push('on '+describeSimpleEn(f.dow,['Sun','Mon','Tue','Wed','Thu','Fri','Sat','Sun']))
    if(f.month!=='*') parts.push('in '+describeSimpleEn(f.month,['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']))
    if(f.dom!=='*') parts.push('on day '+describeSimpleEn(f.dom,null))
    if(f.hour!=='*'&&f.minute!=='*') parts.push('at '+describeSimpleEn(f.hour,null)+':'+(f.minute.length>1?f.minute:('0'+f.minute).slice(-2)))
    else if(f.hour!=='*') parts.push('at hour '+describeSimpleEn(f.hour,null))
    else if(f.minute!=='*') parts.push('at minute '+describeSimpleEn(f.minute,null)+' of every hour')
    return parts.length?parts.join(', '):L('每分钟执行一次')
  }
  function describeSimpleEn(val,labels){
    var res=[],parts=val.split(',')
    for(var i=0;i<parts.length;i++){
      var p=parts[i].trim()
      if(p.indexOf('/')>=0){var sp=p.split('/');res.push(sp[0]==='*'?'every '+sp[1]:'from '+sp[0]+' every '+sp[1])}
      else if(p.indexOf('-')>=0){var dp=p.split('-');res.push((labels?labels[+dp[0]]:dp[0])+'-'+(labels?labels[+dp[1]]:dp[1]))}
      else res.push(labels?labels[+p]:p)
    }
    return res.join(', ')
  }
  function fmt(d){var p=function(n){return n<10?'0'+n:''+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}

  /* ==================== 生成 ==================== */
  var DAY_CN=['日','一','二','三','四','五','六']
  var DAY_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat']

  var PRESETS=[
    {label:'每分钟',     expr:'* * * * *'},
    {label:'每5分钟',    expr:'*/5 * * * *'},
    {label:'每30分钟',   expr:'*/30 * * * *'},
    {label:'每小时',     expr:'0 * * * *'},
    {label:'每天 2:00',  expr:'0 2 * * *'},
    {label:'每天 9:00',  expr:'0 9 * * *'},
    {label:'工作日 9:00',expr:'0 9 * * 1-5'},
    {label:'每周一 9:00',expr:'0 9 * * 1'},
    {label:'每月1号',    expr:'0 0 1 * *'},
    {label:'每年1月1日', expr:'0 0 1 1 *'}
  ]

  // 每种周期类型需要的输入项
  function fieldSpecs(type){
    switch(type){
      case 'minute': return [
        {k:'n',label:L('每隔'),type:'number',min:1,max:59,def:5,suffix:L('分钟')}
      ]
      case 'hour': return [
        {k:'n',label:L('每隔'),type:'number',min:1,max:23,def:2,suffix:L('小时')},
        {k:'m',label:L('于第'),type:'number',min:0,max:59,def:0,suffix:L('分')}
      ]
      case 'day': return [
        {k:'h',label:L('执行时间'),type:'number',min:0,max:23,def:2,suffix:L('时')},
        {k:'m',label:'',type:'number',min:0,max:59,def:0,suffix:L('分')}
      ]
      case 'week': return [
        {k:'dow',label:L('星期'),type:'week'},
        {k:'h',label:L('执行时间'),type:'number',min:0,max:23,def:9,suffix:L('时')},
        {k:'m',label:'',type:'number',min:0,max:59,def:0,suffix:L('分')}
      ]
      case 'month': return [
        {k:'d',label:L('日期'),type:'number',min:1,max:31,def:1,suffix:L('号')},
        {k:'h',label:L('执行时间'),type:'number',min:0,max:23,def:0,suffix:L('时')},
        {k:'m',label:'',type:'number',min:0,max:59,def:0,suffix:L('分')}
      ]
      default: return [
        {k:'minute',label:L('分'),type:'text',def:'*'},
        {k:'hour',  label:L('时'),type:'text',def:'*'},
        {k:'dom',   label:L('日'),type:'text',def:'*'},
        {k:'month', label:L('月'),type:'text',def:'*'},
        {k:'dow',   label:L('周'),type:'text',def:'*'}
      ]
    }
  }

  var genState={ type:'minute', n:5, m:0, h:2, d:1, dow:[1], minute:'*', hour:'*', dom:'*', month:'*', dowf:'*' }

  function clampNum(el,min,max){
    var v=parseInt(el.value,10)
    if(isNaN(v))v=min
    if(v<min)v=min; if(v>max)v=max
    el.value=v
    return v
  }

  function buildGenFields(){
    var box=document.getElementById('genFields')
    box.innerHTML=''
    var specs=fieldSpecs(genState.type)
    specs.forEach(function(sp){
      var wrap=document.createElement('div');wrap.className='g-field'
      if(sp.label){var lb=document.createElement('span');lb.textContent=sp.label;wrap.appendChild(lb)}
      if(sp.type==='week'){
        var wk=document.createElement('div');wk.className='g-week'
        DAY_CN.forEach(function(d,i){
          var b=document.createElement('span')
          b.className='g-day'+(genState.dow.indexOf(i)>=0?' on':'')
          b.textContent=isEn()?DAY_EN[i]:d
          b.addEventListener('click',function(){
            var idx=genState.dow.indexOf(i)
            if(idx>=0)genState.dow.splice(idx,1); else genState.dow.push(i)
            genState.dow.sort(function(a,b){return a-b})
            b.classList.toggle('on')
            renderGen()
          })
          wk.appendChild(b)
        })
        wrap.appendChild(wk)
      } else if(sp.type==='number'){
        var inp=document.createElement('input')
        inp.type='number';inp.min=sp.min;inp.max=sp.max;inp.value=genState[sp.k]
        inp.addEventListener('input',function(){genState[sp.k]=clampNum(inp,sp.min,sp.max);renderGen()})
        wrap.appendChild(inp)
        if(sp.suffix){var su=document.createElement('span');su.textContent=sp.suffix;wrap.appendChild(su)}
      } else {
        var ti=document.createElement('input')
        ti.type='text';ti.value=genState[sp.k]
        ti.addEventListener('input',function(){genState[sp.k]=ti.value.trim()||'*';renderGen()})
        wrap.appendChild(ti)
      }
      box.appendChild(wrap)
    })
  }

  function buildExpr(){
    var s=genState
    switch(s.type){
      case 'minute': return s.n<=1 ? '* * * * *' : '*/'+s.n+' * * * *'
      case 'hour':   return (s.n<=1?'0':s.m)+' '+(s.n<=1?'*':'*/'+s.n)+' * * *'
      case 'day':    return s.m+' '+s.h+' * * *'
      case 'week':
        if(!s.dow.length) return ''
        return s.m+' '+s.h+' * * '+s.dow.join(',')
      case 'month':  return s.m+' '+s.h+' '+s.d+' * *'
      default:       return [s.minute,s.hour,s.dom,s.month,s.dowf].join(' ')
    }
  }

  function renderGen(){
    var expr=buildExpr()
    var exprEl=document.getElementById('genExpr')
    exprEl.textContent=expr||(genState.type==='week'?L('请至少选择一个星期'):'—')
    var pv=document.getElementById('genPreview')
    if(!expr){pv.innerHTML='<span style="color:var(--text-muted)">—</span>';return}
    var parts=expr.split(/\s+/)
    var fields={minute:parts[0],hour:parts[1],dom:parts[2],month:parts[3],dow:parts[4]}
    var desc=isEn()?describeEn(fields):describe(fields)
    var next=computeNext(fields,5)
    var html='<div style="color:var(--accent);font-weight:500;margin-bottom:6px">📋 '+escapeHtml(desc)+'</div>'
    html+='<div style="color:var(--text-muted);margin:4px 0">'+L('⏰ 下次执行:')+'</div>'
    for(var i=0;i<next.length;i++)html+='<div>  '+(i+1)+'. '+escapeHtml(next[i])+'</div>'
    pv.textContent = html
  }

  // 预设点击：把表达式反解回填生成器，停留在生成页即时预览（不再跳到解释页）
  function applyExprToGenerator(expr){
    var parts=String(expr).trim().split(/\s+/)
    var fit=null
    if(parts.length===5){
      var m=parts[0],h=parts[1],dom=parts[2],mon=parts[3],dow=parts[4]
      if(/^\*\/\d+$/.test(m)){fit='minute';genState.n=parseInt(m.slice(2),10)||1}
      else if(m==='*'&&h==='*'&&dom==='*'&&mon==='*'&&dow==='*'){fit='minute';genState.n=1}
      else if(/^\d+$/.test(m)&&/^\*\/\d+$/.test(h)){fit='hour';genState.m=parseInt(m,10);genState.n=parseInt(h.slice(2),10)}
      else if(/^\d+$/.test(m)&&h==='*'&&dom==='*'&&mon==='*'&&dow==='*'){fit='hour';genState.m=parseInt(m,10);genState.n=1}
      else if(/^\d+$/.test(m)&&/^\d+$/.test(h)&&dom==='*'&&mon==='*'&&dow==='*'){fit='day';genState.m=parseInt(m,10);genState.h=parseInt(h,10)}
      else if(/^\d+$/.test(m)&&/^\d+$/.test(h)&&/^\d+$/.test(dom)&&mon==='*'&&dow==='*'){fit='month';genState.m=parseInt(m,10);genState.h=parseInt(h,10);genState.d=parseInt(dom,10)}
      else if(/^\d+$/.test(m)&&/^\d+$/.test(h)&&dom==='*'&&mon==='*'&&/^[\d,\-]+$/.test(dow)){
        fit='week';genState.m=parseInt(m,10);genState.h=parseInt(h,10)
        var arr=[];dow.split(',').forEach(function(seg){if(seg.indexOf('-')>=0){var a=seg.split('-');for(var i=+a[0];i<=+a[1];i++)arr.push(i)}else arr.push(+seg)})
        genState.dow=arr
      }
    }
    if(fit){
      genState.type=fit
      document.getElementById('genType').value=fit
    } else {
      genState.type='custom'
      genState.minute=parts[0]||'*';genState.hour=parts[1]||'*';genState.dom=parts[2]||'*'
      genState.month=parts[3]||'*';genState.dowf=parts[4]||'*'
      document.getElementById('genType').value='custom'
    }
    buildGenFields();renderGen()
  }

  // 预设
  var presetBox=document.getElementById('presets')
  PRESETS.forEach(function(p){
    var b=document.createElement('span');b.className='g-preset';b.textContent=p.label
    b.addEventListener('click',function(){
      applyExprToGenerator(p.expr) // 停留在生成页：回填周期类型与字段并即时预览
    })
    presetBox.appendChild(b)
  })

  document.getElementById('genType').addEventListener('change',function(){
    genState.type=this.value;buildGenFields();renderGen()
  })

  document.getElementById('btnCopyGen').addEventListener('click',function(){
    var expr=buildExpr(); if(!expr)return
    var self=this,old=self.textContent
    var done=function(){self.textContent=L('已复制');setTimeout(function(){self.textContent=old},1200)}
    try{
      if(window.host&&window.host.clipboard&&window.host.clipboard.write){window.host.clipboard.write(expr).then(done,done);return}
    }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(expr).then(done,done);return}
    var ta=document.createElement('textarea');ta.value=expr;document.body.appendChild(ta);ta.select()
    try{document.execCommand('copy')}catch(e){}
    ta.remove();done()
  })

  document.getElementById('btnExplainGen').addEventListener('click',function(){
    var expr=buildExpr(); if(!expr)return
    switchTo('explain');input.value=expr;explain()
  })

  // 初始占位按当前语言渲染
  output.innerHTML='<span style="color:var(--text-muted)">'+L('输入 cron 表达式查看解释…')+'</span>'
  input.focus()
  buildGenFields();renderGen()
})()
</script>
</body>
</html>

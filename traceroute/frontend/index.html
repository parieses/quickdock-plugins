<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路由追踪</title>
<link rel="stylesheet" href="qd-theme.css">
<style>
.app{display:flex;flex-direction:column;height:100%;padding:var(--sp-3);gap:var(--sp-2);box-sizing:border-box}
.row{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.input{flex:1;min-width:180px;padding:8px 10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:13px;outline:none;font-family:ui-monospace,Consolas,monospace}
.input:focus{border-color:var(--accent,#4a9eff)}
.mini{width:70px;padding:8px 6px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:12px;outline:none}
.lbl{font-size:11px;color:var(--text-muted);white-space:nowrap}
.btn{padding:8px 18px;background:var(--accent,#4a9eff);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn.stop{background:var(--danger,#e24b4a)}
.hint{font-size:12px;color:var(--text-muted);min-height:16px}
.hint.err{color:var(--danger,#e24b4a)}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);cursor:pointer}
.hops{flex:1;overflow-y:auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:6px}
table{width:100%;border-collapse:collapse;font-family:ui-monospace,Consolas,monospace;font-size:12px}
th{text-align:left;color:var(--text-muted);font-weight:500;font-size:11px;padding:4px 6px;border-bottom:1px solid var(--border)}
td{padding:5px 6px;color:var(--text-primary);border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.ttl{color:var(--text-muted);width:34px}
.addr{color:var(--accent,#4a9eff)}
.host{color:var(--text-muted);font-size:11px}
.rtt{text-align:right;width:74px}
.miss{color:var(--text-muted)}
.bar-cell{width:120px}
.bar{height:6px;background:var(--accent,#4a9eff);border-radius:3px;min-width:2px}
.done-row td{background:rgba(126,200,120,.08)}
.done-tag{color:#5ac05a;font-size:11px;font-weight:600}
.empty{color:var(--text-muted);font-size:12px;padding:14px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="row">
    <input id="host" class="input" placeholder="主机名或 IP，如 223.5.5.5" spellcheck="false" autofocus>
    <button id="btnGo" class="btn">开始</button>
  </div>
  <div class="row">
    <span class="lbl" id="t-max">最大跳数</span>
    <input id="maxHops" class="mini" type="number" value="30" min="1" max="64">
    <span class="lbl" id="t-probes">每跳探测</span>
    <input id="probes" class="mini" type="number" value="3" min="1" max="5">
    <span class="lbl" id="t-timeout">超时(ms)</span>
    <input id="timeout" class="mini" type="number" value="1500" min="200" max="5000">
    <label class="chk"><input id="resolve" type="checkbox" checked><span id="t-resolve">解析主机名</span></label>
  </div>
  <div id="hint" class="hint"></div>
  <div class="hops">
    <table>
      <thead><tr>
        <th>#</th><th id="t-col-addr">地址</th><th id="t-col-rtt">延迟</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty">输入目标后点击「开始」追踪路径</div>
  </div>
</div>
<script>
(function(){
  'use strict'

  /* ---------- i18n ---------- */
  var L10N = {
    'en-US': {
      '最大跳数':'Max hops','每跳探测':'Probes','超时(ms)':'Timeout(ms)','解析主机名':'Resolve hostnames',
      '开始':'Start','停止':'Stop','地址':'Address','延迟':'Latency',
      '请输入目标主机':'Enter a host or IP','追踪中…':'Tracing…','已停止':'Stopped',
      '输入目标后点击「开始」追踪路径':'Enter a host and click Start to trace the path',
      '主机名或 IP，如 223.5.5.5':'Host or IP, e.g. 223.5.5.5',
      '目标':'target','无响应':'no reply'
    }
  }
  function L(k){
    var loc = document.documentElement.getAttribute('lang') || 'zh-CN'
    var map = L10N[loc] || L10N[loc.split('-')[0]] || {}
    return (map && map[k] !== undefined) ? map[k] : k
  }
  function renderStatic(){
    var m = {'t-max':'最大跳数','t-probes':'每跳探测','t-timeout':'超时(ms)',
             't-resolve':'解析主机名','t-col-addr':'地址','t-col-rtt':'延迟'}
    for (var id in m) document.getElementById(id).textContent = L(m[id])
    document.getElementById('host').placeholder = L('主机名或 IP，如 223.5.5.5')
    if (!running) document.getElementById('btnGo').textContent = L('开始')
    document.getElementById('empty').textContent = L('输入目标后点击「开始」追踪路径')
  }

  /* ---------- RPC ---------- */
  var seq = 0, pend = {}
  function send(command, input){
    return new Promise(function(resolve, reject){
      var id = 'tr_' + (++seq)
      pend[id] = { resolve: resolve, reject: reject }
      parent.postMessage({ type:'plugin:execute', id:id, command:command, input:input || {} }, '*')
    })
  }
  window.addEventListener('message', function(e){
    var d = e.data
    if (!d) return
    if (d.type === 'plugin:result' && d.id && pend[d.id]) {
      var p = pend[d.id]; delete pend[d.id]
      if (d.error) p.reject(new Error(d.error)); else p.resolve(d.data)
      return
    }
    if (d.type === 'plugin:init') {
      var pd = d.data || {}
      if (pd.text) document.getElementById('host').value = pd.text
      return
    }
    if (d.type === 'plugin:theme') {
      var dd = d.data || {}
      if (dd.locale) document.documentElement.setAttribute('lang', dd.locale)
      renderStatic(); if (hops.length) renderHops()
    }
  })

  /* ---------- 状态 ---------- */
  var running = false, sessionId = null, pollTimer = null, hops = []

  var el = function(id){ return document.getElementById(id) }
  var hint = el('hint'), tbody = el('tbody'), emptyEl = el('empty')

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

  function renderHops(){
    if (!hops.length) { tbody.innerHTML = ''; emptyEl.style.display = ''; return }
    emptyEl.style.display = 'none'

    // 计算柱状图基准：取所有有效 RTT 的最大值
    var maxRtt = 0
    for (var i = 0; i < hops.length; i++)
      for (var k = 0; k < hops[i].rtts.length; k++)
        if (hops[i].rtts[k] > maxRtt) maxRtt = hops[i].rtts[k]
    if (maxRtt <= 0) maxRtt = 1

    var html = ''
    for (var i = 0; i < hops.length; i++) {
      var h = hops[i]
      var okRtts = []
      for (var k = 0; k < h.rtts.length; k++) if (h.rtts[k] >= 0) okRtts.push(h.rtts[k])
      var avg = okRtts.length ? okRtts.reduce(function(a,b){return a+b},0) / okRtts.length : -1

      var rttTxt = h.ok
        ? (avg > 0 ? avg.toFixed(avg < 10 ? 1 : 0) + 'ms' : '&lt;1ms')
        : '<span class="miss">' + L('无响应') + '</span>'
      var detail = h.rtts.map(function(v){ return v >= 0 ? (v>0?v.toFixed(0):'<1')+'ms' : '*' }).join(' ')

      var addr = h.ip || '*'
      var host = h.host ? '<div class="host">' + esc(h.host) + '</div>' : ''
      if (!h.ok) addr = '<span class="miss">*</span>'

      html += '<tr class="' + (h.done ? 'done-row' : '') + '">' +
        '<td class="ttl">' + h.ttl + '</td>' +
        '<td><span class="addr">' + esc(addr) + '</span>' + host +
          (h.done ? ' <span class="done-tag">' + L('目标') + '</span>' : '') + '</td>' +
        '<td class="rtt">' + rttTxt + '<div class="host">' + detail + '</div></td>' +
        '<td class="bar-cell">' + (avg >= 0
          ? '<div class="bar" style="width:' + Math.max(2, avg / maxRtt * 100) + '%"></div>'
          : '') + '</td>' +
        '</tr>'
    }
    tbody.innerHTML = html
  }

  function setRunning(v){
    running = v
    var b = el('btnGo')
    b.textContent = v ? L('停止') : L('开始')
    b.className = v ? 'btn stop' : 'btn'
  }

  function poll(){
    if (!sessionId) return
    send('poll', { sessionId: sessionId }).then(function(snap){
      hops = snap.hops || []
      renderHops()
      if (!snap.running) { finish(); return }
    }).catch(function(e){
      hint.className = 'hint err'
      hint.textContent = e && e.message ? e.message : String(e)
      finish()
    })
  }

  function finish(){
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
    setRunning(false)
    var sid = sessionId; sessionId = null
    if (sid) send('stop', { sessionId: sid }).catch(function(){})
    if (hops.length) {
      var last = hops[hops.length - 1]
      hint.className = 'hint'
      hint.textContent = last.done
        ? '到达 ' + last.ip + '，共 ' + hops.length + ' 跳'
        : '已停止，共 ' + hops.length + ' 跳'
    }
  }

  function start(){
    var host = el('host').value.trim()
    if (!host) { hint.className = 'hint err'; hint.textContent = L('请输入目标主机'); return }
    hint.className = 'hint'; hint.textContent = L('追踪中…')
    hops = []; tbody.innerHTML = ''

    send('start', {
      host: host,
      maxHops: parseInt(el('maxHops').value, 10) || 30,
      probes: parseInt(el('probes').value, 10) || 3,
      timeout: parseInt(el('timeout').value, 10) || 1500,
      resolve: el('resolve').checked
    }).then(function(r){
      sessionId = r.sessionId
      setRunning(true)
      hint.className = 'hint'
      hint.textContent = r.host + ' → ' + r.ip
      pollTimer = setInterval(poll, 700)
      poll()
    }).catch(function(e){
      hint.className = 'hint err'
      hint.textContent = e && e.message ? e.message : String(e)
    })
  }

  el('btnGo').addEventListener('click', function(){ running ? finish() : start() })
  el('host').addEventListener('keydown', function(e){ if (e.key === 'Enter') { running ? finish() : start() } })

  renderStatic()
  setRunning(false)
})()
</script>
</body>
</html>

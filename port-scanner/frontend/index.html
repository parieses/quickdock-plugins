<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>端口检查器</title>
<link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">
<style>
.p-app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.p-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0}
.p-toolbar .input{padding:4px 8px;font-size:12px;width:160px}
.p-toolbar .p-search{flex:1;min-width:0}
.p-toolbar .p-count{font-size:11px;color:var(--text-muted);white-space:nowrap}
.p-check{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0}
.p-check .p-input{width:100px;font-family:var(--font-mono);font-size:13px}
.p-result{margin:0 10px;padding:6px 10px;border-radius:var(--radius);font-size:12px;flex-shrink:0}
.p-free{background:rgba(40,200,100,.12);color:var(--success)}
.p-inuse{background:rgba(226,75,74,.12);color:var(--danger)}
.p-list{flex:1;overflow:auto}
.p-head{display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--bg-tertiary);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-muted);font-weight:600;flex-shrink:0}
.p-head .p-port,.p-head .p-proto,.p-head .p-v4,.p-head .p-v6,.p-head .p-pid,.p-head .p-name,.p-head .p-path{color:var(--text-muted)}
.p-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--border);min-height:28px;font-size:12px;cursor:pointer;user-select:none}
.p-item:hover{background:var(--bg-hover)}
.p-item.selected{background:var(--accent-soft)}
.p-port{font-family:var(--font-mono);color:var(--accent);min-width:54px;font-weight:600;flex-shrink:0}
.p-proto{color:var(--text-muted);min-width:30px;font-size:11px;flex-shrink:0}
.p-v4,.p-v6{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);min-width:104px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.p-v6{color:var(--text-muted)}
.p-v4:empty::before,.p-v6:empty::before{content:"—";color:var(--text-muted)}
.p-pid{font-family:var(--font-mono);color:var(--text-secondary);min-width:50px;font-size:11px;flex-shrink:0}
.p-name{color:var(--text-primary);min-width:90px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.p-path{color:var(--text-muted);font-size:11px;font-family:var(--font-mono);flex:1;min-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.p-path:hover{color:var(--text-secondary);text-decoration:underline;text-decoration-style:dotted}
.p-actions{flex-shrink:0;display:flex;gap:2px}
.p-empty{padding:24px;text-align:center;color:var(--text-muted);font-size:12px}
.p-filtered-hint{padding:6px 10px;font-size:11px;color:var(--text-muted);background:var(--bg-tertiary);border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<div class="p-app">
  <div class="p-toolbar">
    <button class="btn" id="btnRefresh" title="Ctrl+R">↻ 刷新</button>
    <input type="text" class="input p-search" id="searchInput" placeholder="按端口/PID/进程名/路径搜索…" spellcheck="false">
    <button class="btn btn-icon btn-ghost" id="btnClearSearch" title="清空搜索" style="display:none">×</button>
    <span class="p-count" id="countLabel">0 个端口</span>
  </div>
  <div class="p-check">
    <span class="p-label">检查端口：</span>
    <input type="text" class="input p-input" id="portInput" placeholder="如 8080" spellcheck="false">
    <button class="btn" id="btnCheck">检查</button>
    <span id="checkResult" class="p-result" style="display:none"></span>
  </div>
  <div id="filteredHint" class="p-filtered-hint" style="display:none"></div>
  <div class="p-head">
    <span class="p-port">端口</span>
    <span class="p-proto">协议</span>
    <span class="p-v4">IPv4</span>
    <span class="p-v6">IPv6</span>
    <span class="p-pid">PID</span>
    <span class="p-name">进程</span>
    <span class="p-path">路径</span>
    <span class="p-actions"></span>
  </div>
  <div class="p-list" id="portList"><div class="p-empty">点击刷新加载端口列表</div></div>
</div>
<script>
var cmdQueue=[],cmdRunning=false,netstatData=[],filterText=''
function $(id){return document.getElementById(id)}
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function pluginExec(cmd,data){return new Promise(function(resolve,reject){cmdQueue.push({cmd:cmd,data:data||{},resolve:resolve,reject:reject});if(!cmdRunning)nextCmd()})}
function nextCmd(){if(cmdQueue.length===0){cmdRunning=false;return}cmdRunning=true;var task=cmdQueue.shift(),timer=setTimeout(function(){window.removeEventListener('message',handler);cmdRunning=false;task.reject(new Error('响应超时，请检查插件状态'))},20000);window.parent.postMessage({type:'plugin:execute',id:Date.now(),command:task.cmd,input:{text:JSON.stringify(task.data)}},'*');var handler=function(e){if(e.data&&e.data.type==='plugin:result'){clearTimeout(timer);window.removeEventListener('message',handler);if(e.data.error){task.reject(new Error(e.data.error))}else{task.resolve(e.data.data)}setTimeout(nextCmd,50)}};window.addEventListener('message',handler)}

function refreshPorts(){var list=$('portList'),hint=$('filteredHint');list.innerHTML='<div class="p-empty">扫描中…</div>';hint.style.display='none';pluginExec('port-list',{}).then(function(data){try{var obj=typeof data==='string'?JSON.parse(data):data;netstatData=obj.ports||obj||[];renderPorts()}catch(e){netstatData=[];list.innerHTML='<div class="p-empty">解析失败: '+escapeHtml(e.message)+'</div>'}}).catch(function(e){netstatData=[];list.innerHTML='<div class="p-empty">扫描失败: '+escapeHtml(e.message)+'</div>'})}

function applyFilter(items){
  var q=filterText.toLowerCase().trim()
  if(!q) return items.slice()
  return items.filter(function(p){
    return String(p.port||'').indexOf(q)>=0
      || String(p.pid||'').indexOf(q)>=0
      || String(p.process||'').toLowerCase().indexOf(q)>=0
      || String(p.path||'').toLowerCase().indexOf(q)>=0
      || String(p.protocol||'').toLowerCase().indexOf(q)>=0
      || String(p.addrv4||'').toLowerCase().indexOf(q)>=0
      || String(p.addrv6||'').toLowerCase().indexOf(q)>=0
  })
}

function renderPorts(){var list=$('portList'),count=$('countLabel'),hint=$('filteredHint');if(!netstatData||netstatData.length===0){list.innerHTML='<div class="p-empty">没有找到监听端口</div>';count.textContent='0 个端口';hint.style.display='none';return}
var filtered=applyFilter(netstatData)
count.textContent=netstatData.length+' 个端口'+(filtered.length!==netstatData.length?'（显示 '+filtered.length+'）':'')
if(filterText&&filtered.length!==netstatData.length){hint.style.display='block';hint.textContent='筛选「'+filterText+'」: '+filtered.length+' / '+netstatData.length}
else{hint.style.display='none'}
if(filtered.length===0){list.innerHTML='<div class="p-empty">没有匹配的端口</div>';return}
list.innerHTML=filtered.map(function(p){
  var port=escapeHtml(p.port),proto=escapeHtml(p.protocol||''),pid=escapeHtml(p.pid||'-'),name=escapeHtml(p.process||p.name||''),path=escapeHtml(p.path||'')
  var v4=escapeHtml(p.addrv4||''),v6=escapeHtml(p.addrv6||'')
  return '<div class="p-item" data-pid="'+escapeHtml(p.pid||'')+'" data-port="'+port+'" data-v4="'+v4+'" data-v6="'+v6+'">'
    +'<span class="p-port">'+port+'</span>'
    +'<span class="p-proto">'+proto+'</span>'
    +'<span class="p-v4" title="'+(v4?v4:'无 IPv4 绑定')+'">'+v4+'</span>'
    +'<span class="p-v6" title="'+(v6?v6:'无 IPv6 绑定')+'">'+v6+'</span>'
    +'<span class="p-pid">'+pid+'</span>'
    +'<span class="p-name" title="'+escapeHtml(name||'(无)')+'">'+name+'</span>'
    +(path?'<span class="p-path" title="'+escapeHtml(path)+'">'+path+'</span>':'<span class="p-path"></span>')
    +'<span class="p-actions">'
    +'<button class="btn btn-sm btn-danger p-kill" title="结束占用 '+port+' 的进程 (Del)">✕</button>'
    +'</span>'
    +'</div>'
}).join('')
}

function checkPort(){var port=$('portInput').value.trim(),result=$('checkResult');if(!port){result.style.display='none';return}
result.style.display='flex'
if(!netstatData||netstatData.length===0){result.className='p-result p-free';result.textContent='端口 '+port+' — 数据加载中，先点击刷新…';refreshPorts();return}
var found=netstatData.some(function(p){return String(p.port)===port||String(p.port)===String(parseInt(port))})
if(found){result.className='p-result p-inuse';result.textContent='端口 '+port+' — 已被占用'}else{result.className='p-result p-free';result.textContent='端口 '+port+' — 可用'}}

function killRow(row){
  var port=row.dataset.port,pid=row.dataset.pid,name=row.querySelector('.p-name').textContent||'(无)'
  var v4=row.dataset.v4||'',v6=row.dataset.v6||''
  if(!pid||pid==='-'){qdAlert('该条目没有 PID，无法结束');return}
  var addr=''
  if(v4) addr+=' IPv4 '+v4
  if(v6) addr+=' IPv6 '+v6
  qdConfirm('确定结束占用端口 '+port+' 的进程 '+name+' (PID '+pid+')？'+addr).then(function(ok){
    if(!ok) return
    pluginExec('port-kill',{port:parseInt(port,10)}).then(function(){
      refreshPorts()
    }).catch(function(e){
      qdAlert('结束失败: '+e.message)
      // 即便失败也刷新一次：taskkill 可能已成功但 RPC 报错
      refreshPorts()
    })
  })
}

document.addEventListener('click',function(e){
  var killBtn=e.target.closest && e.target.closest('.p-kill')
  if(killBtn){e.stopPropagation();var row=killBtn.closest('.p-item');if(row)killRow(row);return}
  var row=e.target.closest && e.target.closest('.p-item')
  document.querySelectorAll('.p-item.selected').forEach(function(el){el.classList.toggle('selected',el===row)})
})

document.addEventListener('dblclick',function(e){
  var row=e.target.closest && e.target.closest('.p-item')
  if(row)killRow(row)
})

document.addEventListener('keydown',function(e){
  var ae=document.activeElement,editing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')
  if(e.key==='Delete'&&!editing){var sel=document.querySelector('.p-item.selected');if(sel){e.preventDefault();killRow(sel)}}
  if(e.key==='Enter'&&!editing){var sel2=document.querySelector('.p-item.selected');if(sel2){e.preventDefault();killRow(sel2)}}
  if((e.ctrlKey||e.metaKey)&&e.key==='r'&&!editing){e.preventDefault();refreshPorts()}
})

$('btnRefresh').addEventListener('click',refreshPorts)
$('btnCheck').addEventListener('click',checkPort)
$('portInput').addEventListener('keydown',function(e){if(e.key==='Enter')checkPort()})
$('portInput').addEventListener('input',function(){if(this.value.trim())checkPort()})
$('searchInput').addEventListener('input',function(){$('btnClearSearch').style.display=this.value?'inline-flex':'none';filterText=this.value;renderPorts()})
$('searchInput').addEventListener('keydown',function(e){if(e.key==='Escape'){this.value='';this.dispatchEvent(new Event('input'));this.blur()}})
$('btnClearSearch').addEventListener('click',function(){$('searchInput').value='';filterText='';renderPorts();$('searchInput').focus()})

window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='plugin:init') return
  refreshPorts()
  if(e.data.data&&e.data.data.text){
    var m=String(e.data.data.text).match(/(?:^|\s)(\d{1,5})\s*$/)
    if(m){$('portInput').value=m[1];checkPort()}
  }
})

// 自初始化：宿主若直接打开而非通过命令面板（少见）
setTimeout(function(){
  if(netstatData.length===0) refreshPorts()
},300)
</script>
</body>
</html>

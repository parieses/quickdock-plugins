<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>颜色工具</title>
<link rel="stylesheet" href="../common.css">
<style>
/* ===== 颜色转换页（复用 common.css 设计令牌） ===== */
.p-swatch{width:80px;height:80px;border-radius:var(--radius-lg);border:1px solid var(--border);flex-shrink:0;box-shadow:var(--shadow-1)}
.p-hero-meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.p-hero-hex{font-size:var(--fs-2xl);font-family:var(--font-mono);color:var(--text-primary);letter-spacing:.5px}
.p-hero-name{font-size:var(--fs-sm);color:var(--text-muted)}

.p-picker-row{display:flex;align-items:center;gap:var(--sp-3)}
.p-picker-row .p-label{color:var(--text-muted)}

.p-channels{display:flex;flex-direction:column;gap:var(--sp-2)}
.p-channel{display:flex;align-items:center;gap:var(--sp-3)}
.p-channel-tag{width:18px;font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--text-muted);text-align:center}
.p-channel input[type=number]{width:64px;box-sizing:border-box;padding:6px 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:var(--fs-sm);font-family:var(--font-mono);text-align:center;outline:none;transition:border-color var(--transition),box-shadow var(--transition)}
.p-channel input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

.p-hex-input{width:100%;box-sizing:border-box;padding:10px 12px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:var(--fs-lg);font-family:var(--font-mono);text-transform:uppercase;outline:none;transition:border-color var(--transition),box-shadow var(--transition)}
.p-hex-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* ===== 屏幕取色（热键冻结模式 v0.3.1） ===== */
.cc-btn{display:inline-flex;align-items:center;padding:8px 14px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-size:var(--fs-sm);font-weight:var(--fw-semibold);cursor:pointer;transition:filter var(--transition),transform var(--transition)}
.cc-btn:hover{filter:brightness(1.1)}
.cc-btn:active{transform:scale(.97)}
.cc-btn:disabled{opacity:.5;cursor:not-allowed}
.cc-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:999;align-items:center;gap:var(--sp-3);padding:10px 14px;background:var(--accent-soft);border-bottom:1px solid var(--accent);color:var(--text-primary);font-size:var(--fs-sm)}
.cc-banner.on{display:flex}
.cc-cancel{margin-left:auto;padding:4px 12px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);font-size:var(--fs-sm);cursor:pointer;transition:border-color var(--transition),color var(--transition)}
.cc-cancel:hover{border-color:var(--accent);color:var(--text-primary)}
</style>
</head>
<body>
<div class="p-app">
  <div class="p-head">
    <span class="p-head-title">颜色工具</span>
  </div>

  <div class="p-content">
    <div class="p-hero">
      <div class="p-swatch" id="swatch"></div>
      <div class="p-hero-meta">
        <span class="p-hero-hex" id="hexLabel">#000000</span>
        <span class="p-hero-name" id="nameLabel">—</span>
      </div>
    </div>

    <div class="p-picker-row">
      <span class="p-label">拾色器</span>
      <input type="color" class="p-native-color" id="nativeColor" value="#000000">
      <span class="p-muted">拖动选取任意颜色，下方三栏实时同步</span>
    </div>

    <div class="p-picker-row">
      <button class="cc-btn" id="pickScreen">屏幕取色</button>
      <span class="p-muted">进入取色模式后按 F8 取色，HEX 自动复制</span>
    </div>

    <div class="p-section">
      <div class="p-section-label"><span>HEX</span><span class="p-spacer"></span><button class="p-copy" id="copyHex">复制</button></div>
      <input type="text" class="p-hex-input" id="hexInput" spellcheck="false" placeholder="#RRGGBB">
    </div>

    <div class="p-section">
      <div class="p-section-label"><span>RGB</span><span class="p-spacer"></span><button class="p-copy" id="copyRgb">复制</button></div>
      <div class="p-channels">
        <div class="p-channel"><span class="p-channel-tag">R</span><input type="range" class="p-range" id="rRange" min="0" max="255" value="0"><input type="number" id="rNum" min="0" max="255" value="0"></div>
        <div class="p-channel"><span class="p-channel-tag">G</span><input type="range" class="p-range" id="gRange" min="0" max="255" value="0"><input type="number" id="gNum" min="0" max="255" value="0"></div>
        <div class="p-channel"><span class="p-channel-tag">B</span><input type="range" class="p-range" id="bRange" min="0" max="255" value="0"><input type="number" id="bNum" min="0" max="255" value="0"></div>
      </div>
    </div>

    <div class="p-section">
      <div class="p-section-label"><span>HSL</span><span class="p-spacer"></span><button class="p-copy" id="copyHsl">复制</button></div>
      <div class="p-channels">
        <div class="p-channel"><span class="p-channel-tag">H</span><input type="range" class="p-range" id="hRange" min="0" max="360" value="0"><input type="number" id="hNum" min="0" max="360" value="0"></div>
        <div class="p-channel"><span class="p-channel-tag">S</span><input type="range" class="p-range" id="sRange" min="0" max="100" value="0"><input type="number" id="sNum" min="0" max="100" value="0"></div>
        <div class="p-channel"><span class="p-channel-tag">L</span><input type="range" class="p-range" id="lRange" min="0" max="100" value="0"><input type="number" id="lNum" min="0" max="100" value="0"></div>
      </div>
    </div>
  </div>
</div>

<div class="cc-banner" id="pickBanner">
  <span>取色中 — 把鼠标停在目标颜色上，按 F8 取色 · ESC 取消</span>
  <button class="cc-cancel" id="pickCancel">取消</button>
</div>

<script>
// ==================== 页面 i18n（自包含样板，同 pdf-toolkit） ====================
var L10N = {
  'en-US': {
    '颜色工具': 'Color Tools',
    '拾色器': 'Picker',
    '拖动选取任意颜色，下方三栏实时同步': 'Drag to pick any color; all three formats below sync in real time',
    '屏幕取色': 'Screen Picker',
    '进入取色模式后按 F8 取色，HEX 自动复制': 'Enter pick mode, press F8 to grab; HEX copies automatically',
    '取色中 — 把鼠标停在目标颜色上，按 F8 取色 · ESC 取消': 'Picking — rest the cursor on the target color and press F8 · ESC to cancel',
    '取消': 'Cancel',
    '已取消': 'Cancelled',
    '启动取色失败': 'Failed to start picking',
    ' · 已复制到剪贴板': ' · Copied to clipboard',
    '取色失败': 'Pick failed',
    '已取色 ': 'Picked ',
    '复制': 'Copy',
    '色名: ': 'Name: ',
    '已复制 ': 'Copied ',
    '复制失败': 'Copy failed'
  }
};
function isEn() {
  var l = document.documentElement.getAttribute('lang') || '';
  return l.indexOf('en') === 0;
}
function L(key) {
  if (!isEn()) return key;
  var map = L10N['en-US'] || {};
  return map[key] !== undefined ? map[key] : key;
}
// 静态文本应用：data-orig 缓存原文防重复翻译
function applyStaticL10n() {
  document.querySelectorAll('.p-head-title, .p-label, .p-muted, .p-copy, .cc-btn, .cc-banner span, .cc-cancel').forEach(function (el) {
    var src = el.getAttribute('data-orig');
    if (!src) { src = el.textContent.trim(); el.setAttribute('data-orig', src); }
    if (src) el.textContent = L(src);
  });
}
// 宿主切语言 → 更新 lang + 重渲染静态文本
window.addEventListener('message', function (e) {
  var d = e.data;
  if (d && d.type === 'plugin:theme' && d.data && d.data.locale) {
    document.documentElement.setAttribute('lang', d.data.locale);
    applyStaticL10n();
  }
});
applyStaticL10n();

// ---- 颜色名 → HEX（与后端 main.js 保持一致）----
var NAMED_COLORS = {
  red:'#ff0000', green:'#008000', blue:'#0000ff', black:'#000000', white:'#ffffff',
  gray:'#808080', grey:'#808080', yellow:'#ffff00', orange:'#ffa500', purple:'#800080',
  pink:'#ffc0cb', cyan:'#00ffff', magenta:'#ff00ff', brown:'#a52a2a', lime:'#00ff00',
  teal:'#008080', navy:'#000080', silver:'#c0c0c0', gold:'#ffd700', indigo:'#4b0082',
  violet:'#ee82ee', coral:'#ff7f50', crimson:'#dc143c', salmon:'#fa8072', turquoise:'#40e0d0',
  beige:'#f5f5dc', khaki:'#f0e68c', olive:'#808000'
}
var HEX_TO_NAME = {}
for (var nk in NAMED_COLORS) { HEX_TO_NAME[NAMED_COLORS[nk].toLowerCase()] = nk }

var $ = function (id) { return document.getElementById(id) }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)) }

// ---- 转换 ----
function hexToRgb(hex) {
  hex = hex.replace('#', '')
  if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c }).join('')
  if (hex.length !== 6) return null
  var n = parseInt(hex, 16)
  if (isNaN(n)) return null
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }
}
function rgbToHex(r, g, b) {
  function p(v) { var s = clamp(Math.round(v), 0, 255).toString(16); return s.length === 1 ? '0' + s : s }
  return '#' + p(r) + p(g) + p(b)
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255
  var max = Math.max(r, g, b), min = Math.min(r, g, b)
  var h = 0, s = 0, l = (max + min) / 2
  if (max !== min) {
    var d = max - min
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0)
    else if (max === g) h = (b - r) / d + 2
    else h = (r - g) / d + 4
    h *= 60
  }
  return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) }
}
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360
  s = clamp(s, 0, 100) / 100
  l = clamp(l, 0, 100) / 100
  function f(n) {
    var k = (n + h / 30) % 12
    var a = s * Math.min(l, 1 - l)
    return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)))
  }
  return { r: Math.round(f(0) * 255), g: Math.round(f(8) * 255), b: Math.round(f(4) * 255) }
}

// ---- 状态源：以 RGB 为唯一真值，其它格式由它派生 ----
var state = { r: 0, g: 0, b: 0 }

function render() {
  var hex = rgbToHex(state.r, state.g, state.b)
  var hsl = rgbToHsl(state.r, state.g, state.b)

  // 预览
  $('swatch').style.background = hex
  $('hexLabel').textContent = hex.toUpperCase()
  $('nameLabel').textContent = HEX_TO_NAME[hex.toLowerCase()] ? (L('色名: ') + HEX_TO_NAME[hex.toLowerCase()]) : '—'
  $('nativeColor').value = hex

  // HEX 输入
  if (document.activeElement !== $('hexInput')) $('hexInput').value = hex.toUpperCase()

  // RGB 控件
  if (document.activeElement !== $('rRange')) $('rRange').value = state.r
  if (document.activeElement !== $('rNum')) $('rNum').value = state.r
  if (document.activeElement !== $('gRange')) $('gRange').value = state.g
  if (document.activeElement !== $('gNum')) $('gNum').value = state.g
  if (document.activeElement !== $('bRange')) $('bRange').value = state.b
  if (document.activeElement !== $('bNum')) $('bNum').value = state.b

  // HSL 控件
  if (document.activeElement !== $('hRange')) $('hRange').value = hsl.h
  if (document.activeElement !== $('hNum')) $('hNum').value = hsl.h
  if (document.activeElement !== $('sRange')) $('sRange').value = hsl.s
  if (document.activeElement !== $('sNum')) $('sNum').value = hsl.s
  if (document.activeElement !== $('lRange')) $('lRange').value = hsl.l
  if (document.activeElement !== $('lNum')) $('lNum').value = hsl.l
}

function setFromRgb(r, g, b) {
  state.r = clamp(r, 0, 255); state.g = clamp(g, 0, 255); state.b = clamp(b, 0, 255)
  render()
}

// ---- 事件 ----
$('nativeColor').addEventListener('input', function () {
  var rgb = hexToRgb(this.value)
  if (rgb) setFromRgb(rgb.r, rgb.g, rgb.b)
})

$('hexInput').addEventListener('input', function () {
  var rgb = hexToRgb(this.value.trim())
  if (rgb) setFromRgb(rgb.r, rgb.g, rgb.b)
})

function bindChannel(rangeId, numId, key) {
  $(rangeId).addEventListener('input', function () { setFromRgb(key === 'r' ? +this.value : state.r, key === 'g' ? +this.value : state.g, key === 'b' ? +this.value : state.b) })
  $(numId).addEventListener('input', function () {
    var v = clamp(parseInt(this.value || '0', 10) || 0, 0, (key === 'h' ? 360 : 255))
    setFromRgb(key === 'r' ? v : state.r, key === 'g' ? v : state.g, key === 'b' ? v : state.b)
  })
}
bindChannel('rRange', 'rNum', 'r')
bindChannel('gRange', 'gNum', 'g')
bindChannel('bRange', 'bNum', 'b')

function bindHsl(rangeId, numId, key) {
  $(rangeId).addEventListener('input', function () { applyHsl(key, +this.value) })
  $(numId).addEventListener('input', function () { applyHsl(key, clamp(parseInt(this.value || '0', 10) || 0, 0, (key === 'h' ? 360 : 100))) })
}
function applyHsl(key, val) {
  var hsl = rgbToHsl(state.r, state.g, state.b)
  if (key === 'h') hsl.h = val
  if (key === 's') hsl.s = val
  if (key === 'l') hsl.l = val
  var rgb = hslToRgb(hsl.h, hsl.s, hsl.l)
  setFromRgb(rgb.r, rgb.g, rgb.b)
}
bindHsl('hRange', 'hNum', 'h')
bindHsl('sRange', 'sNum', 's')
bindHsl('lRange', 'lNum', 'l')

// ---- 复制（优先走宿主桥接，失败降级本地）----
function copyText(text) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'plugin:copy', id: 'color' + Date.now(), text: text }, '*')
      flash(L('已复制 ') + text)
      return
    }
  } catch (e) {}
  try { navigator.clipboard.writeText(text).then(function () { flash(L('已复制 ') + text) }) } catch (e) { alert(L('复制失败')) }
}
function flash(msg) {
  var el = $('nameLabel')
  var old = el.textContent
  el.textContent = msg
  setTimeout(function () { render() }, 1200)
}
$('copyHex').addEventListener('click', function () { copyText(rgbToHex(state.r, state.g, state.b).toUpperCase()) })
$('copyRgb').addEventListener('click', function () { copyText('rgb(' + state.r + ', ' + state.g + ', ' + state.b + ')') })
$('copyHsl').addEventListener('click', function () {
  var hsl = rgbToHsl(state.r, state.g, state.b)
  copyText('hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)')
})

// ---- 宿主传入初始值 ----
window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'plugin:init') {
    var text = e.data.data && e.data.data.text
    if (text) {
      var rgb = hexToRgb(text.trim())
      if (rgb) setFromRgb(rgb.r, rgb.g, rgb.b)
    }
  }
})

// ---- 屏幕取色：热键冻结模式（F8 取色 / ESC 取消），轮询 pick-status 回填 ----
var _seq = 0
var pickPolling = false
var pickPollTimer = null

$('pickScreen').addEventListener('click', startPick)
$('pickCancel').addEventListener('click', cancelPick)
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && pickPolling) cancelPick()
})

// 通用执行：宿主 plugin:result 回包结构为 {type, id, data | error}，
// 结果在 e.data.data（与 pdf-toolkit/disk-analyzer 一致）；README 写的 result 字段不存在
function sendExec(command, input, onOk, onErr) {
  var id = ++_seq
  var settled = false   // 回调只允许执行一次：响应与超时定时器竞态时后到者丢弃
  var timer = null
  var handler = function (e) {
    var d = e.data
    if (d && d.type === 'plugin:result' && d.id === id) {
      window.removeEventListener('message', handler)
      if (timer) { clearTimeout(timer); timer = null }  // 收到响应必须清掉超时定时器
      if (settled) return
      settled = true
      if (d.error) { onErr(d.error.message || d.error); return }
      onOk(d.data || {})
    }
  }
  window.addEventListener('message', handler)
  window.parent.postMessage({ type: 'plugin:execute', id: id, command: command, input: input }, '*')
  timer = setTimeout(function () {
    window.removeEventListener('message', handler)
    if (settled) return
    settled = true
    onErr('timeout')
  }, 5000)
}

function startPick() {
  if (pickPolling || !window.parent || window.parent === window) return
  sendExec('screen-pick-start', {}, function () {
    $('pickBanner').classList.add('on')
    $('pickScreen').disabled = true
    pickPolling = true
    pollPick()
  }, function (err) {
    flash(L('启动取色失败'))
  })
}

function pollPick() {
  pickPollTimer = setInterval(function () {
    sendExec('pick-status', {}, function (res) {
      var st = res && res.status
      if (st === 'done') {
        endPick()
        setFromRgb(res.r, res.g, res.b)
        flash(L('已取色 ') + String(res.hex || '').toUpperCase() + (res.copied ? L(' · 已复制到剪贴板') : ''))
      } else if (st === 'cancelled') {
        endPick()
        flash(L('已取消'))
      } else if (st === 'error') {
        endPick()
        flash(String(res.errMsg || L('取色失败')))
      }
      // running → 继续轮询
    }, function () {
      endPick()
      flash(L('取色失败'))
    })
  }, 300)
}

function endPick() {
  clearInterval(pickPollTimer)
  pickPollTimer = null
  pickPolling = false
  $('pickBanner').classList.remove('on')
  $('pickScreen').disabled = false
}

function cancelPick() {
  sendExec('screen-pick-cancel', {}, function () {
    endPick()
    flash(L('已取消'))
  }, function () { endPick() })
}

render()
</script>
</body>
</html>

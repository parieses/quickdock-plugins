<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑白棋</title>
<link rel="stylesheet" href="qd-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="g-app">
  <div class="g-head">
    <div class="g-title">黑白棋</div>
    <div class="g-scores">
      <div class="g-score g-you"><span>你（黑）</span><b id="you">2</b></div>
      <div class="g-score g-ai"><span>电脑（白）</span><b id="ai">2</b></div>
    </div>
  </div>
  <div class="g-bar">
    <select class="p-sel" id="difficulty" title="难度">
      <option value="2">简单</option>
      <option value="4" selected>普通</option>
      <option value="6">困难</option>
    </select>
    <span class="g-status" id="status">轮到你落子</span>
    <button class="p-btn p-btn-primary" id="new" type="button">新对局</button>
  </div>
  <div class="g-board">
    <div class="g-grid" id="grid"></div>
    <div class="g-over" id="over" hidden>
      <div class="g-over-text" id="overText">游戏结束</div>
      <button class="p-btn p-btn-primary" id="retry" type="button">再来一局</button>
    </div>
  </div>
  <div class="g-foot" id="best">最佳：—</div>
</div>
<script src="app.js"></script>
</body>
</html>

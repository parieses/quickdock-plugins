<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>二维码工具</title>
<link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">
<style>
/* ===== 二维码页专属（其余复用 common.css） ===== */
.p-actions{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.p-qr-box{display:flex;justify-content:center;align-items:center;min-height:220px;padding:var(--sp-4);background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg)}
.p-qr-box svg{image-rendering:pixelated}
.p-img-preview{max-width:180px;max-height:180px;border-radius:var(--radius);border:1px solid var(--border)}
</style>

<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
</script>
<script>
/* QuickDock sandbox 剪贴板桥接：iframe 内 navigator.clipboard 被 Permissions-Policy 禁用 */
window.__cpSeq=0;
window.execCopyFallback=function(t){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';a.style.top='0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');document.body.removeChild(a);return ok}catch(e){return false}};
window.copyViaHost=function(t,cb){var id='cp_'+(++window.__cpSeq),done=false;function onMsg(e){var d=e&&e.data;if(d&&d.type==='plugin:copy-result'&&d.id===id){done=true;window.removeEventListener('message',onMsg);cb&&cb(!!d.ok)}}window.addEventListener('message',onMsg);parent.postMessage({type:'plugin:copy',id:id,text:t},'*');setTimeout(function(){if(!done){window.removeEventListener('message',onMsg);cb&&cb(window.execCopyFallback(t))}},300)};
</script>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></symbol><symbol id="icon-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></symbol><symbol id="icon-git-branch" viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></symbol><symbol id="icon-trash-2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></symbol><symbol id="icon-shield-alert" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></symbol><symbol id="icon-hard-drive" viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12"></line><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></symbol><symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></symbol><symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></symbol><symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></symbol><symbol id="icon-gauge" viewBox="0 0 24 24"><path d="M12 15l-2-2"></path><path d="M19.07 4.93a10 10 0 1 1-14.14 0"></path><path d="M12 2v4"></path></symbol><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>

<body>
<div class="p-app">
  <div class="p-head">
    <span class="p-head-title">二维码工具</span>
  </div>

  <div class="p-tabs">
    <button class="p-tab active" id="tabGen">生成</button>
    <button class="p-tab" id="tabScan">识别</button>
  </div>

  <div class="p-content" id="genPane">
    <div class="p-field">
      <input type="text" class="input" id="qrText" placeholder="输入文本或 URL，如 https://github.com/parieses/quickdock" spellcheck="false">
    </div>
    <div class="p-actions">
      <button class="btn p-btn-primary" id="btnGen">生成二维码</button>
      <button class="btn" id="btnSave" disabled>保存 PNG</button>
      <span class="p-muted">支持 URL / 文本 / 联系人信息，最大 512 字符</span>
    </div>
    <div class="p-hero" style="justify-content:center;min-height:240px">
      <div class="p-qr-box" id="qrBox"><span class="p-muted">输入内容后点击生成</span></div>
    </div>
  </div>

  <div class="p-content" id="scanPane" style="display:none">
    <div class="p-field">
      <button class="btn p-btn-primary" id="btnScanPick">选择图片</button>
      <span class="p-muted">选择包含二维码的图片（PNG/JPG/WebP）</span>
    </div>
    <div class="p-actions">
      <img id="scanPreview" class="p-img-preview" style="display:none" alt="">
      <span id="scanLoading" style="display:none" class="p-muted">识别中…</span>
    </div>
    <div class="p-section">
      <div class="p-section-label"><span>识别结果</span><span class="p-spacer"></span><button class="p-copy" id="btnCopy" disabled>复制</button><button class="btn p-btn-sm" id="btnOpenResult" disabled>打开链接</button></div>
      <pre class="p-output" id="scanResult" style="margin:0">识别结果将显示在这里</pre>
    </div>
  </div>
</div>

<script src="qrcode.min.js"></script>
<script src="jsqr.js"></script>
<script>
var $ = function (id) { return document.getElementById(id) }
var qrInstance = null

// ---- 生成 ----
function genQR() {
  var text = $('qrText').value.trim()
  if (!text) { alert('请输入要生成二维码的内容'); return }
  if (text.length > 512) { alert('内容过长（最多 512 字符）'); return }
  var box = $('qrBox')
  box.innerHTML = ''
  try {
    qrInstance = new QRCode(box, { text: text, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M })
    $('btnSave').disabled = false
  } catch (e) { box.innerHTML = '<span class="p-muted">生成失败: ' + e.message + '</span>' }
}

function savePNG() {
  var svg = $('qrBox').querySelector('svg')
  if (!svg) return
  var xml = new XMLSerializer().serializeToString(svg)
  var svg64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)))
  var img = new Image()
  img.onload = function () {
    var canvas = document.createElement('canvas')
    canvas.width = img.width * 3; canvas.height = img.height * 3
    var ctx = canvas.getContext('2d')
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height)
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height)
    var a = document.createElement('a')
    a.download = 'qrcode.png'
    a.href = canvas.toDataURL('image/png')
    a.click()
  }
  img.src = svg64
}

// ---- 识别 ----
function scanFromDataURL(dataUrl) {
  if (!dataUrl) return
  var img = $('scanPreview')
  img.src = dataUrl
  img.style.display = 'block'
  $('scanLoading').style.display = 'block'
  $('scanResult').textContent = '识别中…'
  $('btnCopy').disabled = true; $('btnOpenResult').disabled = true
  img.onload = function () {
    try {
      var canvas = document.createElement('canvas')
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight
      var ctx = canvas.getContext('2d')
      ctx.drawImage(img, 0, 0)
      var data = ctx.getImageData(0, 0, canvas.width, canvas.height)
      var code = jsQR(data.data, data.width, data.height)
      if (code && code.data) {
        $('scanResult').textContent = code.data
        $('btnCopy').disabled = false
        if (/^https?:\/\//i.test(code.data)) $('btnOpenResult').disabled = false
      } else {
        $('scanResult').textContent = '未识别到二维码，请换一张清晰的图片试试'
      }
    } catch (err) {
      $('scanResult').textContent = '识别失败: ' + err.message
    } finally {
      $('scanLoading').style.display = 'none'
    }
  }
}

function copyResult() {
  var text = $('scanResult').textContent
  if (!text || text.indexOf('未识别') >= 0 || text.indexOf('识别中') >= 0) return
  // 统一走宿主 plugin:copy 桥接（sandbox iframe 禁 navigator.clipboard），超时自动降级 execCommand
  window.copyViaHost(text, function (ok) { alert(ok ? '已复制到剪贴板' : '复制失败') })
}

function openResult() {
  var text = $('scanResult').textContent
  if (!/^https?:\/\//i.test(text)) return
  window.parent.postMessage({ type: 'plugin:execute', id: 'qr-open', command: 'open-url', input: { text: text } }, '*')
}

// ---- 事件 ----
$('tabGen').addEventListener('click', function () { $('tabGen').classList.add('active'); $('tabScan').classList.remove('active'); $('genPane').style.display = 'flex'; $('scanPane').style.display = 'none' })
$('tabScan').addEventListener('click', function () { $('tabScan').classList.add('active'); $('tabGen').classList.remove('active'); $('genPane').style.display = 'none'; $('scanPane').style.display = 'flex' })
$('btnGen').addEventListener('click', genQR)
$('btnSave').addEventListener('click', savePNG)
$('qrText').addEventListener('keydown', function (e) { if (e.key === 'Enter') genQR() })
$('btnScanPick').addEventListener('click', function () {
  if (!window.qdPickFile || !window.qdReadFile) { $('scanResult').textContent = '当前宿主不支持原生选文件'; return }
  $('scanLoading').style.display = 'block'; $('scanResult').textContent = '读取中…'
  $('btnCopy').disabled = true; $('btnOpenResult').disabled = true
  window.qdPickFile({ title: '选择二维码图片', filter: '图片', pattern: '*.png;*.jpg;*.jpeg;*.gif;*.webp;*.bmp' }).then(function (path) {
    if (!path) { $('scanLoading').style.display = 'none'; return }
    window.qdReadFile(path).then(function (res) {
      if (!res || res.error || res.type !== 'dataurl') {
        $('scanLoading').style.display = 'none'
        $('scanResult').textContent = '读取失败，请选择图片文件'
        $('scanPreview').style.display = 'none'
        return
      }
      scanFromDataURL(res.content)
    }, function () { $('scanLoading').style.display = 'none'; $('scanResult').textContent = '读取失败' })
  })
})
$('btnCopy').addEventListener('click', copyResult)
$('btnOpenResult').addEventListener('click', openResult)

window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'plugin:init') {
    var text = e.data.data && e.data.data.text
    if (text) { $('qrText').value = text; genQR() }
  }
})
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生重开模拟器</title>
<link rel="stylesheet" href="qd-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="lr-app">
  <div class="lr-screen" id="setup">
    <div class="lr-title">🎲 人生重开模拟器</div>
    <div class="lr-sub">选天赋、分属性，重开一段随机人生</div>
    <div class="lr-label">天赋（最多 3 个）</div>
    <div class="lr-talents" id="talents"></div>
    <div class="lr-label">初始属性 <span class="lr-pool" id="pool">剩余 0</span></div>
    <div class="lr-attrs" id="attrs"></div>
    <button class="p-btn p-btn-primary lr-start" id="start" type="button">开始人生 →</button>
  </div>

  <div class="lr-screen" id="play" hidden>
    <div class="lr-top">
      <div class="lr-age">年龄 <b id="age">0</b></div>
      <div class="lr-bars">
        <span>💗<b id="hp">100</b></span>
        <span>💰<b id="money">0</b></span>
        <span>😊<b id="happy">60</b></span>
      </div>
      <button class="p-btn p-btn-ghost" id="restart" type="button">重开</button>
    </div>
    <div class="lr-log" id="log"></div>
    <button class="p-btn p-btn-primary lr-next" id="next" type="button">继续 ›</button>
  </div>

  <div class="lr-screen lr-end" id="end" hidden>
    <div class="lr-end-title" id="endTitle"></div>
    <div class="lr-end-sum" id="endSum"></div>
    <button class="p-btn p-btn-primary" id="again" type="button">再来一次</button>
  </div>
</div>
<script src="app.js"></script>

<!-- 跟随宿主浅色/深色主题 -->
  <script>
  /* qd-theme-follow：把宿主的浅色/深色同步到 <html data-theme>
     （qd-theme.css 里浅色是 html[data-theme="light"] 的变量覆盖）。
     三级取值，任意一级拿到就生效，互为兜底：
       1) 宿主消息 plugin:theme / plugin:init（宿主若补上独立窗口的广播即走这条）
       2) 同源 opener / parent 窗口的 <html data-theme>，并监听其变化、窗口 focus 时重读
       3) 系统偏好 prefers-color-scheme（宿主主题=「跟随系统」时有效）
     独立注册，不改动页面原有逻辑。 */
  (function () {
    var el = document.documentElement;
    function set(t) { if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); }
    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || !d.type) return;
      if (d.type === 'plugin:theme' || d.type === 'plugin:init') { if (d.data && d.data.theme) set(d.data.theme); }
    });
    /* 2) 同源窗口 */
    var w = null;
    try {
      if (window.opener && window.opener !== window) w = window.opener;
      else if (window.parent && window.parent !== window) w = window.parent;
    } catch (err) { w = null; }
    function fromWin() {
      try { var t = w.document.documentElement.getAttribute('data-theme'); if (t) { set(t); return true; } return false; }
      catch (err) { return false; }
    }
    if (w && fromWin()) {
      try {
        new MutationObserver(fromWin).observe(w.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      } catch (err) {}
      window.addEventListener('focus', fromWin);
    }
    /* 3) 系统偏好兜底：仅在还没拿到明确主题时生效 */
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var sys = function () { if (!el.getAttribute('data-theme')) set(mq.matches ? 'light' : 'dark'); };
      sys();
      if (mq.addEventListener) mq.addEventListener('change', sys);
    }
  })();
  </script>
</body>
</html>

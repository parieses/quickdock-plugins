<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包版本速查</title>
<link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">

<link rel="stylesheet" href="icons.css">
<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
</script>
<script>
/* QuickDock sandbox 剪贴板桥接：iframe 内 navigator.clipboard 被 Permissions-Policy 禁用 */
window.__cpSeq=0;
window.execCopyFallback=function(t){try{var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";a.style.top="0";document.body.appendChild(a);a.select();var ok=document.execCommand("copy");document.body.removeChild(a);return ok}catch(e){return false}};
window.copyViaHost=function(t,cb){var id="cp_"+(++window.__cpSeq),done=false;function onMsg(e){var d=e&&e.data;if(d&&d.type==="plugin:copy-result"&&d.id===id){done=true;window.removeEventListener("message",onMsg);cb&&cb(!!d.ok)}}window.addEventListener("message",onMsg);parent.postMessage({type:"plugin:copy",id:id,text:t},"*");setTimeout(function(){if(!done){window.removeEventListener("message",onMsg);cb&&cb(window.execCopyFallback(t))}},300)};
</script>
<style>
.pc-app{display:flex;flex-direction:column;height:100%;padding:var(--sp-4);gap:var(--sp-3);box-sizing:border-box}
.pc-row{display:flex;gap:var(--sp-2)}
.pc-input{flex:1;padding:9px 12px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-size: var(--fs-md);outline:none}
.pc-input:focus-visible{border-color:var(--accent,#4a9eff)}
.pc-btn{padding:9px 16px;background:var(--accent,#4a9eff);color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer;font-size: var(--fs-md);font-weight:600}
.pc-btn:disabled{opacity:.5;cursor:not-allowed}
.pc-hint{font-size: var(--fs-sm);color:var(--text-muted)}
.pc-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);overflow-y:auto}
.pc-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-3);display:flex;flex-direction:column;gap:6px}
.pc-card-head{display:flex;align-items:center;justify-content:space-between}
.pc-name{font-weight:700;font-size: var(--fs-lg)}
.pc-badge{font-size: var(--fs-xs);padding:2px 8px;border-radius:var(--radius-pill);font-weight:600}
.b-found{background:var(--success-soft,#1c2b24);color:var(--success,#34d399)}
.b-missing{background:var(--danger-soft,#2b1c1c);color:var(--danger,#e24b4a)}
.pc-ver{font-family:ui-monospace,Consolas,monospace;font-size: var(--fs-lg);color:var(--accent,#4a9eff);font-weight:700}
.pc-desc{font-size: var(--fs-sm);color:var(--text-secondary);line-height:1.5}
.pc-meta{font-size: var(--fs-xs);color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap}
.pc-copy{font-size: var(--fs-xs);color:var(--accent,#4a9eff);cursor:pointer;background:none;border:none;padding:0}
.pc-copy:hover{text-decoration:underline}
@media(max-width:520px){.pc-cards{grid-template-columns:1fr}}
.pc-tabs{display:flex;gap:4px;margin-bottom:2px}
.pc-tab{height:30px;padding:0 16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-tertiary);color:var(--text-primary);font-size: var(--fs-md);cursor:pointer;font-family:inherit}
.pc-tab.active{background:var(--accent,#4a9eff);color:#fff;border-color:var(--accent,#4a9eff)}
.pc-pane{display:flex;flex-direction:column;gap:var(--sp-3)}
.pc-pane[hidden]{display:none}
.pc-select{height:36px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size: var(--fs-md);outline:none;cursor:pointer}
.pc-select:focus-visible{border-color:var(--accent,#4a9eff)}
.pc-vuln-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.pc-vuln{border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;background:var(--bg-secondary);display:flex;flex-direction:column;gap:6px}
.pc-vuln-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-vuln-id{font-family:ui-monospace,Consolas,monospace;font-size: var(--fs-md);font-weight:700;color:var(--text-primary)}
.pc-sev{font-size: var(--fs-xs);padding:1px 7px;border-radius:var(--radius-pill);font-weight:700;text-transform:uppercase}
.sev-unknown{background:var(--bg-tertiary);color:var(--text-muted)}
.sev-low{background:#1c2b24;color:#34d399}
.sev-moderate,.sev-medium{background:#2b2716;color:#e0a84b}
.sev-high{background:#2b1c16;color:#e2774b}
.sev-critical{background:#2b1212;color:#e24b4b}
.pc-vuln-sum{font-size: var(--fs-md);color:var(--text-secondary);line-height:1.5}
.pc-vuln-meta{font-size: var(--fs-xs);color:var(--text-muted);display:flex;gap:12px;flex-wrap:wrap}
.pc-vuln-link{font-size: var(--fs-xs);color:var(--accent,#4a9eff);text-decoration:none}
.pc-vuln-link:hover{text-decoration:underline}
.pc-vuln-empty{color:var(--text-muted);font-size: var(--fs-md);padding:12px 0}
</style>
</head>
<body>
<div class="pc-app">
  <div class="pc-tabs">
    <button class="pc-tab active" id="tabVer"><span class="qi qi-package"></span> 版本速查</button>
    <button class="pc-tab" id="tabVuln"><span class="qi qi-shield-check"></span> 漏洞速查</button>
  </div>
  <div id="paneVer" class="pc-pane">
  <div class="pc-row">
    <input id="pkgInput" class="pc-input" placeholder="输入包名，如 express / requests / monolog/monolog / github.com/gin-gonic/gin" spellcheck="false" autofocus>
    <button id="btnQuery" class="pc-btn">查询</button>
  </div>
  <div id="hint" class="pc-hint">同时查询 npm / PyPI / Composer / Go 四个仓库（Composer 需 vendor/package 形式）</div>
  <div id="cards" class="pc-cards"></div>
  </div>

  <div id="paneVuln" class="pc-pane" hidden>
    <div class="pc-row">
      <select id="vulnEco" class="pc-select">
        <option value="npm">npm</option>
        <option value="pypi">PyPI</option>
        <option value="composer">Composer</option>
        <option value="go">Go</option>
      </select>
      <input id="vulnName" class="pc-input" placeholder="包名，如 express / requests / monolog/monolog / github.com/gin-gonic/gin" spellcheck="false">
      <input id="vulnVer" class="pc-input" placeholder="版本(可选) 如 1.2.3" spellcheck="false" style="max-width:150px">
      <button id="btnVuln" class="pc-btn">查询</button>
    </div>
    <div id="vulnHint" class="pc-hint">基于 OSV.dev 查询已知漏洞（CVE / 安全公告）；不填版本则返回该包全部已知漏洞</div>
    <div id="vulnList" class="pc-vuln-list"></div>
  </div>
</div>
<script>
(function(){
  'use strict'
  var input=document.getElementById('pkgInput')
  var btn=document.getElementById('btnQuery')
  var hint=document.getElementById('hint')
  var cards=document.getElementById('cards')

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function fmtDownloads(n){
    if(!n)return ''
    if(n>=1e6)return (n/1e6).toFixed(1)+'M/周'
    if(n>=1e3)return (n/1e3).toFixed(1)+'k/周'
    return n+'/周'
  }
  var ORDER=[['npm','NPM'],['pypi','PyPI'],['composer','Composer'],['go','Go']]
  var lastRes={}

  function render(res){
    cards.innerHTML=''
    ORDER.forEach(function(pair){
      var kind=pair[0], label=pair[1]
      var info=res[kind]||{found:false}
      var card=document.createElement('div'); card.className='pc-card'
      var head='<div class="pc-card-head"><span class="pc-name">'+label+'</span>'+
        (info.found?'<span class="pc-badge b-found">已发布</span>':'<span class="pc-badge b-missing">未找到</span>')+
        '</div>'
      if(info.found){
        var meta=[]
        if(info.latest) meta.push('最新 <span class="pc-ver">'+esc(info.latest)+'</span>')
        if(info.license) meta.push('许可证 '+esc(info.license))
        if(kind==='npm'&&info.downloads) meta.push(fmtDownloads(info.downloads))
        if(info.modified) meta.push('更新 '+esc(String(info.modified).slice(0,10)))
        card.innerHTML=head+
          '<div class="pc-desc">'+(info.desc?esc(info.desc):'（无描述）')+'</div>'+
          '<div class="pc-meta">'+meta.join(' · ')+'</div>'+
          (info.latest?'<div><button class="pc-copy" data-ver="'+escAttr(info.latest)+'">复制版本</button></div>':'')
      }else{
        card.innerHTML=head+'<div class="pc-desc" style="color:var(--text-muted)">该仓库中未找到此包</div>'
      }
      cards.appendChild(card)
    })
    // 复制版本
    cards.querySelectorAll('.pc-copy').forEach(function(b){
      b.addEventListener('click',function(){
        window.copyViaHost(b.getAttribute('data-ver'),function(ok){
          b.textContent=ok?'✓ 已复制':'复制失败'
          setTimeout(function(){b.textContent='复制版本'},1500)
        })
      })
    })
  }

  function doQuery(){
    var name=input.value.trim()
    if(!name){ hint.textContent='请输入包名'; return }
    btn.disabled=true; btn.textContent='查询中…'
    hint.textContent='正在查询 '+name+' …'
    send('query',{name:name}).then(function(res){
      lastRes=res
      render(res)
      btn.disabled=false; btn.textContent='查询'
      var found=ORDER.filter(function(p){return res[p[0]]&&res[p[0]].found}).map(function(p){return p[1]})
      hint.textContent=found.length?'命中 '+found.join(' / '):'四个仓库均未找到该包'
    }).catch(function(err){
      hint.textContent='查询失败：'+(err&&err.message?err.message:err)
      btn.disabled=false; btn.textContent='查询'
    })
  }

  function send(command,params){
    return new Promise(function(resolve,reject){
      var id='pc_'+(++seq)
      function onMsg(e){
        var d=e&&e.data
        if(d&&d.type==='plugin:result'&&d.id===id){
          window.removeEventListener('message',onMsg)
          if(d.error)reject(new Error(d.error)); else resolve(d.data)
        }
      }
      window.addEventListener('message',onMsg)
      parent.postMessage({type:'plugin:execute',id:id,command:command,input:params},'*')
      setTimeout(function(){window.removeEventListener('message',onMsg);reject(new Error('请求超时：后端 30 秒无响应'))},30000)
    })
  }
  var seq=0

  btn.addEventListener('click',doQuery)
  input.addEventListener('keydown',function(e){ if(e.key==='Enter')doQuery() })

  function escAttr(s){return esc(s).replace(/'/g,'&#39;')}

  // 命令面板传入包名自动查询
  window.addEventListener('message',function(e){
    var d=e.data
    if(d&&d.type==='plugin:init'&&d.data&&d.data.text){
      var cmd=d.data.command
      if(cmd&&cmd!=='query')return
      var t=d.data.text.trim()
      if(t){ input.value=t; doQuery() }
    }
  })
})()
</script>
<!-- 漏洞速查（新增 tab，依赖 OSV.dev） -->
<script>
(function(){
  'use strict'
  var tabVer=document.getElementById('tabVer'),tabVuln=document.getElementById('tabVuln')
  var paneVer=document.getElementById('paneVer'),paneVuln=document.getElementById('paneVuln')
  function showVulnTab(which){
    var onVer=(which!=='vuln')
    tabVer.classList.toggle('active',onVer); tabVuln.classList.toggle('active',!onVer)
    paneVer.hidden=!onVer; paneVuln.hidden=onVer
  }
  tabVer.addEventListener('click',function(){showVulnTab('ver')})
  tabVuln.addEventListener('click',function(){showVulnTab('vuln')})

  var eco=document.getElementById('vulnEco'),nameI=document.getElementById('vulnName')
  var verI=document.getElementById('vulnVer'),btn=document.getElementById('btnVuln')
  var hint=document.getElementById('vulnHint'),list=document.getElementById('vulnList')
  var seq=0
  function send(command,params){
    return new Promise(function(resolve,reject){
      var id='vl_'+(++seq)
      function onMsg(e){var d=e&&e.data;if(d&&d.type==='plugin:result'&&d.id===id){window.removeEventListener('message',onMsg);if(d.error)reject(new Error(d.error));else resolve(d.data)}}
      window.addEventListener('message',onMsg)
      parent.postMessage({type:'plugin:execute',id:id,command:command,input:params},'*')
    })
  }
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function sevClass(s){s=String(s||'').toLowerCase();if(s.indexOf('critical')>=0)return 'sev-critical';if(s.indexOf('high')>=0)return 'sev-high';if(s.indexOf('moderate')>=0||s.indexOf('medium')>=0)return 'sev-moderate';if(s.indexOf('low')>=0)return 'sev-low';return 'sev-unknown'}
  function doVuln(){
    var name=nameI.value.trim(),kind=eco.value,ver=verI.value.trim()
    if(!name){hint.textContent='请输入包名';return}
    btn.disabled=true;btn.textContent='查询中…'
    hint.textContent='正在查询 '+name+(ver?(' @ '+ver):'')+' 的漏洞…'
    send('vuln-query',{ecosystem:kind,name:name,version:ver}).then(function(res){
      btn.disabled=false;btn.textContent='查询'
      if(res&&res.error){hint.textContent='查询失败：'+res.error;list.innerHTML='';return}
      renderVuln(res)
    }).catch(function(err){btn.disabled=false;btn.textContent='查询';hint.textContent='查询失败：'+(err&&err.message?err.message:err)})
  }
  function renderVuln(res){
    var n=res.count||0
    if(!n){hint.textContent=(res.name||'')+' 在 '+res.ecosystem+(res.version?(' @ '+res.version):'')+' 未收录已知漏洞 ✅';list.innerHTML='<div class="pc-vuln-empty"><span class="qi qi-flag"></span> 未查询到已知漏洞</div>';return}
    hint.textContent=res.name+(res.version?(' @ '+res.version):'')+'：共 '+n+' 条已知漏洞'
    var html=''
    ;(res.vulns||[]).forEach(function(v){
      var aliases=(v.aliases||[]).filter(function(a){return a!==v.id}).join(', ')
      html+='<div class="pc-vuln">'+
        '<div class="pc-vuln-head"><span class="pc-vuln-id">'+esc(v.id)+'</span>'+
        '<span class="pc-sev '+sevClass(v.severity)+'">'+(v.severity?esc(v.severity):'未知')+'</span></div>'+
        (v.summary?'<div class="pc-vuln-sum">'+esc(v.summary)+'</div>':'')+
        '<div class="pc-vuln-meta">'+
          (v.published?('<span>发布 '+esc(String(v.published).slice(0,10))+'</span>'):'')+
          (aliases?'<span>别名: '+esc(aliases)+'</span>':'')+
        '</div>'+
        (v.url?'<a class="pc-vuln-link" href="'+esc(v.url)+'" target="_blank" rel="noopener">查看详情 ↗</a>':'')+
      '</div>'
    })
    list.innerHTML=html
  }
  btn.addEventListener('click',doVuln)
  nameI.addEventListener('keydown',function(e){if(e.key==='Enter')doVuln()})
  verI.addEventListener('keydown',function(e){if(e.key==='Enter')doVuln()})
  window.addEventListener('message',function(e){
    var d=e.data
    if(d&&d.type==='plugin:init'&&d.data&&d.data.command==='vuln-query'){
      showVulnTab('vuln')
      if(d.data.text){nameI.value=d.data.text.trim();doVuln()}
    }
  })
})()
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTTP 安全头审计</title>
<link rel="stylesheet" href="qd-theme.css">
<style>
.app{display:flex;flex-direction:column;height:100%;padding:var(--sp-4);gap:var(--sp-3);box-sizing:border-box}
.row{display:flex;gap:var(--sp-2);align-items:center}
.input{flex:1;height:32px;padding:0 10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:var(--fs-sm);outline:none;font-family:var(--font-mono)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.select{height:32px;padding:0 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:var(--fs-sm);outline:none}
.hint{font-size:var(--fs-sm);color:var(--text-muted);min-height:16px}
.hint.err{color:var(--danger)}
.result{display:flex;gap:var(--sp-4);align-items:stretch}
.gauge{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-3)}
.score{font-size:44px;font-weight:800;font-family:var(--font-mono);line-height:1}
.grade{font-size:22px;font-weight:800;margin-top:4px}
.gsub{font-size:11px;color:var(--text-muted);margin-top:6px;text-align:center}
.detail{flex:1;display:flex;flex-direction:column;gap:var(--sp-3);overflow:auto}
.meta{display:flex;flex-wrap:wrap;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--text-secondary)}
.meta b{color:var(--text-primary);font-family:var(--font-mono)}
.sec{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.sec-h{padding:8px 12px;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.finding{display:flex;gap:var(--sp-2);padding:8px 12px;border-bottom:1px solid var(--border);align-items:flex-start}
.finding:last-child{border-bottom:none}
.fd{width:6px;align-self:stretch;border-radius:var(--radius-pill);flex:0 0 6px}
.fd.pass{background:var(--success)} .fd.warn{background:var(--warning)} .fd.fail{background:var(--danger)} .fd.info{background:var(--text-muted)}
.ft{flex:1}
.ft-t{font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--text-primary)}
.ft-m{font-size:var(--fs-xs);color:var(--text-secondary);margin-top:2px;line-height:1.5}
.ft-a{font-size:var(--fs-xs);color:var(--accent);margin-top:3px}
.htab{width:100%;border-collapse:collapse;font-size:var(--fs-xs);font-family:var(--font-mono)}
.htab td{padding:5px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.htab td:first-child{color:var(--text-muted);white-space:nowrap;width:34%}
.htab td:last-child{color:var(--text-primary);word-break:break-all}
</style>
</head>
<body>
<div class="app">
  <div class="row">
    <input id="url" class="input" placeholder="目标 URL，如 https://example.com" spellcheck="false" autofocus>
    <select id="method" class="select"><option>GET</option><option>HEAD</option><option>POST</option></select>
    <button id="btnGo" class="p-btn p-btn-primary">审计</button>
  </div>
  <div id="hint" class="hint"></div>

  <div id="result" style="display:none;flex:1;min-height:0">
    <div class="result">
      <div class="gauge">
        <div class="score" id="score">0</div>
        <div class="grade" id="grade">F</div>
        <div class="gsub" id="gsub">安全评分</div>
      </div>
      <div class="detail">
        <div class="meta" id="meta"></div>
        <div class="sec">
          <div class="sec-h">安全评估结果</div>
          <div id="findings"></div>
        </div>
        <div class="sec">
          <div class="sec-h">响应头</div>
          <table class="htab" id="headers"></table>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict'
  var seq=0, pend={}
  function send(command, input){
    return new Promise(function(res, rej){
      var id='ha_'+(++seq); pend[id]={res:res,rej:rej}
      parent.postMessage({type:'plugin:execute',id:id,command:command,input:input||{}},'*')
    })
  }
  window.addEventListener('message',function(e){
    var d=e.data; if(!d) return
    if(d.type==='plugin:result'&&d.id&&pend[d.id]){var p=pend[d.id];delete pend[d.id];if(d.error)p.rej(new Error(d.error));else p.res(d.data);return}
    if(d.type==='plugin:theme'){var dd=d.data||{};if(dd.locale)document.documentElement.setAttribute('lang',dd.locale)}
  })
  var el=function(i){return document.getElementById(i)}
  var gradeColor={A:'var(--success)',B:'var(--accent)',C:'var(--warning)',D:'#e08a30',F:'var(--danger)'}
  function audit(){
    var url=el('url').value.trim()
    if(!url){el('hint').className='hint err';el('hint').textContent='请输入目标 URL';return}
    el('hint').className='hint';el('hint').textContent='正在请求并分析…'
    el('result').style.display='none'
    send('audit',{url:url, method:el('method').value}).then(function(r){
      if(!r.ok){ el('hint').className='hint err'; el('hint').textContent='请求失败：'+(r.error||'未知错误'); return }
      el('hint').className='hint'
      el('hint').textContent=r.finalUrl!==r.url?('已跟随重定向 → '+r.finalUrl):('状态码 '+r.statusCode)
      el('score').textContent=r.score
      el('grade').textContent=r.grade
      el('score').style.color=gradeColor[r.grade]||'var(--text-primary)'
      el('grade').style.color=gradeColor[r.grade]||'var(--text-primary)'
      el('meta').innerHTML='状态码 <b>'+r.statusCode+'</b> · 传输 <b>'+r.scheme.toUpperCase()+'</b> · 重定向 <b>'+(r.redirectChain?r.redirectChain.length:0)+' 次</b> · 耗时 <b>'+(r.elapsedMs/1000).toFixed(2)+'s</b> · Cookie <b>'+(r.cookies?r.cookies.length:0)+'</b>'
      var fh=el('findings'); fh.innerHTML=''
      ;(r.findings||[]).forEach(function(f){
        var row=document.createElement('div'); row.className='finding'
        row.innerHTML='<div class="fd '+f.status+'"></div><div class="ft"><div class="ft-t">'+esc(f.title)+' <span style="color:var(--text-muted);font-weight:400">· '+stext(f.status)+'</span></div><div class="ft-m">'+esc(f.message)+'</div>'+(f.advice?'<div class="ft-a">建议：'+esc(f.advice)+'</div>':'')+'</div>'
        fh.appendChild(row)
      })
      var ht=el('headers'); ht.innerHTML=''
      var hs=r.headers||{}
      Object.keys(hs).sort().forEach(function(k){
        var tr=document.createElement('tr'); tr.innerHTML='<td>'+esc(k)+'</td><td>'+esc(hs[k])+'</td>'; ht.appendChild(tr)
      })
      if(!Object.keys(hs).length) ht.innerHTML='<tr><td colspan="2" style="color:var(--text-muted)">（无响应头）</td></tr>'
      el('result').style.display='flex'
    }).catch(function(e){ el('hint').className='hint err'; el('hint').textContent=e.message||e })
  }
  function stext(s){return s==='pass'?'通过':s==='warn'?'建议改进':s==='fail'?'缺失/风险':'信息'}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  el('btnGo').addEventListener('click',audit)
  el('url').addEventListener('keydown',function(e){if(e.key==='Enter')audit()})
})()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD 表格转换器</title>
<link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.p-app{display:flex;flex-direction:column;height:100vh}
.p-toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.cc-badge{font-size:11px;color:var(--text-muted);background:var(--bg-tertiary);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap}
.cc-sep{display:none;align-items:center;gap:4px;font-size:11.5px;color:var(--text-muted)}
.cc-sep.show{display:inline-flex}
.cc-sep select{height:26px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-primary);color:var(--text-primary);font-size:12px;outline:none}
.cc-split{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 10px;gap:8px}
.cc-pane{flex:1;display:flex;flex-direction:column;min-height:0}
.cc-label{font-size:11px;color:var(--text-muted);margin-bottom:4px}
.cc-io{flex:1;width:100%;resize:none;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-primary);color:var(--text-primary);font:12.5px/1.6 var(--font-mono);padding:10px 12px;outline:none;white-space:pre;overflow:auto}
.cc-io:focus{border-color:var(--accent)}
.cc-status{flex-shrink:0;padding:5px 10px;font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);background:var(--bg-secondary)}
.cc-status.err{color:#ef4444}
</style>
<script>
/* QuickDock sandbox 剪贴板桥接：iframe 内 navigator.clipboard 被 Permissions-Policy 禁用 */
window.__cpSeq=0;
window.execCopyFallback=function(t){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';a.style.top='0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');document.body.removeChild(a);return ok}catch(e){return false}};
window.copyViaHost=function(t,cb){var id='cp_'+(++window.__cpSeq),done=false;function onMsg(e){var d=e&&e.data;if(d&&d.type==='plugin:copy-result'&&d.id===id){done=true;window.removeEventListener('message',onMsg);cb&&cb(!!d.ok)}}window.addEventListener('message',onMsg);parent.postMessage({type:'plugin:copy',id:id,text:t},'*');setTimeout(function(){if(!done){window.removeEventListener('message',onMsg);cb&&cb(window.execCopyFallback(t))}},300)};
</script>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></symbol><symbol id="icon-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></symbol><symbol id="icon-git-branch" viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></symbol><symbol id="icon-trash-2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></symbol><symbol id="icon-shield-alert" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></symbol><symbol id="icon-hard-drive" viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12"></line><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></symbol><symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></symbol><symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></symbol><symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></symbol><symbol id="icon-gauge" viewBox="0 0 24 24"><path d="M12 15l-2-2"></path><path d="M19.07 4.93a10 10 0 1 1-14.14 0"></path><path d="M12 2v4"></path></symbol><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>
</head>
<body>
<div class="p-app">
  <div class="p-toolbar">
    <span class="cc-badge" id="srcBadge">输入格式：自动识别</span>
    <div class="p-tabs" id="outTabs">
      <button class="p-tab p-tab-active" data-fmt="md">Markdown</button>
      <button class="p-tab" data-fmt="csv">CSV</button>
      <button class="p-tab" data-fmt="json">JSON</button>
      <button class="p-tab" data-fmt="html">HTML</button>
    </div>
    <span class="cc-sep" id="sepWrap">分隔符
      <select id="sepSel">
        <option value=",">, 逗号</option>
        <option value=";">; 分号</option>
        <option value="\t">Tab</option>
        <option value="|">| 竖线</option>
      </select>
    </span>
    <div style="flex:1"></div>
    <button class="p-tab" id="copyBtn" onclick="copyOut()">📋 复制</button>
  </div>
  <div class="cc-split">
    <div class="cc-pane">
      <div class="cc-label">粘贴 Markdown / CSV / JSON / HTML 表格，自动识别</div>
      <textarea id="in" class="cc-io" spellcheck="false" placeholder="| 名称 | 数量 |
| --- | --- |
| 苹果 | 3 |
| 香蕉 | 5 |

也支持直接粘 CSV、JSON 数组或 &lt;table&gt; HTML"></textarea>
    </div>
    <div class="cc-pane">
      <div class="cc-label">输出 · Markdown</div>
      <pre id="out" class="cc-io cc-out"></pre>
    </div>
  </div>
  <div class="cc-status" id="status"></div>
</div>
<script>
// ==================== 页面 i18n ====================
var L10N = {
  'en-US': {
    '输入格式：自动识别': 'Input: auto-detect',
    '复制': 'Copy', '已复制到剪贴板': 'Copied to clipboard',
    '输出 · Markdown': 'Output · Markdown', '输出 · CSV': 'Output · CSV', '输出 · JSON': 'Output · JSON', '输出 · HTML': 'Output · HTML',
    '请先输入内容': 'Nothing to convert yet'
  }
};
function isEn(){ var l = document.documentElement.getAttribute('lang') || ''; return l.indexOf('en') === 0 }
function L(s){ return isEn() ? ((L10N['en-US'] && L10N['en-US'][s]) || s) : s }

var cur = { fmt: 'md' };
var lastOut = '', lastTable = null;
var FMT_LABEL = { md:'Markdown', csv:'CSV', json:'JSON', html:'HTML' };

function $(id){ return document.getElementById(id) }
function status(msg, err){ var el = $('status'); el.textContent = msg; el.className = 'cc-status' + (err ? ' err' : '') }
function copyOut(){
  if (!lastOut) return;
  var done = function(){ status(L('已复制到剪贴板')); };
  window.copyViaHost(lastOut, function(ok){ if (ok) done(); else fb(); });
  function fb(){
    var ta = document.createElement('textarea');
    ta.value = lastOut; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){}
    document.body.removeChild(ta);
  }
}

// ==================== 解析：通用 ====================
function normalize(headers, rows, forceHeader){
  var colN = (headers ? headers.length : 0);
  rows.forEach(function(r){ if (r.length > colN) colN = r.length; });
  function pad(r){ while (r.length < colN) r.push(''); return r; }
  if (!headers){
    if (forceHeader && rows.length){ headers = pad(rows.shift()); }
    else { headers = []; for (var i = 0; i < colN; i++) headers.push('col_' + (i + 1)); }
  }
  pad(headers);
  rows.forEach(pad);
  return { headers: headers, rows: rows };
}

// ==================== 解析：Markdown ====================
function splitMDRow(line){
  var s = line.trim();
  if (s.charAt(0) === '|') s = s.slice(1);
  if (s.charAt(s.length - 1) === '|' && s.slice(-2) !== '\\|') s = s.slice(0, -1);
  var out = [], cur = '', i = 0;
  while (i < s.length){
    var c = s[i];
    if (c === '\\' && s[i+1] === '|'){ cur += '|'; i += 2; continue; }
    if (c === '|'){ out.push(cur.trim()); cur = ''; i++; continue; }
    cur += c; i++;
  }
  out.push(cur.trim());
  return out;
}
function parseMD(text){
  var lines = text.replace(/\r\n?/g, '\n').split('\n').filter(function(l){ return l.trim() !== '' });
  if (!lines.length || lines[0].indexOf('|') < 0) throw new Error('no markdown table found');
  var sepIdx = -1;
  for (var i = 1; i < lines.length; i++){
    if (/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i]) && lines[i].indexOf('|') > -1){ sepIdx = i; break; }
  }
  var rows = lines.map(splitMDRow).filter(function(r){ return !(r.length === 1 && r[0] === '') });
  if (sepIdx > 0){
    var headers = rows[sepIdx - 1];
    return normalize(headers, rows.slice(sepIdx + 1));
  }
  return normalize(null, rows, true);
}

// ==================== 解析：CSV ====================
function parseDelimited(text, delim){
  var rows = [], row = [], cell = '', i = 0, q = false;
  text = text.replace(/\r\n?/g, '\n');
  while (i < text.length){
    var c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i += 2; } else { q = false; i++; } }
      else { cell += c; i++; }
    } else {
      if (c === '"'){ q = true; i++; }
      else if (c === delim){ row.push(cell); cell = ''; i++; }
      else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; i++; }
      else { cell += c; i++; }
    }
  }
  row.push(cell); rows.push(row);
  while (rows.length && rows[rows.length - 1].join('') === '') rows.pop();
  return rows;
}
function detectDelim(line){
  var best = ',', bestN = -1;
  [',', ';', '\t', '|'].forEach(function(d){
    var n = line.split(d).length - 1;
    if (n > bestN){ bestN = n; best = d; }
  });
  return best;
}
function parseCSV(text){
  var firstLine = text.replace(/\r\n?/g, '\n').split('\n').filter(function(l){ return l.trim() !== '' })[0] || '';
  var delim = detectDelim(firstLine);
  var rows = parseDelimited(text, delim);
  if (!rows.length) throw new Error('empty table');
  return normalize(null, rows, true);
}

// ==================== 解析：JSON ====================
function parseJSONTable(text){
  var d = JSON.parse(text);
  if (!Array.isArray(d)) throw new Error('JSON 需要是数组（对象数组或二维数组）');
  if (!d.length) throw new Error('空数组');
  if (typeof d[0] === 'object' && d[0] !== null && !Array.isArray(d[0])){
    var headers = [];
    d.forEach(function(o){ Object.keys(o).forEach(function(k){ if (headers.indexOf(k) < 0) headers.push(k); }); });
    var rows = d.map(function(o){
      return headers.map(function(k){
        var v = o[k];
        if (v === undefined || v === null) return '';
        return (typeof v === 'object') ? JSON.stringify(v) : String(v);
      });
    });
    return normalize(headers, rows);
  }
  var arr = d.map(function(r){
    return (Array.isArray(r) ? r : [r]).map(function(v){
      if (v === null || v === undefined) return '';
      return (typeof v === 'object') ? JSON.stringify(v) : String(v);
    });
  });
  return normalize(null, arr, true);
}

// ==================== 解析：HTML ====================
function parseHTML(text){
  var doc = new DOMParser().parseFromString(text, 'text/html');
  var table = doc.querySelector('table');
  if (!table) throw new Error('未找到 <table>');
  var trs = Array.prototype.slice.call(table.querySelectorAll('tr'));
  var allRows = trs.map(function(tr){
    return Array.prototype.slice.call(tr.querySelectorAll('th,td')).map(function(c){ return c.textContent.trim(); });
  }).filter(function(r){ return r.length; });
  if (!allRows.length) throw new Error('表格为空');
  var hasTh = !!table.querySelector('th');
  var theadCells = table.querySelector('thead th');
  if (theadCells){
    var hCount = table.querySelectorAll('thead th').length;
    var headers = allRows[0];
    return normalize(headers, allRows.slice(1));
  }
  if (hasTh){
    var firstTh = allRows[0], restOk = trs[0] && trs[0].querySelector('th');
    return normalize(firstTh, allRows.slice(restOk ? 1 : 0));
  }
  return normalize(null, allRows, true);
}

// ==================== 渲染 ====================
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function renderMD(t){
  var widths = t.headers.map(function(h, i){
    var w = String(h).length;
    t.rows.forEach(function(r){ if (String(r[i]).length > w) w = String(r[i]).length; });
    return w;
  });
  function line(cells){
    return '| ' + cells.map(function(c, i){ return String(c) + new Array(widths[i] - String(c).length + 1).join(' '); }).join(' | ') + ' |';
  }
  var out = [line(t.headers)];
  out.push('| ' + widths.map(function(w){ return new Array(w + 1).join('-'); }).join(' | ') + ' |');
  t.rows.forEach(function(r){ out.push(line(r)); });
  return out.join('\n');
}
function renderCSV(t, delim){
  function cell(v){
    v = String(v);
    if (v.indexOf('"') > -1) v = '"' + v.replace(/"/g, '""') + '"';
    else if (v.indexOf(delim) > -1 || v.indexOf('\n') > -1) v = '"' + v + '"';
    return v;
  }
  var lines = [t.headers.map(cell).join(delim)];
  t.rows.forEach(function(r){ lines.push(r.map(cell).join(delim)); });
  return lines.join('\n');
}
function renderJSON(t){
  var arr = t.rows.map(function(r){
    var o = {};
    t.headers.forEach(function(h, i){ o[h] = r[i]; });
    return o;
  });
  return JSON.stringify(arr, null, 2);
}
function renderHTML(t){
  var out = ['<table>', '  <thead>', '    <tr>'];
  t.headers.forEach(function(h){ out.push('      <th>' + esc(h) + '</th>'); });
  out.push('    </tr>', '  </thead>', '  <tbody>');
  t.rows.forEach(function(r){
    out.push('    <tr>');
    r.forEach(function(c){ out.push('      <td>' + esc(c) + '</td>'); });
    out.push('    </tr>');
  });
  out.push('  </tbody>', '</table>');
  return out.join('\n');
}

// ==================== 主流程 ====================
function detectFormat(text){
  var t = text.trim();
  try { JSON.parse(t); return 'json'; } catch(e){}
  if (/<table[\s>]/i.test(t)) return 'html';
  var l2 = (t.split('\n').find(function(l){ return l.trim() !== '' }) || '');
  if (l2.charAt(0) === '|' || /\|\s*[-:]/.test(t)) return 'md';
  return 'csv';
}
var SRC_LABEL = { md:'Markdown', csv:'CSV', json:'JSON', html:'HTML' };
function convert(){
  var src = $('in').value;
  $('out').textContent = ''; lastOut = ''; lastTable = null;
  $('sepWrap').classList.toggle('show', cur.fmt === 'csv');
  if (!src.trim()){ status(L('请先输入内容')); updateLabels(); return; }
  try {
    var fmt = detectFormat(src);
    var t;
    if (fmt === 'json') t = parseJSONTable(src);
    else if (fmt === 'html') t = parseHTML(src);
    else if (fmt === 'md') t = parseMD(src);
    else t = parseCSV(src);
    lastTable = t;
    if (cur.fmt === fmt){
      status(isEn() ? ('Input is already ' + FMT_LABEL[fmt]) : ('输入已是 ' + FMT_LABEL[fmt] + '，换一个输出格式看看'));
      updateLabels(); return;
    }
    var delim = $('sepSel').value.replace('\\t', '\t');
    lastOut = cur.fmt === 'md' ? renderMD(t) : cur.fmt === 'csv' ? renderCSV(t, delim)
            : cur.fmt === 'json' ? renderJSON(t) : renderHTML(t);
    $('out').textContent = lastOut;
    status((isEn() ? 'Detected ' : '识别 ') + FMT_LABEL[fmt] + ' · ' +
           (isEn() ? (t.rows.length + ' rows x ' + t.headers.length + ' cols -> ') : (t.rows.length + ' 行 × ' + t.headers.length + ' 列 → ')) +
           FMT_LABEL[cur.fmt]);
  } catch(e){
    status((isEn() ? 'Parse failed: ' : '解析失败：') + (e.message || e), true);
  }
  updateLabels();
}
function updateLabels(){
  $('outLabelText') ;
  var lbl = document.querySelector('.cc-pane:last-child .cc-label');
  if (lbl) lbl.textContent = (isEn() ? 'Output · ' : '输出 · ') + FMT_LABEL[cur.fmt];
  $('copyBtn').textContent = L('📋 复制');
  $('srcBadge').textContent = L('输入格式：自动识别');
}

// ==================== 交互绑定 ====================
document.querySelectorAll('#outTabs .p-tab').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('#outTabs .p-tab').forEach(function(x){ x.classList.remove('p-tab-active'); });
    b.classList.add('p-tab-active');
    cur.fmt = b.dataset.fmt;
    convert();
  });
});
$('sepSel').addEventListener('change', convert);
var debounceTimer = null;
$('in').addEventListener('input', function(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(convert, 200);
});
window.addEventListener('message', function(e){
  var d = e.data;
  if (d && d.type === 'plugin:theme' && d.data){
    if (d.data.locale) document.documentElement.setAttribute('lang', d.data.locale);
    updateLabels();
    convert();
  }
});
updateLabels();
status(L('请先输入内容'));
</script>
</body>
</html>

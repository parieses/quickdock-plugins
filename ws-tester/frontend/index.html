<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSocket 测试</title>
<link rel="stylesheet" href="qd-theme.css">
<style>
.app{display:flex;flex-direction:column;height:100%;padding:var(--sp-4);gap:var(--sp-2);box-sizing:border-box}
.row{display:flex;gap:var(--sp-2);align-items:center}
.input{flex:1;padding:9px 12px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-size:13px;outline:none}
.input:focus{border-color:var(--accent,#4a9eff)}
.btn{padding:9px 16px;background:var(--accent,#4a9eff);color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:13px;font-weight:600}
.btn-ghost{padding:9px 14px;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{font-size:12px;color:var(--text-muted);min-height:16px}
.msgs{flex:1;overflow-y:auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-2);display:flex;flex-direction:column;gap:4px;font-size:12px}
.msg{display:flex;gap:8px;padding:3px 6px;border-radius:var(--radius-sm)}
.msg.recv{background:var(--bg-primary)}
.msg.send{background:var(--accent-soft,#1d2b3a);align-self:flex-end;max-width:85%}
.msg .ts{color:var(--text-muted);flex-shrink:0}
.msg .dir{font-weight:700;flex-shrink:0}
.msg.recv .dir{color:var(--success,#34d399)}
.msg.send .dir{color:var(--accent,#4a9eff)}
.msg .data{color:var(--text-primary);word-break:break-all;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap}
.send-row{display:flex;gap:var(--sp-2)}
.send-row textarea{flex:1;height:54px;resize:none;padding:8px 10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-size:12px;font-family:ui-monospace,Consolas,monospace;outline:none;box-sizing:border-box}
.send-row textarea:focus{border-color:var(--accent,#4a9eff)}
</style>
</head>
<body>
<div class="app">
  <div class="row">
    <input id="url" class="input" placeholder="ws:// 或 wss:// 地址" spellcheck="false" autofocus>
    <button id="btnConnect" class="btn">连接</button>
    <button id="btnDisconnect" class="btn-ghost" disabled>断开</button>
  </div>
  <div id="status" class="status"></div>
  <div id="msgs" class="msgs"></div>
  <div class="send-row">
    <textarea id="sendText" placeholder="输入要发送的消息…（连接后可发送）" disabled></textarea>
    <button id="btnSend" class="btn" disabled>发送</button>
  </div>
</div>
<script>
(function(){
  'use strict'
  var connId=null, pollTimer=null
  var urlInput=document.getElementById('url')
  var status=document.getElementById('status')
  var msgs=document.getElementById('msgs')
  var sendText=document.getElementById('sendText')
  var btnConnect=document.getElementById('btnConnect')
  var btnDisconnect=document.getElementById('btnDisconnect')
  var btnSend=document.getElementById('btnSend')

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  var seq=0, pend={}
  function send(command,input){
    return new Promise(function(resolve,reject){
      var id='ws_'+(++seq)
      pend[id]={resolve:resolve,reject:reject}
      parent.postMessage({type:'plugin:execute',id:id,command:command,input:input||{}},'*')
    })
  }
  window.addEventListener('message',function(e){
    var d=e.data
    if(!d||d.type!=='plugin:result'||!d.id||!pend[d.id])return
    var p=pend[d.id];delete pend[d.id]
    if(d.error)p.reject(new Error(d.error));else p.resolve(d.data)
  })

  function setConnected(on){
    btnConnect.disabled=on
    btnDisconnect.disabled=!on
    sendText.disabled=!on
    btnSend.disabled=!on
  }
  function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}

  function connect(){
    var u=urlInput.value.trim()
    if(!u){status.textContent='请输入 URL';return}
    status.textContent='连接中…'
    send('connect',{url:u}).then(function(r){
      if(!r.async){status.textContent='连接失败';return}
      connId=r.taskId
      status.textContent='已连接'
      setConnected(true)
      startPoll()
    }).catch(function(e){status.textContent='连接失败：'+(e&&e.message?e.message:e)})
  }

  function startPoll(){
    stopPoll()
    pollTimer=setInterval(function(){
      if(!connId)return
      send('task-status',{taskId:connId}).then(function(r){
        if(r.status==='missing'){status.textContent='连接已断开';setConnected(false);stopPoll();return}
        renderMessages(r.messages||[])
        if(r.state==='closed'){status.textContent='连接已关闭';setConnected(false);stopPoll()}
      }).catch(function(){})
    },500)
  }

  var lastCount=-1
  function renderMessages(list){
    if(list.length===lastCount)return
    lastCount=list.length
    msgs.innerHTML=list.map(function(m){
      var cls=m.dir==='send'?'send':'recv'
      return '<div class="msg '+cls+'"><span class="ts">'+esc(m.ts||'')+'</span>'+
        '<span class="dir">'+(m.dir==='send'?'▶':'◀')+'</span>'+
        '<span class="data">'+esc(m.data)+'</span></div>'
    }).join('')
    msgs.scrollTop=msgs.scrollHeight
  }

  function doSend(){
    if(!connId)return
    var txt=sendText.value
    if(!txt)return
    send('send',{taskId:connId,message:txt}).then(function(r){
      if(r.ok){sendText.value=''}
    })
  }

  function disconnect(){
    if(!connId)return
    send('close',{taskId:connId}).then(function(){
      status.textContent='已断开'
      setConnected(false)
      stopPoll()
      connId=null
      lastCount=-1
    })
  }

  btnConnect.addEventListener('click',connect)
  btnDisconnect.addEventListener('click',disconnect)
  btnSend.addEventListener('click',doSend)
  sendText.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))doSend()})
  urlInput.addEventListener('keydown',function(e){if(e.key==='Enter')connect()})
})()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件哈希</title>
<link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">
<style>
.app{display:flex;flex-direction:column;height:100%;padding:var(--sp-4);gap:var(--sp-3);box-sizing:border-box}
.row{display:flex;gap:var(--sp-2);align-items:center}
.btn{padding:9px 16px;background:var(--accent,#4a9eff);color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:13px;font-weight:600}
.btn-ghost{padding:9px 14px;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;font-size:13px}
.hint{font-size:12px;color:var(--text-muted);min-height:16px}
.pathbox{flex:1;padding:8px 10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-secondary);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea{width:100%;height:120px;resize:vertical;padding:9px 12px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-size:13px;font-family:ui-monospace,Consolas,monospace;outline:none;box-sizing:border-box}
textarea:focus{border-color:var(--accent,#4a9eff)}
.algos{display:flex;gap:14px;font-size:12px;color:var(--text-secondary)}
.algos label{display:flex;align-items:center;gap:4px;cursor:pointer}
.result{margin-top:auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-3);display:flex;flex-direction:column;gap:8px}
.res-line{display:flex;gap:10px;align-items:center;font-size:12px}
.res-algo{color:var(--accent,#4a9eff);font-weight:700;width:54px;flex-shrink:0}
.res-hash{flex:1;font-family:ui-monospace,Consolas,monospace;color:var(--text-primary);word-break:break-all}
.copy{font-size:11px;color:var(--text-muted);cursor:pointer;flex-shrink:0}
.copy:hover{color:var(--accent,#4a9eff)}
.hidden{display:none}
</style>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></symbol><symbol id="icon-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></symbol><symbol id="icon-git-branch" viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></symbol><symbol id="icon-trash-2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></symbol><symbol id="icon-shield-alert" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></symbol><symbol id="icon-hard-drive" viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12"></line><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></symbol><symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></symbol><symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></symbol><symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></symbol><symbol id="icon-gauge" viewBox="0 0 24 24"><path d="M12 15l-2-2"></path><path d="M19.07 4.93a10 10 0 1 1-14.14 0"></path><path d="M12 2v4"></path></symbol><symbol id="icon-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></symbol></svg>
</head>
<body>
<div class="app">
  <div class="row" style="flex:1">
    <div id="pathBox" class="pathbox">未选择文件</div>
    <button id="btnPick" class="btn-ghost">选择文件</button>
  </div>
  <div class="algos" id="algos">
    <label><input type="radio" name="algo" value="md5"> MD5</label>
    <label><input type="radio" name="algo" value="sha1"> SHA1</label>
    <label><input type="radio" name="algo" value="sha256" checked> SHA256</label>
    <label><input type="radio" name="algo" value="sha512"> SHA512</label>
  </div>
  <div class="row">
    <button id="btnCalc" class="btn">计算</button>
    <span id="hint" class="hint"></span>
  </div>
  <div id="result" class="result hidden"></div>
</div>

<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
</script>
<script>
(function(){
  'use strict'
  var filePath=''
  var pathBox=document.getElementById('pathBox')
  var result=document.getElementById('result')
  var hint=document.getElementById('hint')

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function copyText(t){
    try{ if(window.host&&window.host.clipboard&&window.host.clipboard.write){return window.host.clipboard.write(t)} }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t)}
    return new Promise(function(res){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();res()})
  }

  var seq=0, pend={}
  function send(command,input){
    return new Promise(function(resolve,reject){
      var id='hash_'+(++seq)
      pend[id]={resolve:resolve,reject:reject}
      parent.postMessage({type:'plugin:execute',id:id,command:command,input:input||{}},'*')
    })
  }
  window.addEventListener('message',function(e){
    var d=e.data
    if(!d||d.type!=='plugin:result'||!d.id||!pend[d.id])return
    var p=pend[d.id];delete pend[d.id]
    if(d.error)p.reject(new Error(d.error));else p.resolve(d.data)
  })

  document.getElementById('btnPick').addEventListener('click',function(){
    hint.textContent='打开文件选择框…'
    qdPickFile({title:'选择要计算哈希的文件'}).then(function(p){
      if(!p){hint.textContent='已取消';return}
      filePath=p;pathBox.textContent=p;hint.textContent=''
    }).catch(function(e){hint.textContent='选择失败：'+(e&&e.message?e.message:e)})
  })

  function doCalc(){
    var algo=document.querySelector('input[name=algo]:checked').value
    if(!filePath){hint.textContent='请先选择文件';return}
    hint.textContent='计算中…'
    var input={algo:algo}
    input.path=filePath
    send('calc',input).then(function(r){
      result.classList.remove('hidden')
      result.innerHTML='<div class="res-line"><span class="res-algo">'+esc(r.algo.toUpperCase())+'</span>'+
        '<span class="res-hash">'+esc(r.hash)+'</span><span class="copy" data-v="'+esc(r.hash)+'">复制</span></div>'
      hint.textContent='完成'
    }).catch(function(e){hint.textContent='计算失败：'+(e&&e.message?e.message:e)})
  }

  result.addEventListener('click',function(e){
    if(e.target.classList.contains('copy')){
      copyText(e.target.getAttribute('data-v')).then(function(){var o=e.target.textContent;e.target.textContent='已复制';setTimeout(function(){e.target.textContent=o},1200)})
    }
  })
  document.getElementById('btnCalc').addEventListener('click',doCalc)
})()
</script>
</body>
</html>

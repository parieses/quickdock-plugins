<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件哈希</title>
<link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">
<style>
.app{display:flex;flex-direction:column;height:100%;padding:var(--sp-4);gap:var(--sp-3);box-sizing:border-box}
.row{display:flex;gap:var(--sp-2);align-items:center}
.btn-ghost{padding:9px 14px;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;font-size:13px;white-space:nowrap}
.hint{font-size:12px;color:var(--text-muted);min-height:16px}
.pathbox{flex:1;padding:8px 10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-secondary);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result{margin-top:var(--sp-2);background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-3);display:flex;flex-direction:column;gap:8px}
.res-line{display:flex;gap:10px;align-items:center;font-size:12px}
.res-algo{color:var(--accent,#4a9eff);font-weight:700;width:56px;flex-shrink:0}
.res-hash{flex:1;font-family:ui-monospace,Consolas,monospace;color:var(--text-primary);word-break:break-all;min-height:14px}
.res-hash.pending{color:var(--text-muted)}
.res-hash.error{color:#ff5a6e}
.copy{font-size:11px;color:var(--text-muted);cursor:pointer;flex-shrink:0}
.copy:hover{color:var(--accent,#4a9eff)}
.copy.disabled{visibility:hidden}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="row">
    <div id="pathBox" class="pathbox">未选择文件</div>
    <button id="btnPick" class="btn-ghost">选择文件</button>
  </div>
  <div class="row"><span id="hint" class="hint"></span></div>
  <div id="result" class="result hidden"></div>
</div>

<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
</script>
<script>
(function(){
  'use strict'
  var ALGOS=['md5','sha1','sha256','sha512']
  var filePath=''
  var pathBox=document.getElementById('pathBox')
  var result=document.getElementById('result')
  var hint=document.getElementById('hint')
  var lines={}   // algo -> {hash, copy}

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function copyText(t){
    try{ if(window.host&&window.host.clipboard&&window.host.clipboard.write){return window.host.clipboard.write(t)} }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t)}
    return new Promise(function(res){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();res()})
  }

  var seq=0, pend={}
  function send(command,input){
    return new Promise(function(resolve,reject){
      var id='hash_'+(++seq)
      pend[id]={resolve:resolve,reject:reject}
      parent.postMessage({type:'plugin:execute',id:id,command:command,input:input||{}},'*')
      setTimeout(function(){var t=pend[id];if(t&&!t.__timeout){t.__timeout=1;(t.reject||t.rej)(new Error('请求超时：后端 30 秒无响应'))}},30000)
    })
  }
  window.addEventListener('message',function(e){
    var d=e.data
    if(!d||d.type!=='plugin:result'||!d.id||!pend[d.id])return
    var p=pend[d.id];delete pend[d.id]
    if(d.error)p.reject(new Error(d.error));else p.resolve(d.data)
  })

  document.getElementById('btnPick').addEventListener('click',function(){
    hint.textContent='打开文件选择框…'
    qdPickFile({title:'选择要计算哈希的文件'}).then(function(p){
      if(!p){hint.textContent='已取消';return}
      filePath=p;pathBox.textContent=p;hint.textContent=''
      calcAll()
    }).catch(function(e){hint.textContent='选择失败：'+(e&&e.message?e.message:e)})
  })

  function renderSkeleton(){
    result.classList.remove('hidden')
    result.innerHTML=''
    lines={}
    ALGOS.forEach(function(algo){
      var line=document.createElement('div')
      line.className='res-line'
      var a=document.createElement('span')
      a.className='res-algo'
      a.textContent=algo.toUpperCase()
      var h=document.createElement('span')
      h.className='res-hash pending'
      h.textContent='计算中…'
      var c=document.createElement('span')
      c.className='copy disabled'
      c.textContent='复制'
      line.appendChild(a);line.appendChild(h);line.appendChild(c)
      result.appendChild(line)
      lines[algo]={hash:h,copy:c}
    })
  }

  var epoch=0   // 每选一次文件就 +1：上一个文件的回包晚到时直接丢弃，避免把旧值写进新结果
  function calcAll(){
    if(!filePath){hint.textContent='请先选择文件';return}
    hint.textContent='计算中…'
    renderSkeleton()
    var my=++epoch
    // 一次请求算四种摘要（后端 io.MultiWriter 单次读盘）；文件只读一遍
    send('calc',{mode:'file',path:filePath,algo:'all'}).then(function(r){
      if(my!==epoch)return
      var hs=(r&&r.hashes)||{}
      ALGOS.forEach(function(algo){
        var L=lines[algo];if(!L)return
        var v=hs[algo]||''
        L.hash.classList.remove('pending')
        L.hash.textContent=v||'(未返回)'
        if(v){L.copy.classList.remove('disabled');L.copy.setAttribute('data-v',v)}
      })
      hint.textContent='完成'
    }).catch(function(e){
      if(my!==epoch)return
      ALGOS.forEach(function(algo){
        var L=lines[algo];if(!L)return
        L.hash.classList.remove('pending')
        L.hash.classList.add('error')
        L.hash.textContent='失败：'+(e&&e.message?e.message:e)
      })
      hint.textContent=''
    })
  }

  result.addEventListener('click',function(e){
    if(e.target.classList.contains('copy')&&!e.target.classList.contains('disabled')){
      var v=e.target.getAttribute('data-v')
      copyText(v).then(function(){var o=e.target.textContent;e.target.textContent='已复制';setTimeout(function(){e.target.textContent=o},1200)})
    }
  })
})()
</script>

</body>
</html>

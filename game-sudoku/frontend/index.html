<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数独</title>
<link rel="stylesheet" href="qd-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="sd-app">
  <div class="sd-head">
    <div class="sd-title">🧩 数独</div>
    <label class="sd-diff">
      <select id="diff">
        <option value="easy">简单</option>
        <option value="medium" selected>中等</option>
        <option value="hard">困难</option>
        <option value="expert">专家</option>
      </select>
    </label>
    <button class="p-btn p-btn-primary" id="new" type="button">新局</button>
  </div>
  <div class="sd-bar">
    <div class="sd-timer" id="timer">00:00</div>
    <div class="sd-best" id="best">最佳 —</div>
    <button class="p-btn" id="notes" type="button">笔记：关</button>
    <button class="p-btn" id="hint" type="button">提示</button>
  </div>
  <div class="sd-board" id="board"></div>
  <div class="sd-pad" id="pad"></div>
  <div class="sd-msg" id="msg">点格子后按数字键 / 点数字盘填入</div>
</div>
<script src="app.js"></script>

<!-- 跟随宿主浅色/深色主题 -->
  <script>
  /* qd-theme-follow：把宿主的浅色/深色同步到 <html data-theme>
     （qd-theme.css 里浅色是 html[data-theme="light"] 的变量覆盖）。
     三级取值，任意一级拿到就生效，互为兜底：
       1) 宿主消息 plugin:theme / plugin:init（宿主若补上独立窗口的广播即走这条）
       2) 同源 opener / parent 窗口的 <html data-theme>，并监听其变化、窗口 focus 时重读
       3) 系统偏好 prefers-color-scheme（宿主主题=「跟随系统」时有效）
     独立注册，不改动页面原有逻辑。 */
  (function () {
    var el = document.documentElement;
    function set(t) { if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); }
    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || !d.type) return;
      if (d.type === 'plugin:theme' || d.type === 'plugin:init') { if (d.data && d.data.theme) set(d.data.theme); }
    });
    /* 2) 同源窗口 */
    var w = null;
    try {
      if (window.opener && window.opener !== window) w = window.opener;
      else if (window.parent && window.parent !== window) w = window.parent;
    } catch (err) { w = null; }
    function fromWin() {
      try { var t = w.document.documentElement.getAttribute('data-theme'); if (t) { set(t); return true; } return false; }
      catch (err) { return false; }
    }
    if (w && fromWin()) {
      try {
        new MutationObserver(fromWin).observe(w.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      } catch (err) {}
      window.addEventListener('focus', fromWin);
    }
    /* 3) 系统偏好兜底：仅在还没拿到明确主题时生效 */
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var sys = function () { if (!el.getAttribute('data-theme')) set(mq.matches ? 'light' : 'dark'); };
      sys();
      if (mq.addEventListener) mq.addEventListener('change', sys);
    }
  })();
  </script>
<!-- 运行期异常上报：未捕获异常 / Promise 拒绝 -> 宿主 plugin-YYYYMMDD.log（E 级） -->
<script>
(function () {
  if (window.__qdErrHook) return
  window.__qdErrHook = true
  var sent = 0, last = {}
  function report(kind, msg, stack) {
    try {
      if (sent >= 20) return // 单页最多 20 条，防止循环报错刷屏
      var key = kind + '|' + msg
      var now = Date.now()
      if (last[key] && now - last[key] < 10000) return // 同一错误 10s 内只报一次
      last[key] = now
      sent++
      if (typeof window.qdHostCall !== 'function') return
      window.qdHostCall('log.error', {
        message: '前端' + kind + ': ' + msg + (stack ? ' | ' + String(stack).slice(0, 600) : '')
      }).catch(function () {})
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    report('未捕获异常', (e && e.message) || 'unknown', e && e.error && e.error.stack)
  })
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason
    report('Promise 拒绝', (r && r.message) || String(r), r && r.stack)
  })
})()
</script>
</body>
</html>

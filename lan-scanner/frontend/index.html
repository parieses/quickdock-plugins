<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局域网扫描</title>
<link rel="stylesheet" href="qd-theme.css">
<style>
.app{display:flex;flex-direction:column;height:100%;padding:var(--sp-3);gap:var(--sp-2);box-sizing:border-box}
.row{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
select,.input,.mini{padding:8px 10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:13px;outline:none;font-family:ui-monospace,Consolas,monospace}
.input{flex:1;min-width:160px}
select{cursor:pointer}
.mini{width:74px}
select:focus,.input:focus,.mini:focus{border-color:var(--accent,#4a9eff)}
.lbl{font-size:11px;color:var(--text-muted);white-space:nowrap}
.btn{padding:8px 18px;background:var(--accent,#4a9eff);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.stop{background:var(--danger,#e24b4a)}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);cursor:pointer}
.hint{font-size:12px;color:var(--text-muted);min-height:16px}
.hint.err{color:var(--danger,#e24b4a)}
.wrap{flex:1;overflow:auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg)}
table{width:100%;border-collapse:collapse;font-family:ui-monospace,Consolas,monospace;font-size:12px}
th{position:sticky;top:0;background:var(--bg-secondary);text-align:left;color:var(--text-muted);font-weight:500;font-size:11px;padding:7px 8px;border-bottom:1px solid var(--border);z-index:1}
td{padding:6px 8px;color:var(--text-primary);border-bottom:1px solid var(--border)}
tr:hover td{background:var(--bg-hover,rgba(255,255,255,.03))}
.ip{color:var(--accent,#4a9eff);font-weight:600}
.mac{color:var(--text-secondary)}
.vendor{color:var(--text-secondary)}
.self-tag{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--accent,#4a9eff);color:#fff;margin-left:6px}
.port{display:inline-block;font-size:10px;padding:1px 5px;margin:1px 2px 1px 0;border-radius:3px;background:var(--bg-primary);color:var(--text-secondary);border:1px solid var(--border)}
.empty{color:var(--text-muted);font-size:12px;padding:24px;text-align:center}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent,#4a9eff);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="row">
    <select id="cidr" style="flex:1"></select>
    <input id="cidrManual" class="input" placeholder="或手动输入网段，如 192.168.1.0/24" spellcheck="false">
    <button id="btnScan" class="btn">扫描</button>
  </div>
  <div class="row">
    <span class="lbl" id="t-timeout">超时(ms)</span>
    <input id="timeout" class="mini" type="number" value="600" min="100" max="5000">
    <label class="chk"><input id="resolve" type="checkbox" checked><span id="t-resolve">解析主机名</span></label>
    <label class="chk"><input id="icmp" type="checkbox" checked><span id="t-icmp">ICMP 探测</span></label>
    <span style="flex:1"></span>
    <span id="status" class="lbl"></span>
  </div>
  <div id="hint" class="hint"></div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th id="t-c-ip">IP</th>
        <th id="t-c-host">主机名</th>
        <th id="t-c-mac">MAC</th>
        <th id="t-c-vendor">厂商</th>
        <th id="t-c-rtt">延迟</th>
        <th id="t-c-ports">开放端口</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty">点击「扫描」发现同网段设备</div>
  </div>
</div>
<script>
(function(){
  'use strict'

  /* ---------- i18n ---------- */
  var L10N = {
    'en-US': {
      '超时(ms)':'Timeout(ms)','解析主机名':'Resolve hostnames','ICMP 探测':'ICMP probe',
      '扫描':'Scan','扫描中':'Scanning','IP':'IP','主机名':'Hostname','MAC':'MAC',
      '厂商':'Vendor','延迟':'Latency','开放端口':'Open ports',
      '或手动输入网段，如 192.168.1.0/24':'Or enter a subnet, e.g. 192.168.1.0/24',
      '点击「扫描」发现同网段设备':'Click Scan to discover devices on your subnet',
      '本机':'this device','扫描完成':'Scan complete','未发现设备':'No devices found',
      '未检测到可用的本地网段':'No usable local subnet detected'
    }
  }
  function L(k){
    var loc = document.documentElement.getAttribute('lang') || 'zh-CN'
    var map = L10N[loc] || L10N[loc.split('-')[0]] || {}
    return (map && map[k] !== undefined) ? map[k] : k
  }
  function renderStatic(){
    var m = {'t-timeout':'超时(ms)','t-resolve':'解析主机名','t-icmp':'ICMP 探测',
             't-c-ip':'IP','t-c-host':'主机名','t-c-mac':'MAC','t-c-vendor':'厂商',
             't-c-rtt':'延迟','t-c-ports':'开放端口'}
    for (var id in m) document.getElementById(id).textContent = L(m[id])
    document.getElementById('cidrManual').placeholder = L('或手动输入网段，如 192.168.1.0/24')
    if (!scanning) document.getElementById('btnScan').textContent = L('扫描')
    if (!hosts.length) document.getElementById('empty').textContent = L('点击「扫描」发现同网段设备')
  }

  /* ---------- RPC ---------- */
  var seq = 0, pend = {}
  function send(command, input){
    return new Promise(function(resolve, reject){
      var id = 'ls_' + (++seq)
      pend[id] = { resolve: resolve, reject: reject }
      parent.postMessage({ type:'plugin:execute', id:id, command:command, input:input || {} }, '*')
    })
  }
  window.addEventListener('message', function(e){
    var d = e.data
    if (!d) return
    if (d.type === 'plugin:result' && d.id && pend[d.id]) {
      var p = pend[d.id]; delete pend[d.id]
      if (d.error) p.reject(new Error(d.error)); else p.resolve(d.data)
      return
    }
    if (d.type === 'plugin:theme') {
      var dd = d.data || {}
      if (dd.locale) document.documentElement.setAttribute('lang', dd.locale)
      renderStatic(); if (hosts.length) renderTable()
    }
  })

  /* ---------- 状态 ---------- */
  var scanning = false, hosts = [], selfIps = {}
  var sessionId = null, pollTimer = null, t0 = 0
  var el = function(id){ return document.getElementById(id) }
  var hint = el('hint'), tbody = el('tbody'), emptyEl = el('empty'), statusEl = el('status')

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

  /* ---------- 加载本机网段 ---------- */
  function loadInterfaces(){
    send('interfaces', {}).then(function(r){
      var list = r.interfaces || []
      var sel = el('cidr')
      sel.innerHTML = ''
      selfIps = {}
      if (!list.length) {
        sel.innerHTML = '<option value="">' + L('未检测到可用的本地网段') + '</option>'
        return
      }
      list.forEach(function(it){
        selfIps[it.ip] = true
        var o = document.createElement('option')
        o.value = it.cidr
        o.textContent = it.cidr + '  (' + it.iface + ' · ' + it.ip + ')'
        sel.appendChild(o)
      })
    }).catch(function(e){
      hint.className = 'hint err'
      hint.textContent = e && e.message ? e.message : String(e)
    })
  }

  /* ---------- 渲染 ---------- */
  function renderTable(){
    if (!hosts.length) {
      tbody.innerHTML = ''
      if (scanning) { emptyEl.style.display = 'none'; return }
      emptyEl.style.display = ''; emptyEl.textContent = L('点击「扫描」发现同网段设备'); return
    }
    emptyEl.style.display = 'none'
    var html = ''
    for (var i = 0; i < hosts.length; i++) {
      var h = hosts[i]
      var isSelf = !!selfIps[h.ip]
      var ports = (h.openPorts || []).map(function(p){
        return '<span class="port">' + p + '</span>'
      }).join('')
      html += '<tr>' +
        '<td><span class="ip">' + esc(h.ip) + '</span>' +
          (isSelf ? '<span class="self-tag">' + L('本机') + '</span>' : '') + '</td>' +
        '<td>' + esc(h.hostname || '') + '</td>' +
        '<td class="mac">' + esc(h.mac || '-') + '</td>' +
        '<td class="vendor">' + esc(h.vendor || '') + '</td>' +
        '<td>' + (h.rtt >= 0 ? h.rtt.toFixed(h.rtt < 10 ? 1 : 0) + 'ms' : '-') + '</td>' +
        '<td>' + (ports || '-') + '</td>' +
        '</tr>'
    }
    tbody.innerHTML = html
  }

  function scan(){
    if (scanning) return
    var cidr = el('cidrManual').value.trim() || el('cidr').value
    if (!cidr) { hint.className = 'hint err'; hint.textContent = L('未检测到可用的本地网段'); return }

    scanning = true
    var btn = el('btnScan')
    btn.disabled = true
    btn.innerHTML = '<span class="spin"></span>' + L('扫描中')
    hint.className = 'hint'; hint.textContent = ''
    tbody.innerHTML = ''
    hosts = []
    emptyEl.style.display = 'none'
    t0 = Date.now()

    send('start', {
      cidr: cidr,
      timeout: parseInt(el('timeout').value, 10) || 600,
      resolve: el('resolve').checked,
      icmp: el('icmp').checked
    }).then(function(r){
      sessionId = r.sessionId
      el('btnScan').disabled = false
      el('btnScan').innerHTML = L('停止')
      el('btnScan').classList.add('stop')
      statusEl.textContent = (r.cidr || '') + ' · ICMP ' + (r.icmp ? '可用' : '不可用（仅 TCP）')
      pollTimer = setInterval(poll, 500)
      poll()
    }).catch(function(e){
      hint.className = 'hint err'
      hint.textContent = e && e.message ? e.message : String(e)
      finish()
    })
  }

  // 轮询快照：每 500ms 拉一次，已发现的设备实时追加进表格（扫到一个出一个）
  function poll(){
    if (!sessionId) return
    send('poll', { sessionId: sessionId }).then(function(snap){
      hosts = snap.hosts || []
      renderTable()
      var dt = ((Date.now() - t0) / 1000).toFixed(1)
      statusEl.textContent = (snap.cidr || '') + ' · 已扫描 ' + (snap.scanned || 0) + '/' + (snap.total || 0) +
        ' · 存活 ' + hosts.length + ' 台' + (snap.running ? '' : ' · 完成(' + dt + 's)')
      if (!snap.running) {
        hint.className = 'hint'
        hint.textContent = hosts.length ? L('扫描完成') : L('未发现设备')
        if (!hosts.length) emptyEl.style.display = ''
        finish()
        return
      }
      hint.className = 'hint'
      hint.textContent = hosts.length ? '' : (snap.scanned >= snap.total ? L('未发现设备') : '')
    }).catch(function(e){
      hint.className = 'hint err'
      hint.textContent = e && e.message ? e.message : String(e)
      finish()
    })
  }

  function finish(){
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
    scanning = false
    var b = el('btnScan')
    b.disabled = false
    b.innerHTML = L('扫描')
    b.classList.remove('stop')
    var sid = sessionId; sessionId = null
    if (sid) send('stop', { sessionId: sid }).catch(function(){})
  }

  el('btnScan').addEventListener('click', function(){ if (scanning) finish(); else scan() })
  el('cidrManual').addEventListener('keydown', function(e){ if (e.key === 'Enter') { scanning ? finish() : scan() } })

  renderStatic()
  loadInterfaces()
})()
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小黑屋</title>
<link rel="stylesheet" href="qd-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="dr-app">
  <div class="dr-head">
    <div class="dr-title">🏚 小黑屋</div>
    <div class="dr-turn">第 <b id="turn">0</b> 天</div>
  </div>
  <div class="dr-stats" id="stats"></div>
  <div class="dr-log" id="log"></div>
  <div class="dr-actions">
    <button class="p-btn p-btn-primary" data-act="fire" type="button">🔥 添柴</button>
    <button class="p-btn" data-act="chop" type="button">🪓 砍柴</button>
    <button class="p-btn" data-act="hunt" type="button">🏹 狩猎</button>
    <button class="p-btn" data-act="explore" type="button">🧭 外出探索</button>
  </div>
  <div class="dr-build-label">建造</div>
  <div class="dr-build" id="build"></div>
  <div class="dr-trade" id="trade" hidden>
    <div class="dr-trade-text" id="tradeText"></div>
    <div class="dr-trade-actions">
      <button class="p-btn p-btn-primary" data-trade="yes" type="button">成交</button>
      <button class="p-btn" data-trade="no" type="button">婉拒</button>
    </div>
  </div>
  <div class="dr-over" id="over" hidden>
    <div class="dr-over-text" id="overText"></div>
    <button class="p-btn p-btn-primary" id="again" type="button">再来一局</button>
  </div>
</div>
<script src="app.js"></script>

<!-- 跟随宿主浅色/深色主题 -->
  <script>
  /* qd-theme-follow：把宿主的浅色/深色同步到 <html data-theme>
     （qd-theme.css 里浅色是 html[data-theme="light"] 的变量覆盖）。
     三级取值，任意一级拿到就生效，互为兜底：
       1) 宿主消息 plugin:theme / plugin:init（宿主若补上独立窗口的广播即走这条）
       2) 同源 opener / parent 窗口的 <html data-theme>，并监听其变化、窗口 focus 时重读
       3) 系统偏好 prefers-color-scheme（宿主主题=「跟随系统」时有效）
     独立注册，不改动页面原有逻辑。 */
  (function () {
    var el = document.documentElement;
    function set(t) { if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); }
    window.addEventListener('message', function (e) {
      var d = e && e.data;
      if (!d || !d.type) return;
      if (d.type === 'plugin:theme' || d.type === 'plugin:init') { if (d.data && d.data.theme) set(d.data.theme); }
    });
    /* 2) 同源窗口 */
    var w = null;
    try {
      if (window.opener && window.opener !== window) w = window.opener;
      else if (window.parent && window.parent !== window) w = window.parent;
    } catch (err) { w = null; }
    function fromWin() {
      try { var t = w.document.documentElement.getAttribute('data-theme'); if (t) { set(t); return true; } return false; }
      catch (err) { return false; }
    }
    if (w && fromWin()) {
      try {
        new MutationObserver(fromWin).observe(w.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      } catch (err) {}
      window.addEventListener('focus', fromWin);
    }
    /* 3) 系统偏好兜底：仅在还没拿到明确主题时生效 */
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var sys = function () { if (!el.getAttribute('data-theme')) set(mq.matches ? 'light' : 'dark'); };
      sys();
      if (mq.addEventListener) mq.addEventListener('change', sys);
    }
  })();
  </script>
</body>
</html>

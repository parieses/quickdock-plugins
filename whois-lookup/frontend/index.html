<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHOIS 查询</title>
<link rel="stylesheet" href="qd-theme.css">
<style>
.app{display:flex;flex-direction:column;height:100%;padding:var(--sp-4);gap:var(--sp-3);box-sizing:border-box}
.row{display:flex;gap:var(--sp-2)}
.input{flex:1;padding:9px 12px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-size:13px;outline:none}
.input:focus{border-color:var(--accent,#4a9eff)}
.btn{padding:9px 16px;background:var(--accent,#4a9eff);color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--text-muted);min-height:16px}
.result{flex:1;overflow-y:auto}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-3)}
.meta{font-size:11px;color:var(--text-muted);margin-bottom:8px}
.pre{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.55;color:var(--text-primary);margin:0}
.copy{float:right;font-size:11px;color:var(--text-muted);cursor:pointer}
.copy:hover{color:var(--accent,#4a9eff)}
.empty{font-size:12px;color:var(--text-muted);padding:8px 0}
.err{color:var(--danger,#e24b4a)}
</style>
</head>
<body>
<div class="app">
  <div class="row">
    <input id="q" class="input" placeholder="域名或 IP，如 example.com / 8.8.8.8" spellcheck="false" autofocus>
    <button id="btnQuery" class="btn">查询</button>
  </div>
  <div id="hint" class="hint"></div>
  <div id="result" class="result"></div>
</div>
<script>
(function(){
  'use strict'
  var qInput=document.getElementById('q')
  var hint=document.getElementById('hint')
  var result=document.getElementById('result')

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function copyText(t){
    try{ if(window.host&&window.host.clipboard&&window.host.clipboard.write){return window.host.clipboard.write(t)} }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t)}
    var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()
  }

  var seq=0, pend={}
  function send(command,input){
    return new Promise(function(resolve,reject){
      var id='whois_'+(++seq)
      pend[id]={resolve:resolve,reject:reject}
      parent.postMessage({type:'plugin:execute',id:id,command:command,input:input||{}},'*')
    })
  }
  window.addEventListener('message',function(e){
    var d=e.data
    if(!d||d.type!=='plugin:result'||!d.id||!pend[d.id])return
    var p=pend[d.id];delete pend[d.id]
    if(d.error)p.reject(new Error(d.error));else p.resolve(d.data)
  })

  function doQuery(){
    var q=qInput.value.trim()
    if(!q){hint.textContent='请输入域名或 IP';return}
    hint.textContent='查询中…'
    result.innerHTML=''
    send('lookup',{query:q}).then(function(r){
      if(!r||!r.ok){hint.textContent='查询失败';result.innerHTML='<div class="empty err">'+esc(r&&r.error?r.error:'查询失败')+'</div>';return}
      hint.textContent='查询 '+r.query+' · 服务器 '+r.server+(r.truncated?' · 已截断':'')
      var raw=r.raw||''
      result.innerHTML='<div class="card"><span class="copy" data-v="'+esc(raw)+'">复制</span>'+
        '<div class="meta">WHOIS 服务器: '+esc(r.server)+'</div>'+
        '<pre class="pre">'+esc(raw)+'</pre></div>'
    }).catch(function(e){ hint.textContent='查询失败'; result.innerHTML='<div class="empty err">'+esc(e&&e.message?e.message:e)+'</div>' })
  }

  result.addEventListener('click',function(e){
    if(e.target.classList.contains('copy')){
      copyText(e.target.getAttribute('data-v')).then(function(){var o=e.target.textContent;e.target.textContent='已复制';setTimeout(function(){e.target.textContent=o},1200)})
    }
  })

  document.getElementById('btnQuery').addEventListener('click',doQuery)
  qInput.addEventListener('keydown',function(e){if(e.key==='Enter')doQuery()})
})()
</script>
</body>
</html>

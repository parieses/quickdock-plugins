<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>时间转换</title>
<link rel="stylesheet" href="qd-theme.css">
  <link rel="stylesheet" href="components.css">
<style>
.p-body{flex-direction:column;padding:12px 14px;gap:12px}
.p-body .p-input{font-family:var(--font-mono);font-size:14px;height:34px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:var(--radius);background:var(--bg-secondary);cursor:pointer;transition:background .1s}
.result-row:hover{background:var(--bg-hover)}
.result-row .rk{font-size:12px;color:var(--text-secondary)}
.result-row .rv{font-family:var(--font-mono);font-size:13px;color:var(--text-primary);user-select:all}
.result-row .copied-tip{font-size:10px;color:var(--accent);opacity:0;transition:opacity .2s}
.result-row .copied-tip.show{opacity:1}
</style>
<script>
/* QuickDock sandbox 剪贴板桥接：iframe 内 navigator.clipboard 被 Permissions-Policy 禁用 */
window.__cpSeq=0;
window.execCopyFallback=function(t){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';a.style.top='0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');document.body.removeChild(a);return ok}catch(e){return false}};
window.copyViaHost=function(t,cb){var id='cp_'+(++window.__cpSeq),done=false;function onMsg(e){var d=e&&e.data;if(d&&d.type==='plugin:copy-result'&&d.id===id){done=true;window.removeEventListener('message',onMsg);cb&&cb(!!d.ok)}}window.addEventListener('message',onMsg);parent.postMessage({type:'plugin:copy',id:id,text:t},'*');setTimeout(function(){if(!done){window.removeEventListener('message',onMsg);cb&&cb(window.execCopyFallback(t))}},300)};
</script>

<body>
<div class="p-app">
  <div class="p-toolbar">
    <span class="p-label">时间转换</span>
    <span class="p-spacer"></span>
    <span class="p-muted">支持: Unix 时间戳 / ISO 8601 / 相对时间</span>
  </div>
  <div class="p-body">
    <div class="p-toolbar" style="border:none;padding:0;gap:8px;background:transparent">
      <input id="timeInput" class="input p-input-mono" style="flex:1" placeholder="输入时间 / 时间戳 / now ..." spellcheck="false" />
      <button id="btnConvert" class="btn p-btn-primary">转换</button>
    </div>
    <div class="p-toolbar" style="border:none;padding:0;gap:8px;background:transparent">
      <select id="tzSelect" class="p-select">
        <option value="0">UTC+0 (伦敦)</option>
        <option value="1">UTC+1 (巴黎)</option>
        <option value="3">UTC+3 (莫斯科)</option>
        <option value="5.5">UTC+5.5 (新德里)</option>
        <option value="8" selected>UTC+8 (中国)</option>
        <option value="9">UTC+9 (东京)</option>
        <option value="10">UTC+10 (悉尼)</option>
        <option value="-4">UTC-4 (纽约)</option>
        <option value="-7">UTC-7 (洛杉矶)</option>
        <option value="custom">自定义偏移…</option>
      </select>
      <input id="tzCustom" class="input" type="number" min="-12" max="14" step="0.5" placeholder="偏移小时 (-12 ~ +14)" style="display:none;width:150px" spellcheck="false" />
      <span class="p-muted">输出时区</span>
    </div>
    <div id="results" class="p-list" style="display:flex;flex-direction:column;gap:2px"></div>
  </div>
  <div class="p-statusbar">
    <span class="p-muted">支持: 2025-12-25 / 2025/12/25 / Unix 时间戳 / now / 2025年12月25日</span>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>

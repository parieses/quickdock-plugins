<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码贪吃蛇</title>
<link rel="stylesheet" href="qd-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="cs-app">
  <div class="cs-head">
    <div class="cs-title">{ } 代码贪吃蛇</div>
    <div class="cs-scores">
      <div class="cs-score"><span>分数</span><b id="score">0</b></div>
      <div class="cs-score"><span>最佳</span><b id="best">0</b></div>
      <div class="cs-score"><span>片段</span><b id="snips">0</b></div>
    </div>
  </div>
  <div class="cs-bar">
    <span class="cs-tip" id="tip">方向键 / WASD 移动 · 空格暂停</span>
    <div class="cs-actions">
      <button class="p-btn" id="pause" type="button">暂停</button>
      <button class="p-btn p-btn-primary" id="restart" type="button">重开</button>
    </div>
  </div>
  <canvas id="cv" class="cs-canvas" width="440" height="440"></canvas>
  <div class="cs-card" id="card">
    <div class="cs-card-token" id="cardToken">// 吃下代码碎片看提示</div>
    <div class="cs-card-tip" id="cardTip">用方向键操控蛇，去吞掉散落的代码片段。每吃一个，都会解锁一条开发小贴士。</div>
  </div>
  <div class="cs-over" id="over" hidden>
    <div class="cs-over-text" id="overText">游戏结束</div>
    <button class="p-btn p-btn-primary" id="retry" type="button">再来一局</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
